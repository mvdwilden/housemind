<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="HouseMind">
  <!-- The Orb at rest is the mark (E-166): living light on deep ink (design system "deep and calm"). -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#141c33"/>
      <stop offset="1" stop-color="#0a0e19"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.45" stop-color="#5ed4c4" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#5ed4c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="33%" r="72%">
      <stop offset="0" stop-color="#ecfffb"/>
      <stop offset="0.32" stop-color="#7fdccc"/>
      <stop offset="0.72" stop-color="#2c8f86"/>
      <stop offset="1" stop-color="#145e61"/>
    </radialGradient>
    <clipPath id="inside"><circle cx="128" cy="128" r="62"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#ground)"/>
  <circle cx="128" cy="128" r="104" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="62" fill="url(#orb)"/>
  <!-- The mind inside: a faint network of points and lines. -->
  <g clip-path="url(#inside)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2" fill="#ffffff" fill-opacity="0.6">
    <path d="M102 112 L132 98 L158 120 L140 150 L108 144 Z M132 98 L140 150 M102 112 L158 120" fill="none"/>
    <circle cx="102" cy="112" r="4"/><circle cx="132" cy="98" r="4.5"/><circle cx="158" cy="120" r="4"/>
    <circle cx="140" cy="150" r="4"/><circle cx="108" cy="144" r="3.5"/>
  </g>
  <ellipse cx="108" cy="96" rx="20" ry="12" fill="#ffffff" fill-opacity="0.35" transform="rotate(-28 108 96)"/>
</svg>

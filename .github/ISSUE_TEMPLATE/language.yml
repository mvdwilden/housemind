name: A language
description: A new language, or better words in an existing one.
labels: [language]
body:
  - type: markdown
    attributes:
      value: |
        A language is one file: `knowledge/languages/<code>.yaml`. Copy `en.yaml`, translate the
        texts and keep every `{placeholder}`. Plain, simple language (B1); no brand names. Until a
        native speaker checked it, the app marks it "not yet reviewed".
  - type: input
    id: language
    attributes:
      label: Language and code
      placeholder: "Italiano (it)"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What did you change, or which words were hard?

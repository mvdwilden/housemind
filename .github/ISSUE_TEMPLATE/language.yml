name: A language
description: A language you would like HouseMind to speak, or better words in one it has.
labels: [language]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Say which language, or which words are wrong or hard to understand. The maker
        adds and checks the words; until a native speaker checked a language, the app marks it
        "not yet reviewed".
  - type: input
    id: language
    attributes:
      label: Language and code
      placeholder: "Italiano (it)"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Which words are wrong or hard, and what would be better?

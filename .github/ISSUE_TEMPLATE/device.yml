name: A device kind HouseMind does not know
description: HouseMind says "I only watch this device" or recognises it wrongly.
labels: [catalogue]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Say what Home Assistant calls it – its domain, device class and features, as
        in Home Assistant's own words, not a brand name. The maker adds device kinds; a new kind
        may only ever be stricter than the general one for its domain.
  - type: input
    id: domain
    attributes:
      label: Home Assistant domain and device class
      placeholder: "cover, device_class: awning"
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What should HouseMind be allowed to do with it, and what never?
    validations:
      required: true

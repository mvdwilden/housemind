# Updates for what HouseMind builds on, every week (QA 2, M-33): Python (uv.lock), the frontend,
# the GitHub Actions and the base image. Each update runs the tests before anyone merges it.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

name: Full test

# Phase 4 of the design (H12.1, H12.3): the long tests that do not run on every change.
# Weekly, before every release tag, and by hand. Release check items 2–4 (E-144, E-142, E-157).
on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      part:
        description: "Which part (by hand only; on schedule and tags always all)"
        type: choice
        options: [all, year, speed, real-ha]
        default: all

permissions:
  contents: read

jobs:
  year:
    name: A year in the time machine (E-99, E-158)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","year"]'), inputs.part)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv run pytest -m slow -s tests/test_year.py

  speed:
    name: Speed like a Raspberry Pi 4 (E-157, B-40)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","speed"]'), inputs.part)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: tools/pi_like.sh tests/test_speed.py

  real-ha:
    name: Real Home Assistant ${{ matrix.tag }} (E-142)
    if: github.event_name != 'workflow_dispatch' || contains(fromJSON('["all","real-ha"]'), inputs.part)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: [stable, beta, "2026.4"]  # current, the coming one, and the oldest supported
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync --locked
      - run: uv run python tools/real_ha.py ${{ matrix.tag }}

      chrome: "Click the padlock or sliders at the left of the address bar › Site settings › Microphone › Allow. Then reload the page."
      chrome_android: "Tap the padlock or sliders at the left of the address bar › Permissions › Microphone › Allow. Then reload the page."
      edge: "Click the padlock at the left of the address bar › Permissions for this site › Microphone › Allow. Then reload the page."
      firefox: "Click the crossed-out microphone in the address bar and remove the block. Then reload the page."
      samsung: "Tap the padlock in the address bar › Permissions › Microphone › Allow. Then reload the page."
      other: "In your browser's settings, allow the microphone for this website. Then reload the page."

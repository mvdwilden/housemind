privacy:
  speech_cloud: "Right now your voice goes to the cloud, through {engines}. Choose a voice and speech recognition that work in the house in House settings › {name} if you do not want that."
  speech_local: "Right now your voice stays in the house: {name} hears and speaks with services that run in your own Home Assistant."
  title: "Privacy statement"
  intro: "HouseMind runs entirely in your own Home Assistant. What it learns and keeps stays in your house. Something only goes out when an administrator says yes to it, or when you want a message on your phone."
  stored_title: "What HouseMind keeps, and for how long"
  stored: "- What happens in the house: lights, curtains, heating, who is home, and what HouseMind did and why. This is kept for 30 days. After that only summaries remain, such as learned habits and daily totals.\n- Your conversations with HouseMind, typed or through the voice assistant, as text. Never recordings. Also 30 days.\n- What HouseMind learned, your house rules, moments, settings and preferences: until you remove them.\n- Messages and proposals: an information message leaves the list after a week, settled messages are deleted after 30 days and proposals after 90 days. Weekly reports and energy totals are kept for 2 years.\n- A key for an AI service is stored encrypted in the App's own storage. What unlocks it is kept there too: whoever has that storage or a backup can read it. It never appears in a log or in the diagnostics package.\nEverything is in the App's own storage in Home Assistant and is part of Home Assistant's backups."
  out_title: "What goes out, and why"
  out: "- By default only the knowledge updates below; nothing about your house goes along. Otherwise HouseMind works without internet.\n- AI, only when an administrator turns it on and gives consent: a short question with neutral names, such as 'lamp 3' or 'bedroom 2'. To understand your home also a device's kind, make and model, what the integration itself calls an entity (such as 'Child Lock'; never a name you gave), and a room's name without people's names. For a question to {name}, the AI may also look up how a room is, what HouseMind did and why, and a summary of at most 7 days, also with neutral names. Never names of people, your address, your location, calendar contents or sound. Only the AI of Home Assistant in the house may describe a camera image, if an administrator turns this on; the image stays in the house. The chosen AI service handles the question under its own terms. At the Expert level you can see every question that was sent.\n- Forwarding in the voice assistant, only with consent: a question HouseMind cannot answer itself goes to the AI or assistant the administrator chose.\n- Knowledge updates: HouseMind fetches new knowledge about device types, countries and languages. Nothing about your house goes along. An administrator can turn this off.\n- Messages on your phone go through Home Assistant's notifications. On the way, the text passes through your phone's notification service.\n- Speech: what you say to {name} and what she says goes through Home Assistant's voice assistant. If that uses a cloud service, your voice goes to that service; HouseMind tells you when it does. With Piper, Whisper or another local speech service everything stays in the house.\n- The calendar: HouseMind reads Home Assistant's calendar only after an administrator's yes, for the waste reminder, the morning briefing and days that are different. What is in it stays in the house.\n- The diagnostics package only goes out when you share it yourself. Names and devices in it are replaced by neutral labels."
  see_title: "Who sees what"
  see: "- Every resident chooses their own level. The higher the level, the more detail, such as the decision trace at the Expert level.\n- House settings, AI and the diagnostics package are only for Home Assistant administrators.\n- HouseMind does not watch or listen through cameras or microphones. Only if an administrator turns this on, and the AI of Home Assistant works in the house, does that AI describe what can be seen on the image, with a message; the image stays in the house.\n- Guests, babysitters and other people in the house: tell them. HouseMind sees movement and presence per room, no names; guest mode takes them into account. Do not point cameras at the street or the neighbours: HouseMind never keeps images, but the camera does record them."
  rights_title: "What you can do yourself"
  rights: "- See what HouseMind did and why: tap Why? at an action.\n- Put something back: tap Undo, or just put it back yourself.\n- Turn learning off in House settings. Then HouseMind only reacts to emergencies and sends messages.\n- Give everything back in House settings: HouseMind switches the automations it took over back on, and goes back to only watching.\n- Erase everything: House settings → Start again → Back to factory settings. Or remove the App in Home Assistant. Then everything HouseMind kept is gone."
  contact: "Questions about privacy? Ask them on HouseMind's project page."


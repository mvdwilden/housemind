play:
  open: "Play the house"
  bar: "Demo house"
  faster: "{speed}× faster"
  intro: "An invented house to try things out. Act out what people, switches, the weather or an emergency do, and see what HouseMind does. The real house notices nothing of this."
  how: "How does this work?"
  busy: "One moment: the house is still playing."
  progress: "Busy … {pct}%"
  run: "Play"
  stop: "Stop"
  still: "standing still"
  slower: "{speed}× slower"
  locked: "The house is playing. HouseMind sees what you change below at once; choose stories and jumps after Stop."
  stopped_note: "Set everything up and press Play. HouseMind sees what you change at once; time only runs again after Play."
  state:
    running: "The house is playing"
    stopped: "Time stands still"
  time:
    title: "The time"
    speed: "Speed"
    jump: "Jump to"
    note: "During a jump the residents live their usual rhythm and answer HouseMind's questions themselves."
  speed:
    slower20: "20× slower"
    slower10: "10× slower"
    x1: "Normal"
    x10: "10× faster"
    x20: "20× faster"
  jump:
    morning: "The morning"
    evening: "The evening"
    night: "The night"
    day: "A day later"
    week: "A week ahead"
  steps: "How far HouseMind is"
  learning_off: "Learning is off. Then everything stays on Observe."
  happened:
    title: "What just happened"
    none: "Nothing yet. HouseMind is watching; sometimes it takes a moment."
    since: "Since {at}"
  stories:
    title: "Stories"
    intro: "One tap plays a few minutes of house life in a few seconds."
    play: "Play"
    expect: "What HouseMind should do"
    steps: "On Observe HouseMind only watches, on Propose it asks first, on Autonomous it does it itself. In an emergency it always does what is needed at once."
  story:
    home_dark:
      title: "Coming home in the evening"
      what: "It is dark and nobody is home. Then a resident comes in through the front door."
      expect: "HouseMind sees that someone is home again and wants to switch the light on where someone comes in: the first time it watches, then it asks, and on Autonomous it does it itself."
    leave:
      title: "Everyone leaves"
      what: "Someone sits in a room with the lamp on. Then everyone goes out of the door."
      expect: "After ten minutes HouseMind knows that nobody is home. A lamp that is still on goes off. The heating stays as it is for the first 24 hours."
    away_long:
      title: "Away for long"
      what: "Everyone leaves and stays away for more than a day. The residents only come back when you choose ‘Everyone home’."
      expect: "After a day HouseMind asks whether you are on holiday. The heating goes 3 degrees lower, not below 15 °C."
    wake:
      title: "Waking up"
      what: "It is early in the morning. The residents get up: light in the bedroom, a shower, downstairs."
      expect: "Light where someone comes in while it is dark. After a while HouseMind knows when you get up; then it makes the bedroom light and warm."
    shower:
      title: "A shower"
      what: "Someone takes a shower. The bathroom gets humid and then dry again."
      expect: "The fan goes on when it gets humid, and off again when it is dry."
    window:
      title: "Window open"
      what: "In a room with heating a window is open for ten minutes. Then it closes again."
      expect: "While the window is open, the heating in that room goes lower. Then back again."
    guests:
      title: "Guests"
      what: "No resident is home, but someone does come in, like a babysitter or guests."
      expect: "After a few minutes HouseMind thinks there are guests and asks whether that is right. It does not learn from a day with guests."
    smoke:
      title: "Smoke"
      what: "A smoke detector goes off."
      expect: "At once an emergency message, all lamps fully on to see the way, and the ventilation off. Locks never open by themselves. Then choose ‘All safe again’."
    leak:
      title: "Water leak"
      what: "A leak sensor gets wet."
      expect: "At once a message. If the house has a main water valve, it closes. Then choose ‘All safe again’."
    frost:
      title: "Frost"
      what: "A frost sensor measures a risk of frost."
      expect: "A message, and the heating in that room goes to at least 8 °C if there is one. Otherwise the house carries on as usual."
    burglar:
      title: "Burglar alarm"
      what: "Everyone is away and the alarm is on. Then the alarm goes off."
      expect: "An emergency message and all lamps on. Only curtains an administrator chose for this open; by default nothing."
    price_negative:
      title: "Negative electricity price"
      what: "For the next two hours electricity costs less than nothing."
      expect: "HouseMind makes a new energy plan and moves heating up and appliances to these hours. You see it under Energy. For the first two weeks HouseMind only measures and shows what it would do."
    sun_full:
      title: "Full sun on the panels"
      what: "Around noon the sun shines fully on the solar panels."
      expect: "More power comes in than the house uses. Under Energy you see the surplus. If the house has a battery, a car or a water heater, HouseMind uses it for that; for the first two weeks it only shows what it would do."
    update:
      title: "After an update"
      what: "Home Assistant gets an update. After it, one integration no longer starts, and a lamp is away for a while."
      expect: "In the Check-up (in the menu on Expert), at ‘After the latest update’, you see after 30 minutes what no longer works since. What was away for a while and works again is added after 2 hours."

help:
  l1:
    q1: What does HouseMind do?
    a1: HouseMind looks after the lights, curtains and heating for you. You hardly notice it. In an emergency, such as smoke or a leak, it acts straight away.
    q2: What does the ball mean?
    a2: "The ball is {name}, the voice of your house. Her colour, shape and word show how things are; red with two rings is an emergency. Tap her word to see what each colour means, or the line below it for the message."
    q3: How do I ask something?
    a3: "Tap {name} or ‘Ask {name}’. She asks what she can do for you, and listens. For your next question, tap her again. If something is waiting for you, she says that first. If your device can't listen, she briefly tells you what's going on."
    q4: How do I pause HouseMind?
    a4: "Tap ‘Pause’, or hold {name}. Choose ‘For 1 hour’, ‘Until tomorrow’ or ‘Until I resume’; each button says until when. Emergency reactions keep working."
    q5: Something happened that I did not want.
    a5: Just change it back yourself. HouseMind notices this, leaves it alone for a while and learns from it.
    q6: I want to see more.
    a6: "Tap the person at the top right, My preferences, and choose another level under About me."
    q7: "Can HouseMind wake me up?"
    a7: "Yes, when your phone has an alarm set: the bedroom light comes on slowly beforehand and the room gets warm. On the other levels HouseMind can also wake you at the time you usually get up."
    q8: "Can I talk to HouseMind?"
    a8: "Yes, through Home Assistant's voice assistant, if an administrator turned on the integration. Ask for example: how is it going?"
    q9: "What does HouseMind do with water?"
    a9: "If water keeps running while nobody uses it, HouseMind tells you. With a main water valve, it can close it – never open it."
    q10: "Does HouseMind replace my smoke detector or alarm?"
    a10: "No. HouseMind helps with safety, but does not replace a certified smoke detector, CO detector or alarm system. Keep them in the house and test them regularly."
    q11: "Who is {name}?"
    a11: "{name} is the voice of your house. Tap her: she asks what she can do for you. What she says is always shown as text too. In My preferences you choose whether she speaks aloud."
    q12: "Can I take the tour again?"
    a12: "Yes. Tap the compass at the top right, ‘Tour’: {name} shows you again where everything is. When you choose a higher level, she shows you by herself what is new. ‘Skip’ stops it at once."
    q13: "How far along is HouseMind?"
    a13: "Ask {name}: ‘How far are you?’ or ‘How far are you with the lighting?’. She tells you per part how far HouseMind is and what is still needed, and shows you if you like."
    q14: "Can I choose other colours?"
    a14: "Yes. Tap the person at the top right (My preferences), choose This device and then a Colour scheme, such as Light, High contrast or Night. It only applies to this device; {name}'s colours stay the same."
    q15: "Do I get a message when something is wrong?"
    a15: "In an emergency, such as smoke or a leak, you get a message on your phone, also at night, unless you said no. If you said yes in My preferences to messages about danger, you also get one for something unsafe, like an open door while nobody is home."
    q16: "What does HouseMind keep about me?"
    a16: "Look in My preferences › About me › My data: your level, your consents, your house rules and how long HouseMind keeps what. ‘Save as a file’ gives you your own data. ‘Forget me’ erases what HouseMind keeps about you."
    q17: "I need more time to talk or to read"
    a17: "In My preferences › About me › Time, choose Longer or Long. {name} then listens longer and short messages stay longer; on Long until you tap them away. While she listens, ‘A moment more’ gives you more time."
    q18: "What is ‘Play the house’?"
    a18: "A panel in a demo house, on a wide screen. ‘Play’ lets time run, ‘Stop’ holds it still; under ‘Play yourself’ you set everything up, also while time runs. ‘Stories’ plays a piece of house life, ‘The time’ jumps ahead. ‘What just happened’ and Logbook show what HouseMind did; the real house notices nothing."
    q19: "What does ‘No connection – retrying…’ mean?"
    a19: "This screen is out of touch with HouseMind for a moment, for example during an update or when the network was gone. HouseMind itself keeps working. The screen connects again by itself: at once when you come back or the network is back, otherwise within ten seconds. If it is still there after a minute, reload the page."
  l2:
    q1: What do I see?
    a1: "At the top you see how things are. Below that, at most three cards waiting for you, one sentence about what HouseMind thought, and a card for each room. Everything else is in Logbook."
    q2: What is the message after an action?
    a2: "It says what HouseMind just tried itself while that rule is still on Propose. Tap ‘Why?’ for the reason, or ‘Undo’ to put it back. On Autonomous HouseMind just does it, without a message; you see it in Logbook."
    q3: How many notifications do I get?
    a3: "At most three a day; emergencies and safety always come, also at night. In your quiet hours the rest waits until the morning. Information comes once a day in an overview. In My preferences you can choose fewer or more."
    q4: "What can I ask {name}?"
    a4: "Tap ‘Ask {name}’ and talk or type, for example ‘how is it going’, ‘why’, ‘pause’ or ‘undo’. With an AI you can ask more, such as ‘why was it cold in the bathroom yesterday?’: then she looks it up, with neutral labels. You can also carry on, such as ‘and in the kitchen too’; she asks before she does anything. ‘Set that back’ puts back what she just did. Her answer appears as it comes. Your conversations are kept in Logbook afterwards. If she doesn't know something, she says so."
    q5: Why did something not happen?
    a5: "Open the room and tap the device. Underneath you see what HouseMind does with it, and why."
    q6: Is my data safe?
    a6: "Everything stays in your house. Something only goes out when an administrator says yes to it, or for a message on your phone. The full privacy statement is under About HouseMind."
    q7: "What does HouseMind do with energy?"
    a7: "After two weeks of measuring, HouseMind makes hot water and starts appliances when electricity is cheap or the sun shines. It does not steer the home battery or the car. On Energy, ‘The next 24 hours’ shows the price, the sun and what HouseMind does."
    q8: "What is the morning briefing?"
    a8: "When you get up in the morning, HouseMind briefly tells you the weather, the calendar and something about energy, on a speaker or at the top of Logbook. It reads the calendar only after an administrator's yes. In My preferences you choose what is in it."
    q9: "What is the bedtime check?"
    a9: "When you go to bed, HouseMind checks whether everything is closed and off. If a door is still open, you hear or see it. HouseMind itself never locks, opens or closes a lock or door."
    q10: "Today is different. What now?"
    a10: "In Logbook, tap ‘Today different?’, or type for example: I'm working from home today. HouseMind adjusts that day without changing your normal pattern."
    q11: "What is the house report?"
    a11: "Every Sunday evening a short report: what HouseMind did, what you put back and what it saved. You find it in Logbook. In My preferences you choose another day."
    q12: "Why do I get a word about a battery?"
    a12: "HouseMind keeps an eye on maintenance: an almost empty battery, a smoke alarm or other emergency sensor that has not answered for a day, a filter, and the evening before the bins are collected. It only tells you; it does nothing."
    q13: "The oven is on and I'm away?"
    a13: "Then you get a message. If the oven or hob can be switched off, HouseMind asks ‘Shall I switch it off?’ and only does so after your yes. HouseMind never switches one on. If a lamp has been on for four hours in a room where nobody has been for an hour, HouseMind also asks ‘Shall I switch it off?’; with AI a possible reason comes with it. After ‘No, keep it on’ it does not ask about that lamp for a month."
    q14: "A sensor outside hears an alarm?"
    a14: "If, for example, a camera on the terrace hears a smoke alarm, you get a message, also at night. HouseMind does not turn on lights or speak then: the sound may come from the neighbours."
    q15: "What are zones in a room?"
    a15: "Some presence sensors know zones, such as ‘Bed’. A zone with the name of another room counts for that room; otherwise it is a part of the room. Under Zones in a room you see per zone whether someone is there."
    q16: "Does a robot vacuum count as someone?"
    a16: "No. While a robot vacuum drives, and for 2 minutes after, movement does not count. Presence that begins then counts only a little, and not at all when nobody is home. Whoever was there already stays there."
    q17: "What is under What I thought?"
    a17: "What HouseMind saw, thought and did. On Carefree there is one sentence under {name} about the last hour. ‘More in Logbook’ shows the rest, with ‘Why?’ and ‘Undo’. On Informed one sentence per thing, on Involved also what it left, on Expert also the details. From Informed the newest shows as two blocks: what I saw and what I did or ask. On Involved the Logbook shows saw, thought and did one below the other, with a line: it flows when it is done, dots wait for you, and a line that stops was not done. On Carefree a thin ring around {name} has a dot for each time HouseMind did something today, at the hour it happened. On Informed and Involved, ‘Today’ shows per room what it did, asked or left."
    q18: "How do I talk back to {name}?"
    a18: "Tap {name}: her window opens. When you see ‘I'm listening’, just talk; if the microphone doesn't work, it says why. You can also type at the bottom of the window. Without an AI she gives buttons such as ‘How is the house?’ and ‘Help’, and understands set questions. After her answer she does not go on listening by herself: tap her again, also in her window."
    q19: "Does {name} ask questions herself?"
    a19: "Yes. When something waits for your answer, {name} asks you in her window, with the buttons; a proposal also has ‘Why?’. The question stays until you answer or close the window; the next comes after that. There are also ‘I'll look into it’ and ‘Later’, and for an administrator ‘Don't show again’. After ‘Later’ the question waits in Logbook. If an administrator turned her window off for the house, the question waits in Logbook; tap {name} and she still asks it."
    q20: "How do I see how far HouseMind is?"
    a20: "On Home you'll find ‘Ready for autonomy?’: per part, such as Lighting, one sentence about how far HouseMind is and what is still needed. You can also ask {name}: ‘How far are you?’. HouseMind earns every step itself."
    q21: "Where are Help and the House settings?"
    a21: "At the top right, on every screen: the question mark is Help, with the manual, the compass is the Tour, the gear is House settings (administrators only) and the person is My preferences. Short messages, such as ‘Saved’, show next to those buttons for a moment."
    q22: "Does HouseMind also learn from what already happened?"
    a22: "Yes. After your yes to learning, HouseMind reads once what Home Assistant kept, usually 10 days. It stays in the house and brings something to Propose at most. In House settings you'll find ‘Also learn from the history in Home Assistant’ and ‘Read again’."
    q23: "What is in Logbook?"
    a23: "On top is ‘Waiting for you’: the notifications still waiting for you, with their buttons. The number at Logbook in the menu counts exactly those, not what is new. Below it everything that happened, 30 days back, with your own conversations. With Filter you choose Done, Only watched, Notifications or Conversations, with Period for example Today. What HouseMind did has ‘Why?’ and ‘Undo’. Administrators see under AI ‘See what was sent and received’: the instruction (why HouseMind asks and what answer it wants), what was sent and the answer."
    q24: "How do I start again, or go back to the factory settings?"
    a24: "As an administrator: House settings › Start again. ‘Introduction again’ walks through the introduction once more. ‘Learn again’ makes HouseMind forget what it learned; your house rules stay. ‘Back to factory settings’ erases everything; then you set it up again with ‘Set up’. Emergency reactions keep working."
    q25: "How do I turn on the vacation or guest mode?"
    a25: "Tap {name} and choose ‘Vacation’ or ‘Guests’; then it says ‘Home again’. You can also say it: ‘we are going on vacation’. In both modes HouseMind does not learn. On vacation the house looks lived in in the evening."
    q26: "What do the thumbs do?"
    a26: "From Informed, 👍 and 👎 show under something {name} did herself, also at ‘Why?’; if she tried something herself while it was still on Propose, she sometimes asks whether it was good, with ‘👍 Good’ and ‘👎 Not good’. On Autonomous she asks nothing, not even afterwards, and no message appears. A thumb down counts as a correction. Your answer is in Logbook; from Involved, ‘Ready for autonomy?’ counts the thumbs."
    q27: "Can I say ‘Hey {name}’?"
    a27: "Yes, with a voice satellite or Assist on your phone. You have a wake word with her name made yourself; Home Assistant explains how. Once it exists, HouseMind puts it in her own Assist pipeline (House settings › {name})."
    q28: "What does HouseMind do with cameras?"
    a28: "HouseMind does not look at images itself. It only uses what your cameras already report in Home Assistant, such as a person or a package. When everyone is away, you get one message with the image. HouseMind never keeps images, faces or number plates. Only if an administrator turns it on and the AI of Home Assistant works in the house, that AI describes with a message what can be seen on the image; the image stays in the house."
    q29: "Does HouseMind switch the alarm on or off?"
    a29: "{name} only asks: ‘Shall I set the alarm to away?’ when everyone has left, and ‘to night’ when the house goes to sleep. HouseMind never switches it off. Which alarm it is, you choose in House settings › House › Security."
    q30: "How does HouseMind handle the heating?"
    a30: "Calmly. When nobody has been home for more than a day, the heating goes 3 degrees lower, not below 15 °C. If a room stays too cold, HouseMind sets the thermostat a little higher. What you set yourself, it remembers as your wish."
    q31: "I get too many messages. What can I do?"
    a31: "Every message has ‘I'll look into it’ and ‘Later’. ‘Later’ puts it away for a while. An administrator also has ‘Don't show again’: it switches that kind off for everyone at home, except emergencies. Logbook still has them as ‘not shown’. An administrator brings them back with ‘Show again’, in Logbook or in House settings › House."
    q32: "Why does a room still say someone is there?"
    a32: "If the room has a presence sensor, it is empty as soon as that sensor sees nobody. If it only has a motion sensor, ‘Someone there’ stays for a few more minutes: a motion sensor cannot tell whether someone sits still or left. A presence sensor that is offline does not count."
    q33: "Why are the devices in a room under headings?"
    a33: "Each heading is a device, with its name and type from Home Assistant. Below it is what belongs to it. A sensor's or voice assistant's own light is a status LED: HouseMind does not count it as light in the room and never switches it on or off itself. The settings of a device are folded away at the bottom; HouseMind never changes them. Under each name, a word says what it is, such as lamp, the room's thermostat, setting or not known yet."
    q34: "How long does the light stay on when nobody is there?"
    a34: "HouseMind learns that per room from what you and your automations do. Until it knows, it is short in a toilet, bathroom, storage room or cellar, and longer in a hall where people walk back and forth. If only a motion sensor sees you, it waits at least 3 minutes. First the light dims for a moment. If you come back, or switch the light on again straight away, HouseMind waits longer there from then on. ‘Ready for autonomy?’ shows the wait per room. Without a presence or motion sensor HouseMind cannot see that the room is empty, so it does not put the light out there."
    q35: "Does the outside light go on when we are away?"
    a35: "Yes, once HouseMind may do it by itself. When it gets dark, the lamps outside go on, also when nobody is home: the house looks lived in. They go off when the house goes to sleep. When nobody is home, around your usual bedtime, a few minutes different each evening."
    q36: "Does the outside light go on when I come home in the dark?"
    a36: "Yes, at the entrance, once HouseMind may do it by itself. When you come home in the dark, the lamps on the driveway, at the front door or at the carport go on at once, and off again after 5 minutes. If someone is still outside then, they stay on longer. If the light is already on, it stays as it is. If you switch the lamp on again just after, HouseMind keeps it on longer next time."
    q37: "Why does HouseMind ask whether it may do something itself from now on?"
    a37: "Because it saw it go well often enough. You see the question at ‘Waiting for you’ in Logbook. Choose ‘Yes, from now on’, ‘Not yet’ or ‘Never’. If you later put it back twice in a week, HouseMind asks first again."
    q38: "I worked a lamp by hand. How long does HouseMind keep off it?"
    a38: "As long as someone is in the room, your choice stands, for a few hours at most. If the room has been empty and someone comes in, that is a new moment: the light goes on again as usual when it is dark. If you come back within 2 minutes, it stays as you left it. If you put a lamp out while nobody is in that room, for example with a button that puts everything out, this applies at once. If you put it on that way, it stays on."
    q39: "Why does the colour of the light change with the day?"
    a39: "Light follows the day: brighter and whiter by day, softer and warmer in the evening. If you have Adaptive Lighting, HouseMind reads its settings and takes them over: on Autonomous it does this itself, below that Adaptive Lighting still does. Without that integration HouseMind makes such a line itself, from what it learned in that room for the evening and the day. If you choose something else, it stays that way until the lamp goes out. If you often do, HouseMind remembers it."
  l3:
    q1: What are proposals?
    a1: "When HouseMind is not sure yet, it asks first. You answer ‘Do it’, ‘Not now’, ‘Myself from now on’ or ‘Never’. ‘Myself from now on’ does it now and from now on without asking. ‘Never’ becomes a house rule after you confirm. With AI, HouseMind can also suggest at most three house rules a week to administrators, from what it learned, with why. Only ‘never’ or a maximum temperature, and only after your yes; after no, that suggestion does not come back."
    q2: What are the steps?
    a2: "Each skill goes from Observe to Propose to Autonomous, per room. Propose comes soon. It goes to Autonomous once it was right often enough, for at least a week: then HouseMind asks once, and one yes is enough. How far it may go per part, an administrator chooses in House settings › Learning and steps › Parts."
    q3: What are house rules?
    a3: "Rules that always apply, for example ‘never open the curtains in the bedroom before 7:00’. Type them or choose them; HouseMind reads a rule back first. With an AI you can also change a rule in your own words, such as ‘make that rule an hour later at the weekend’; HouseMind reads the new rule back and waits for your yes. You find them in Brain, under the House rules tab. Removing one asks yes or no first."
    q4: What does the floor plan show?
    a4: Every room per floor. A bright edge means someone is there. A warm glow means a light is on.
    q5: How do I pause one part?
    a5: "Tap ‘Pause’ at the bottom, or hold {name}, and choose Lighting, Blinds and curtains or Climate."
    q6: What does HouseMind never do?
    a6: It never turns off an alarm, never unlocks a lock and never opens a garage door, gate or door. Not even in an emergency.
    q7: What happens to my automations?
    a7: "HouseMind never makes or deletes automations and leaves their devices alone. If you set a rule to Autonomous in Brain under ‘Ready for autonomy?’, HouseMind turns off the automation that steers it at once and does it itself; if the automation does more, it asks first. Once everything it does went well often enough, HouseMind asks once in Waiting for you; after yes it goes off and HouseMind does it itself. If it goes back to Propose or Observe, the automation goes back on at once. You can always undo that."
    q8: "Can HouseMind charge the car?"
    a8: "No. HouseMind does not steer the charger or the home battery. On the Energy tab you do see how full the car is and whether it charges. Ask {name} for example ‘charge the car full by 7:00’, and she tells you the cheapest moment."
    q9: "How do I know it pays off?"
    a9: "After the two weeks of measuring, HouseMind compares every day with what that day would have cost without HouseMind, taking cold and sun into account. You also see it when it turns out worse."
    q10: "What are moments?"
    a10: "Moments like cooking, dinner, a movie or reading, with the light that fits. Open a room and tap a moment, or say it. Set the lights the way you like and tap ‘Remember this’ for a moment of your own."
    q11: "Why does HouseMind ask in the evening whether it may wake me?"
    a11: "As long as HouseMind is still learning to wake you, it asks the evening before. Yes counts for that morning only. If you turn the light off while waking, it stays off."
    q12: "How do I use a wall tablet?"
    a12: "Open HouseMind on the tablet and choose the room in My preferences › This device › Wall tablet. The tablet wakes up when someone is there. ‘Full screen’ hides the browser bar; ‘Stop wall tablet’ puts everything back."
    q13: "What are trial parts?"
    a13: "New parts: household, media, cleaning, garden, and care and wellbeing. At first they are off; an administrator turns them on in House settings › Learning and steps › Parts. Care and wellbeing only with a yes from the person it is about."
    q14: "What is care and wellbeing?"
    a14: "When the person it is about is home and nothing moves for a long time, a chosen contact gets one message. Only with the agreement of the person it is about."
    q15: "What does HouseMind do when Home Assistant restarts?"
    a15: "Then HouseMind does nothing new for a moment and you see ‘Attention’. It connects again by itself and then checks whether everything still works. What no longer works gets a message; HouseMind only watches it until it works again."
    q16: "What is under Keeping HouseMind up to date in House settings?"
    a16: "Three things: knowledge updates (new knowledge about devices, countries and languages; can be turned off), whether HouseMind may read the calendar (only after a yes) and the button for the diagnostics package: a file without names to share when something is wrong."
    q17: "How does HouseMind handle groups of lamps?"
    a17: "HouseMind prefers to switch a group in the lamps' own network: they react together. Then groups from Home Assistant, then single lamps. If a lamp is in such a group, the Logbook, What I thought and Ready for autonomy? show only the group. If one lamp was operated by hand, the group is left alone. If a lamp is set to Leave alone, HouseMind never addresses it on its own, but its group takes it along; set the group to Leave alone and everything in it stays still. On Expert: Brain › Devices and entities, by Room; there the lamps of a group stand indented under the group."
    q18: "How do I see how far HouseMind is?"
    a18: "In Brain, on the ‘Ready for autonomy?’ tab, you see per part and per skill in a room the step, the score against the target and what is still needed. The parts are tiles: tap a tile for the explanation and buttons of that part, and the list below then shows only that. ‘Automations’ shows how close HouseMind is to taking over; ‘More’ has the explanation."
    q19: "How do I quickly find an automation or device?"
    a19: "Above long lists there is a search field and ‘Filter’: tick per topic what you want to see; ‘Clear all’ removes your choices. In Brain › What I know you also find the ‘Scenes and scripts’ from Home Assistant, to look at."
    q20: "Does HouseMind also learn from what already happened?"
    a20: "Yes. After your yes to learning, HouseMind reads once what Home Assistant kept, usually 10 days. It stays in the house and brings something to Propose at most. In House settings you'll find ‘Also learn from the history in Home Assistant’ and ‘Read again’."
    q21: "When is it dark enough for light?"
    a21: "HouseMind learns that per room from you: at what height of the sun, or how much light, do you switch the light on when you come in? When the curtains close in the evening, it also learns per room."
    q22: "How many questions does {name} ask?"
    a22: "All questions together: on Informed at most one a day, on Involved three, on Expert you choose in My preferences (five unless changed). The rest waits in Logbook. After ‘Not now’ a question comes back later, after ‘Never’ not at all."
    q23: "People without their own phone live here, such as children."
    a23: "Switch that on in House settings › House. Then everyone is only away when the sensors in the house are quiet too. Fill in their first names too: HouseMind only uses them to leave them out for the AI."
    q24: "Why does HouseMind no longer do something itself?"
    a24: "If someone puts something back twice in a week, or says no twice, HouseMind goes a step back there and the administrators get a message. Then it earns the step again; ‘Ready for autonomy?’ shows how far it is."
    q25: "Can I set a step myself, or make HouseMind forget something?"
    a25: "Yes, as an administrator. On ‘Ready for autonomy?’, tap the tile of a part: the card below it has ‘Set a step yourself’. What safety does not allow is grey. ‘Forget this’ erases what HouseMind learned about one skill in one room. You always confirm with yes or no."
    q26: "Which language does {name} speak?"
    a26: "In the app she speaks your language, which you choose in My preferences. On speakers, the wall tablet and in Assist she speaks the language of the house; an administrator chooses it in House settings › {name} › Language of the house."
    q27: "How do I read the energy plan?"
    a27: "Under Energy you find ‘Plan for the coming hours’. At the top the price: blue is negative, orange is expensive. Above the line what comes in, below it where it goes. At the bottom what HouseMind does per appliance. Tap the chart or a block for details."
    q28: "What does the Check-up do?"
    a28: "HouseMind checks hourly what is broken in Home Assistant, also backups and disk. Important things come at once as a message; ‘View’ shows what it is. The whole Check-up page is in the menu on Expert."
    q29: "Does a button or wall switch count as an automation?"
    a29: "No. An automation that only passes on what you do yourselves is your own hand: a wall switch, a remote or a button in the app that turns lamps or switches on, off or over, or dims them. HouseMind works those lamps as well and never asks to turn it off; the button keeps working. What it does counts as something you did, so HouseMind then leaves the lamp alone for a while. HouseMind never flips the switch itself."
    q30: "What do I see under Network?"
    a30: "Under Home › Rooms, choose ‘Network’. {name} stands in the middle, with her word under her; around her are the rooms, with their devices as small dots. When HouseMind does something, a line flows for twenty seconds from the room through {name} to the device: ‘flowing now’. Under it stays what it did last, with the time and ‘Why?’. When HouseMind asks something, a dotted line stays for as long as the question is open: ‘waiting for you’. Under it are the question and ‘Do it’ and ‘Not now’. When AI is on, you see a dotted ring around {name}: the AI thinks along, but never decides."
    q31: "How does HouseMind know whether it is morning, evening or night?"
    a31: "From your own rhythm, not the clock. It is night as soon as the house sleeps; if someone is still up, two hours after your usual bedtime. The morning starts when the house wakes up, the evening when you usually come home. The light when you come in and {name}'s greeting follow it. In a bedroom no lamp goes on by itself from the usual bedtime. If HouseMind does not know a time yet, it looks at the clock. In Brain, on the Rhythm tab, the top line says what it is now. Under the bars is ‘Coming up’: what HouseMind will do at the next moments of the day, such as when it gets dark or the house goes to sleep."
    q32: "When does HouseMind do something itself from now on?"
    a32: "When it went well often enough: by default 85 times out of 100, seen 10 times, over at least a week. Then one question stands at ‘Waiting for you’, and it does not expire: ‘Yes, from now on’, ‘Not yet’ or ‘Never’. One yes is enough. If an automation steers it, only an administrator gets the question, and after yes it goes off. If someone puts it back twice in a week, HouseMind asks first again and the automation goes back on."
    q33: "Does the light of the alarm or the doorbell hold a room back?"
    a33: "No. Such an automation gives a signal: a colour or a blink that is not started by someone in the room, a door, the sun or the time. It stays on, holds nothing back and HouseMind learns nothing from it. While the signal lasts, HouseMind keeps off the lamp. If the lamp stays on afterwards, as with an alarm going off, until that lamp changes. An automation that only switches lamps goes along in the question once their rules are proven. If it does more, such as switching a socket too, it stays on and keeps only its own lamp."
    q34: "When do the curtains in the bedroom open?"
    a34: "When you are out of bed, nobody sleeps in that room any more and it is light outside. If a sensor sees who is in bed or in the room, HouseMind waits until it has been empty for a few minutes. Without such a sensor it only opens them when everyone is out, or at a moment it learned from you. In a room nobody slept in last night, they open with the rest of the house."
    q35: "I added a device. Does it get rules by itself?"
    a35: "Yes. When you put a device in a room in Home Assistant, the rules that go with it are at once under ‘Ready for autonomy?’, marked ‘Not seen yet’. A rule for humidity or CO₂ only comes when the room has that sensor too. If HouseMind does not know the kind of room, it asks once what kind of room it is; until then the room gets the rules that fit anywhere. When you remove a device, its rule goes. What HouseMind learned for it is kept for 30 days, in case a device comes back."
  l4:
    q1: What is the decision trace?
    a1: "For every decision you see the context, the skill, the counts and certainty, the six checks of the safety gate and the result. In Brain, under More › Decision trace. The decision shows as a stream: source, what I saw, what I thought and the outcome, with below it the six steps of the gate: passed, where it stopped, or not reached. Above it two lanes, the core and the AI lane, and today from source to outcome."
    q2: What is the thought stream?
    a2: "Everything HouseMind considered, also what it did not do, and why not. In Brain, under More › Stream of thoughts."
    q3: How does learning work?
    a3: "For every skill, room and half hour HouseMind counts what people do; after 14 days something counts half. Proven is 10 situations and 85% right, over at least a week: then HouseMind asks once whether it may do it itself from now on, and one yes is enough. It also works through answers: 15 answers and 90% yes, over at least a week. Two corrections or two times no in a week: a step back."
    q4: What does the safety gate check?
    a4: Real and valid; allowed, including the hard limits in code; may it now (pause, people win, other system, house rules); the step; sensible (switching limits, batteries); and done (Home Assistant confirms).
    q5: Devices and entities
    a5: "For each entity you see what HouseMind recognised and its highest step. An administrator can choose ‘Leave alone’. You find them in Brain, under the Devices tab. HouseMind uses labels from Home Assistant only as a hint."
    q6: AI
    a6: "Optional. Questions go through a privacy filter with neutral labels. AI may only propose, never act. Administrators can see exactly what was sent. Each question says what form the answer must have; where the service can, the AI cannot answer otherwise. What does not fit does not count. In the AI block on Expert you choose a model per task and see what each task cost. AI can also help to understand your home: at Brain › What I know you see what it thinks, and change it, also after That's right. Only after That's right does HouseMind suggest or do something with it. Even without AI, HouseMind works things out from behaviour and asks where the rules are not sure. On Informed, {name} asks at most one question a day about it, with That's right and Not right. Something important {name} always says in HouseMind's own words, without AI. You can also choose the AI of Home Assistant, the AI task already set up there: then HouseMind keeps no key. If that AI works in the house there is no budget; in the cloud at most 100 questions a day. It also shows what each entity is; you confirm that per device in one go."
    q7: "How does the energy plan calculate?"
    a7: "Per quarter for 36 hours: the boiler extra warm when it is cheap or sunny, preheating before an expensive peak when that really pays, and an appliance at the cheapest moment. The home battery and the car are not in it."
    q8: "How does the Home Assistant integration work?"
    a8: "As an administrator, tap ‘Link’ in House settings › Upkeep and privacy: HouseMind places the integration, restarts Home Assistant if needed and finishes it itself. Then the state and a pause switch are in Home Assistant. Everything goes through the same safety gate."
    q9: "HouseMind in Assist"
    a9: "Choose HouseMind as the conversation agent and turn on ‘Prefer handling commands locally’. HouseMind answers questions about the house itself. Other questions only if an administrator allows it, and then only the question goes along."
    q10: "How does HouseMind learn the rhythm?"
    a10: "From the house mode: when the house goes to sleep, wakes up, empties and is home again, per type of day. A time only counts after at least three days that are close together. In Brain you see it under the Rhythm tab. There you also see per room what HouseMind learned. With AI, the AI makes it a short story once a day; the times and numbers come from HouseMind itself."
    q11: "Knowledge updates"
    a11: "HouseMind can fetch new knowledge every day: device kinds, countries and languages. Only a bundle with a correct signature is used; the previous one is kept. You can turn this off in House settings."
    q13: "The diagnostics package"
    a13: "One button in House settings makes a file to share when something is wrong: versions, counts and the last warnings, with every name replaced by a neutral label."
    q14: "Self-check and tested versions"
    a14: "After every start of Home Assistant, HouseMind checks whether what it uses is still there. If Home Assistant is newer than tested, it asks first for one day with sensitive devices. If the installation is not supported or not healthy, administrators get one calm message."
    q15: "How do I see how far HouseMind is?"
    a15: "In Brain, under ‘Ready for autonomy?’, Expert also shows the numbers: score, certainty, right, otherwise and put back. Under the sentence about what HouseMind does, it says exactly why: the sensors, thresholds, source and how sure it is. The limit is in House settings."
    q16: "How do I quickly find an automation or device?"
    a16: "Above long lists there is a search field and ‘Filter’: tick what you want to see; ‘Clear all’ removes your choices. With ‘Group by’ you order the list by room, kind or step. In House settings you also find the ‘Scenes and scripts’ from Home Assistant, to look at."
    q17: "How do I make my own colour scheme?"
    a17: "Put a file in /config/housemind/themes/. Copy the ‘Example file’ from House settings › Upkeep and privacy › Colour schemes and give it its own id, name and colours. Within a minute it is in the list, if it is easy to read; otherwise it says why there."
    q18: "Does HouseMind also learn from what already happened?"
    a18: "Yes. After your yes to learning, HouseMind reads once what Home Assistant kept, usually 10 days. It stays in the house and brings something to Propose at most. In House settings you'll find ‘Also learn from the history in Home Assistant’ and ‘Read again’."
    q19: "How does HouseMind count ‘dark’ and the curtains?"
    a19: "When someone comes in without light, HouseMind notes the sun's height, the lux and whether a lamp went on within 3 minutes. After 6 times the best measure decides; until then lux under 40 or the sun under 3°. Curtains: the sun's height at which they usually close there."
    q20: "Thresholds, an earlier day and what HouseMind would do now"
    a20: "In Brain › Ready for autonomy?, the card of a part has the Thresholds: there you choose when a step may go further; ‘Standard’ resets them. ‘Go back to an earlier day’, at House settings › Start again, restores what HouseMind knew on one of the last 7 days. What HouseMind would do now in each room you see in ‘Test the house’, without switching; what it will do later in Brain › Rhythm, under ‘Coming up’."
    q21: "Saving and reading back settings"
    a21: "In House settings › Upkeep and privacy you save the settings as one readable file, without conversations, logbook, people or keys. When reading one in, you first see what changes; only after yes does it happen. A file never makes safety looser."
    q22: "The link with Home Assistant does not work"
    a22: "In House settings › Upkeep and privacy, at ‘HouseMind in Home Assistant’, tap ‘Link’. HouseMind finishes the link itself and restarts Home Assistant if needed. If that does not work, you see three steps and ‘Open in Home Assistant’."
    q23: "How do I remove HouseMind?"
    a23: "Go to House settings › Start again › Removing HouseMind and tap ‘Give everything back’. Automations HouseMind turned off go back on and the link in Home Assistant goes. Then remove the App in Home Assistant. Emergency reactions work until then."
    q24: "What does the Check-up do?"
    a24: "In the menu, in the Check-up, HouseMind checks hourly what is broken, also backups and disk; ‘Check now’ checks at once. It never deletes; it switches off only after your yes, with ‘Switch back on’. ‘Off on purpose’, ‘Leave it’, ‘Not a duplicate’ and ‘Keep on purpose’ stop a question. Important things come at once, with ‘View’."
    q25: "Can I turn off that {name} opens her window by herself?"
    a25: "Yes, for the whole house. An administrator turns it off in House settings, in the group {name}. Then her question no longer pops up for anyone and waits in Logbook. Tap {name} or ‘Ask {name}’ and she still asks it. There is no own choice per person any more."
    q26: "What do I see under Network?"
    a26: "On Expert, Home › Rooms opens with ‘Network’. {name} stands in the middle, with her word under her; around her are the rooms, with their devices as small dots. When HouseMind does something, a line flows for twenty seconds from the room through {name} to the device: ‘flowing now’. Under it stays what it did last, with the time and ‘Why?’. When HouseMind asks something, a dotted line stays for as long as the question is open: ‘waiting for you’. Under it are the question and ‘Do it’ and ‘Not now’. When AI is on, you see a dotted ring around {name}: the AI thinks along, but never decides. Point at a dot to see which device it is; a group, as in Devices, is one dot for all its devices."
    q27: "How do I test HouseMind in my own house?"  # Test het huis (E-474)
    a27: "As an administrator on Expert, tap the flask at the top right, ‘Test the house’; on a phone it is the tab ‘Test’. Choose a room, and under ‘Play it out’ what happens, such as someone coming in in the dark, or the evening. HouseMind then shows what it would do, and per line how that goes for real: do it itself, ask first, only watch, or not and why. Nothing is switched yet. With ‘Do it for real’ HouseMind really does it in your house: the lamp goes on, the curtain closes, and the line flows in the network. After a minute it puts everything back, unless you choose ‘Keep it’; with ‘Put back’ it goes at once. If a house rule says no, an automation steers the device, or it cannot go back, the test does not do it, and the reason is shown. Evening brings the light of that evening: in November it is dark. With ‘Walk around yourself’ a part is on Autonomous for a while with the real sensors, and you walk through the room yourself. Under ‘What just happened’ you see what HouseMind decided, which check said no, and how fast it was. What you test does not count for learning. If it says someone operated the device by hand, someone just did that themselves; a moment off the network does not count."
    q28: "How do I set the levels of a lamp?"  # Standen voor lampen (E-490)
    a28: "Every lamp dims differently: 40% is still bright on one lamp and dusk on another. That is why every lamp has four levels: Dimmed, Normal, Bright and Full. As an administrator on Expert, open the Devices and entities tab in Brain, and tap ‘Levels’ at a lamp. Move each level to the percentage that feels right on that lamp, and choose its colour: it follows the day's rhythm, or you fix it from warm to white. With ‘Try’ the lamp itself goes to that level; ‘Show all four’ goes through them. While the window is open, HouseMind leaves the lamp alone. With ‘Done’ or when you close the window, it is back as it was. Tap ‘Save’: that is only for this lamp. With ‘Try a level’ at a room you see whether all lamps there match. HouseMind then speaks in levels: ‘Shall I set the dining room to Dimmed?’"

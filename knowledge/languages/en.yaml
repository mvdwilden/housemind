# do: Autonomous 'I turn on …', ask: Propose 'I ask whether …', would: Observe 'I would …'.
# brain/when.py fills the places and adds a house rule, a fixed limit or what is not known yet,
# and a full stop.
# Lamp levels (E-490 – E-496, design 73): how the brain names them.

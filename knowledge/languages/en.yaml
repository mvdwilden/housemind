# English is the base language (E-26). Keys are stable; texts may change.
app:
  name: HouseMind
format:
  decimal: "."
  language_name: English
  reviewed: "yes"  # checked by a person (B-38); "no" shows a mark in the app
  not_reviewed: "{name} (not yet reviewed)"
levels:
  carefree: Carefree
  carefree_hint: HouseMind takes care of everything; you hardly notice it.
  informed: Informed
  informed_hint: You see what happens and why.
  involved: Involved
  involved_hint: You approve proposals and set house rules.
  expert: Expert
  expert_hint: You see and control everything, in detail.
orb:
  inactive: "Not active yet"
  listening: "I'm listening"
  calm: All calm
  thinking: Thinking
  learning: Learning something new
  attention: Attention
  paused: Paused
  sleeping: Good night
  secured: "Secured"  # the alarm is on (E-539)
  secured_short: "secured"
  emergency: Emergency
  tap_hint: Tap me to ask something
ui:
  news:
    title: "What is new in version {version}"
    read: "Read"
  # Setting up (E-277 – E-282).
  setup:
    labels_used:
      one: "I also used 1 label from Home Assistant as a hint."
      other: "I also used {count} labels and categories from Home Assistant as a hint."
    title: "HouseMind is not set up yet"
    text: "You set HouseMind up page by page: the introduction, the link with Home Assistant, {name}, the AI, and done. Until then HouseMind does nothing of its own accord."
    emergency: "Emergency reactions, such as for smoke or a leak, already work."
    start: "Set up"
    others: "The administrator is still setting HouseMind up. After that you can use it."
    step: "{n} of {total}"
    steps:
      intro: "Introduction"
      link: "Link with Home Assistant"
      vesta: "Name and voice"
      ai: "AI"
      finish: "Done"
    intro_done: "The introduction is done. To choose something else later, go to House settings → Start again."
    link_text: "With the link, {name} and HouseMind are also in Home Assistant: as a device and as an Assist agent, so you can talk to her through Assist too."
    link_later: "Does it not work now? Then you can go on and place the link later, under House settings → Upkeep and privacy."
    vesta_text: "Choose her name and her voice."
    language: "{name} speaks {language}: the language Home Assistant shows you. Everyone can choose their own language under My preferences."
    ai_text: "With an AI, {name} can answer more questions. It is not needed: without an AI everything in the house works. You may skip this."
    finish_text: "Almost done. After Done, HouseMind watches, with everything on Observe, and {name} shows you where everything is."
    wait: "One moment, I am still reading what happened in the last days…"
    back: "Back"
    next: "Next"
    done: "Done"
    pipeline_made: "The Assist pipeline is ready."
    pipeline_failed: "That did not work. Is the link there already, and can Home Assistant be reached?"
    pipeline:
      title: "Assist pipeline"
      text: "Shall I make an Assist pipeline of her own for {name}? Then you talk to her through Assist, in her voice and in the language of the house. Pipelines of your own stay as they are."
      make: "Yes, make the pipeline"
      ours: "{name} has an Assist pipeline of her own. If you change her name or voice, HouseMind changes it too."
      no_agent: "This can be done once the link with Home Assistant is there."
      other: "There is already a pipeline ‘{other}’ with HouseMind's agent. May I take it over and keep it up to date?"
      adopt: "Yes, take it over"
      own: "No, make one of her own"
  # Starting again (E-271 – E-275).
    house:
      title: "About the house"
      phoneless: "Do people live here without their own phone in Home Assistant, such as children?"
      calendar: "May {name} read the calendar?"
    unlinked: "The link does not work yet: Home Assistant does not reach HouseMind. Without the link, HouseMind is not in Home Assistant and you do not talk to {name} through Assist. Go on anyway?"
    unlinked_yes: "Yes, link later"
    speech_cloud: "What you say to {name} and what she says now goes through {engines} to a service in the cloud. If you do not want that, choose a voice above that works in the house."
    speech_local: "What you say to {name} and what she says stays in the house."
    read_stalled: "The reading has stood still for a while. You can tap Done anyway; I read on in the background and tell you when I am finished."
    knowledge: "HouseMind fetches new knowledge itself: new kinds of devices, countries and languages. Nothing about your house goes out with it."
    finish_unlinked: "The link with Home Assistant does not work yet. You can make it later under House settings → Upkeep and privacy."
  restart:
    cancel: "Cancel"
    pointer: "Learn again, or do the introduction once more? That is under Start again."
    go: "Go to Start again"
    failed: "I could not switch these automations back on: {names}. Nothing was erased. Switch them on in Home Assistant and try again."
    intro:
      title: "Introduction again"
      text: "{name} walks you through the introduction once more. Your current answers are filled in; nothing is erased."
      button: "Start the introduction"
    learn:
      title: "Learn again"
      text: "HouseMind forgets what it learned and starts watching again. Settings, house rules, rooms, people and the logbook stay."
      gone: "What goes: what went well and differently, what came from the history, the usual lamps and settings, and the steps. Everything goes back to Observe. Automations HouseMind took over are switched back on first."
      history: "Then HouseMind reads the history of Home Assistant again."
      button: "Learn again…"
      confirm: "Are you sure? HouseMind then forgets everything it learned."
      confirm_yes: "Yes, learn again"
      done: "Done. HouseMind forgot what it learned and is watching again."
    factory:
      title: "Back to factory settings"
      text: "Everything becomes as on the first day. Then you only see the start screen, and you set HouseMind up again whenever you want. Until then it stands still; emergency reactions keep working."
      button: "Factory settings…"
      first: "First HouseMind gives everything back: automations it switched off go back on."
      gone_title: "What goes"
      gone:
        learned: "everything HouseMind learned"
        logbook: "the logbook, the messages and the conversations"
        rules: "the house rules, the people and their preferences"
        settings: "the house settings and the energy history"
        ai: "the AI's key"
        link: "the link in Home Assistant: the device {name} and the Assist agent"
      stays: "What stays: the App options in Home Assistant and your own files in /config/housemind."
      copy: "Save a copy first"
      backup: "A Home Assistant backup can put everything back."
      type: "Type {word} to confirm"
      word: "ERASE"
      erase: "Erase"
      wrong: "That is not the right word. Type {word} to erase."
      busy: "I am giving everything back and starting again. In a moment you see the start screen."
  tour:
    step: "{n} of {total}"
    skip: "Skip"
    back: "Back"
    next: "Next"
    finish: "Done"
    show: "Show me"
    "no": "No, thanks"
    start: "Tour"
    welcome:
      title: "Welcome"
      text: "I'm {name}, the voice of this home. In a minute I'll show you where everything is. You can always skip the tour and take it again later with the compass at the top right."
    vesta:
      title: "This is me"
      text: "My colour shows what I'm doing. Tap me and I'll ask what I can do for you; hold me to pause me for a while."
    ask:
      title: "Ask something"
      text: "Ask me a question here, typed or spoken. I answer in my window."
    pause:
      title: "Pause"
      text: "Want me to do nothing for a while? Tap here. In an emergency I always keep working."
    help:
      title: "Help and tour"
      text: "The question mark opens the manual; you can also ask me something there. The compass beside it takes you on this tour again."
    prefs:
      title: "My preferences"
      text: "Here you choose your level, whether I speak aloud, and how I address you."
    talk:
      title: "Ask or say something"
      text: "Tap here to ask me something. In my window you talk or type; our conversations are kept in Logbook afterwards."
    mind:
      title: "What I thought"
      text: "The latest thing I did, in one sentence. More in Logbook shows the rest, and why."
    today:
      title: "Today"
      text: "A short overview of the day, with what I took care of."
    rooms:
      title: "Rooms"
      text: "Per room you see who is there, what is on and how warm it is. Tap a room for more."
    tabs:
      title: "The screens"
      text: "Here you switch between the screens. Logbook has everything that happened: what I did, notifications and our conversations."
    brain:
      title: "Brain"
      text: "Here you see how far I am, the house rules and the rhythm of the house."
    brain_expert:
      title: "Brain on Expert"
      text: "On Expert, Brain also shows all devices and entities. Every decision, with its checks, is in the Logbook."
    settings:
      title: "House settings"
      text: "As an administrator you find the House settings here: my name and voice, the AI and more."
    done:
      title: "Done"
      text: "That's it. Feel free to ask me anything; you'll find the tour again behind the compass at the top right."
    more:
      title: "Something new"
      text: "You now see more than before. Do you want to see what's new?"
  manual:
    title: "Full manual"
    larger: "Larger" # the whole screen (E-324)
    smaller: "Smaller"
    apart: "New window"
    none: "The manual is not available in this language yet."
  mic:
    insecure_ha_ios: "In the Home Assistant app: Settings › Companion App › Servers › your server › Internal URL. Remove your home network there or clear the internal URL. Then the app uses the secure (https) connection at home too, and I can hear you."
    insecure_ha_android: "In the Home Assistant app: Settings › Companion app › Servers › your server › Internal URL. Remove your home network there or clear the internal URL. Then the app uses the secure (https) connection at home too, and I can hear you."
    insecure_browser: "Open Home Assistant through your secure address starting with https (for example your external address) instead of http."
    short: "Talking back is not possible here: this connection is not secure (no https)."
    title: "I can't hear you yet"
    denied: "The microphone is off for HouseMind."
    frame: "This page does not allow the microphone inside HouseMind. Open HouseMind in a tab of its own, or talk through Assist."
    insecure: "Talking back only works over a secure connection (an address starting with https) or in the Home Assistant app."
    no_device: "I can't find a microphone on this device."
    other: "The microphone doesn't work right now. Try again in a moment."
    assist: "You can always talk to me through Assist in the Home Assistant app too, with HouseMind as the assistant."
    retry: "Try again"

    guests:
      title: "Gäste"
      what: "Kein Bewohner ist zu Hause, aber es kommt doch jemand herein, etwa ein Babysitter oder Gäste."
      expect: "Nach ein paar Minuten denkt HouseMind, dass Gäste da sind, und fragt, ob das stimmt. Aus einem Tag mit Gästen lernt es nichts."
    smoke:
      title: "Rauch"
      what: "Ein Rauchmelder schlägt Alarm."
      expect: "Sofort eine Notfallmeldung, alle Lampen voll an, damit man den Weg sieht, und die Lüftung aus. Schlösser gehen nie von selbst auf. Wähle danach ‚Alles wieder sicher‘."
    leak:
      title: "Wasserleck"
      what: "Ein Leckmelder wird nass."
      expect: "Sofort eine Meldung. Hat das Haus einen Hauptwasserhahn, geht er zu. Wähle danach ‚Alles wieder sicher‘."
    frost:
      title: "Frost"
      what: "Ein Frostmelder misst Frostgefahr."
      expect: "Eine Meldung, und die Heizung in diesem Raum geht auf mindestens 8 °C, wenn es eine gibt. Sonst läuft das Haus normal weiter."
    burglar:
      title: "Einbruchalarm"
      what: "Alle sind weg und die Alarmanlage ist an. Dann geht der Alarm los."
      expect: "Eine Notfallmeldung und alle Lampen an. Nur Vorhänge, die ein Administrator dafür gewählt hat, gehen auf; standardmäßig nichts."
    price_negative:
      title: "Negativer Strompreis"
      what: "In den nächsten zwei Stunden kostet Strom weniger als nichts."
      expect: "HouseMind macht einen neuen Energieplan und verlegt Aufheizen und Geräte in diese Stunden. Du siehst es unter Energie. In den ersten zwei Wochen misst HouseMind nur und zeigt, was es tun würde."
    sun_full:
      title: "Volle Sonne auf den Paneelen"
      what: "Um die Mittagszeit scheint die Sonne voll auf die Solarmodule."
      expect: "Es kommt mehr Strom herein, als das Haus braucht. Unter Energie siehst du den Überschuss. Hat das Haus eine Batterie, ein Auto oder einen Warmwasserspeicher, nutzt HouseMind ihn dafür; in den ersten zwei Wochen zeigt es nur, was es tun würde."
    update:
      title: "Nach einem Update"
      what: "Home Assistant bekommt ein Update. Danach startet eine Integration nicht mehr, und eine Lampe ist kurz weg."
      expect: "Unter Check-up (auf Experte im Menü), bei ‘Nach dem letzten Update’, siehst du nach 30 Minuten, was seitdem nicht mehr funktioniert. Was kurz weg war und wieder geht, steht nach 2 Stunden dabei."

help:
  l1:
    q1: "Was macht HouseMind?"
    a1: "HouseMind kümmert sich für dich um Licht, Vorhänge und Heizung. Du merkst kaum etwas davon. In einem Notfall, zum Beispiel bei Rauch oder einem Leck, handelt es sofort."
    q2: "Was bedeutet die Kugel?"
    a2: "Die Kugel ist {name}, die Stimme deines Hauses. Ihre Farbe, Form und ihr Wort zeigen, wie es läuft; rot mit zwei Ringen heißt Notfall. Tippe auf ihr Wort, um zu sehen, was jede Farbe bedeutet, oder auf die Zeile darunter für die Meldung."
    q3: "Wie frage ich etwas?"
    a3: "Fragen ist einfach: Tippe auf {name} oder auf ‚Frag {name}‘. Sie fragt, was sie für dich tun kann, und hört zu. Für deine nächste Frage tippst du wieder auf sie. Wartet etwas auf dich, sagt sie das zuerst. Kann dein Gerät nicht zuhören, sagt sie kurz, was los ist."
    q4: "Wie pausiere ich HouseMind?"
    a4: "Tippe auf ‚Pause‘ oder halte {name} gedrückt. Wähle ‚Für 1 Stunde‘, ‚Bis morgen‘ oder ‚Bis ich es wieder einschalte‘; bei jedem Knopf steht, bis wann. Notfallreaktionen funktionieren weiter."
    q5: "Es ist etwas passiert, das ich nicht wollte."
    a5: "Stell es einfach selbst zurück. HouseMind merkt das, lässt es eine Weile in Ruhe und lernt daraus."
    q6: "Ich möchte mehr sehen."
    a6: "Tippe oben rechts auf die Person, Meine Einstellungen, und wähle unter Über mich eine andere Stufe."
    q7: "Kann HouseMind mich wecken?"
    a7: "Ja, wenn auf deinem Telefon ein Wecker gestellt ist: Dann geht das Licht im Schlafzimmer vorher langsam an und der Raum wird warm. Auf den anderen Stufen kann HouseMind dich auch zu der Zeit wecken, zu der du meistens aufstehst."
    q8: "Kann ich mit HouseMind sprechen?"
    a8: "Ja, über den Sprachassistenten von Home Assistant, wenn ein Administrator die Integration eingeschaltet hat. Frag zum Beispiel: Wie geht es?"
    q9: "Was macht HouseMind mit Wasser?"
    a9: "Läuft lange Wasser, obwohl es niemand benutzt, meldet HouseMind das. Mit einem Hauptwasserhahn kann es ihn schließen – nie öffnen."
    q10: "Ersetzt HouseMind meinen Rauchmelder oder meine Alarmanlage?"
    a10: "Nein. HouseMind hilft bei der Sicherheit, ersetzt aber keinen zertifizierten Rauchmelder, CO-Melder oder keine Alarmanlage. Behalte sie im Haus und teste sie regelmäßig."
    q11: "Wer ist {name}?"
    a11: "{name} ist die Stimme deines Hauses. Tippe auf sie: Sie fragt, was sie für dich tun kann. Was sie sagt, steht immer auch als Text da. Unter Meine Einstellungen wählst du, ob sie du oder Sie sagt und ob sie laut spricht."
    q12: "Kann ich die Tour noch einmal machen?"
    a12: "Ja. Tippe oben rechts auf den Kompass, ‚Tour‘: {name} zeigt dir noch einmal, wo alles ist. Wählst du eine höhere Stufe, zeigt sie dir von selbst, was neu ist. Mit ‚Überspringen‘ hörst du sofort auf."
    q13: "Wie weit ist HouseMind?"
    a13: "Frag {name}: ‚Wie weit bist du?‘ oder ‚Wie weit bist du mit der Beleuchtung?‘. Sie sagt pro Bereich, wie weit HouseMind ist und was noch fehlt, und zeigt es dir, wenn du willst."
    q14: "Kann ich andere Farben wählen?"
    a14: "Ja. Tippe oben rechts auf die Person (Meine Einstellungen), wähle Dieses Gerät und dann ein Farbschema, etwa Hell, Hoher Kontrast oder Nacht. Das gilt nur für dieses Gerät; die Farben von {name} bleiben gleich."
    q15: "Bekomme ich eine Nachricht, wenn etwas nicht stimmt?"
    a15: "Bei einem Notfall, etwa Rauch oder einem Leck, bekommst du eine Nachricht auf dein Telefon, auch nachts, außer du hast Nein gesagt. Hast du unter Meine Einstellungen Ja zu Nachrichten bei Gefahr gesagt, auch bei etwas Unsicherem, etwa einer offenen Tür, wenn niemand zu Hause ist."
    q16: "Was bewahrt HouseMind über mich auf?"
    a16: "Schau in Meine Einstellungen › Über mich › Meine Daten: deine Stufe, deine Einwilligungen, deine Hausregeln und wie lange HouseMind was aufbewahrt. ‚Als Datei speichern‘ gibt dir deine eigenen Daten. ‚Vergiss mich‘ löscht, was HouseMind über dich aufbewahrt."
    q17: "Ich brauche mehr Zeit zum Sprechen oder Lesen"
    a17: "Wähle in Meine Einstellungen › Über mich › Zeit Länger oder Lang. Dann hört {name} länger zu und kurze Meldungen bleiben länger stehen; bei Lang, bis du sie wegtippst. Während sie zuhört, gibt dir ‚Noch kurz‘ mehr Zeit."
    q18: "Was ist ‚Das Haus spielen‘?"
    a18: "Ein Feld in einem Demohaus, auf einem breiten Bildschirm. ‚Abspielen‘ lässt die Zeit laufen, ‚Stopp‘ hält sie an; unter ‚Selbst spielen‘ stellst du alles ein, auch während die Zeit läuft. ‚Geschichten‘ spielt ein Stück Hausleben, ‚Die Zeit‘ springt vor. ‚Was gerade passiert ist‘ und das Logbuch zeigen, was HouseMind tat; das echte Haus merkt nichts."
    q19: "Was bedeutet ‘Keine Verbindung – neuer Versuch…’?"
    a19: "Dieser Bildschirm hat kurz keinen Kontakt zu HouseMind, zum Beispiel während eines Updates oder wenn das Netzwerk weg war. HouseMind selbst arbeitet einfach weiter. Der Bildschirm verbindet sich von selbst wieder: sofort, wenn du zurückkommst oder das Netzwerk wieder da ist, sonst innerhalb von zehn Sekunden. Steht es nach einer Minute noch da, lade die Seite neu."
  l2:
    q1: "Was sehe ich?"
    a1: "Oben siehst du, wie es läuft. Darunter höchstens drei Karten, die auf dich warten, ein Satz dazu, was HouseMind sich dachte, und eine Karte für jeden Raum. Alles andere steht im Logbuch."
    q2: "Was ist die Meldung nach einer Aktion?"
    a2: "Sie sagt, was HouseMind gerade selbst versucht hat, während diese Regel noch auf Vorschlagen steht. Tippe auf ‚Warum?‘ für den Grund oder auf ‚Rückgängig‘, um es zurückzustellen. Bei Selbstständig macht HouseMind es einfach, ohne Meldung; du siehst es im Logbuch."
    q3: "Wie viele Benachrichtigungen bekomme ich?"
    a3: "Höchstens drei am Tag; Notfälle und Sicherheit kommen immer, auch nachts. In deinen Ruhezeiten wartet der Rest bis zum Morgen. Informationen kommen einmal am Tag in einem Überblick. Unter Meine Einstellungen wählst du weniger oder mehr."
    q4: "Was kann ich {name} fragen?"
    a4: "Tippe auf ‚Frag {name}‘ und sprich oder schreib, zum Beispiel ‚wie geht's‘, ‚warum‘, ‚Pause‘ oder ‚rückgängig‘. Mit einer KI kannst du mehr fragen, zum Beispiel ‚warum war es gestern im Bad kalt?‘: Dann schaut sie nach, mit neutralen Bezeichnungen. Du kannst auch weiterreden, etwa ‚und in der Küche auch‘; bevor sie etwas tut, fragt sie. ‚Stell das zurück‘ stellt zurück, was sie gerade getan hat. Ihre Antwort erscheint, während sie kommt. Deine Gespräche stehen danach im Logbuch. Weiß sie etwas nicht, sagt sie das."
    q5: "Warum ist etwas nicht passiert?"
    a5: "Öffne den Raum und tippe auf das Gerät. Darunter steht, was HouseMind damit macht und warum."
    q6: "Sind meine Daten sicher?"
    a6: "Alles bleibt in deinem Haus. Nach außen geht nur etwas, wenn ein Administrator Ja dazu sagt, oder für eine Meldung auf deinem Telefon. Die ganze Datenschutzerklärung steht unter Über HouseMind."
    q7: "Was macht HouseMind mit Energie?"
    a7: "Nach zwei Wochen Messen macht HouseMind warmes Wasser und startet Geräte, wenn der Strom günstig ist oder die Sonne scheint. Die Hausbatterie und das Auto steuert es nicht. Unter Energie zeigt ‚Die nächsten 24 Stunden‘ Preis, Sonne und was HouseMind tut."
    q8: "Was ist der Morgenüberblick?"
    a8: "Wenn du morgens aufstehst, sagt HouseMind kurz das Wetter, den Kalender und etwas zum Strom, über einen Lautsprecher oder oben im Logbuch. Den Kalender liest es nur nach einem Ja eines Administrators. Unter Meine Einstellungen wählst du, was darin steht."
    q9: "Was ist der Check vor dem Schlafen?"
    a9: "Wenn du ins Bett gehst, schaut HouseMind, ob alles zu und aus ist. Steht noch eine Tür offen, hörst oder siehst du das. HouseMind schließt selbst nie ein Schloss oder eine Tür auf oder zu."
    q10: "Heute ist anders. Was nun?"
    a10: "Tippe im Logbuch auf ‚Heute anders?‘ oder schreib zum Beispiel: Heute arbeite ich von zu Hause. HouseMind passt sich an diesem Tag an, ohne dein normales Muster zu ändern."
    q11: "Was ist der Hausbericht?"
    a11: "Jeden Sonntagabend ein kurzer Bericht: was HouseMind getan hat, was du zurückgestellt hast und was es gespart hat. Du findest ihn im Logbuch. Unter Meine Einstellungen wählst du einen anderen Tag."
    q12: "Warum bekomme ich einen Hinweis zu einer Batterie?"
    a12: "HouseMind achtet auf Wartung: eine fast leere Batterie, ein Rauchmelder oder anderer Notfallmelder, der seit einem Tag nicht antwortet, ein Filter und der Abend vor der Müllabfuhr. Es meldet nur; es tut nichts."
    q13: "Der Backofen ist an und ich bin weg?"
    a13: "Dann bekommst du eine Meldung. Lässt sich der Backofen oder das Kochfeld ausschalten, fragt HouseMind ‚Soll ich es ausschalten?‘ und tut es nur nach deinem Ja. Einschalten tut HouseMind nie. Brennt eine Lampe seit vier Stunden in einem Raum, in dem seit einer Stunde niemand war, fragt HouseMind auch ‚Soll ich es ausschalten?‘; mit KI steht ein möglicher Grund dabei. Nach ‚Nein, anlassen‘ fragt es einen Monat lang nicht mehr nach dieser Lampe."
    q14: "Ein Sensor draußen hört einen Alarm?"
    a14: "Hört zum Beispiel eine Kamera auf der Terrasse einen Rauchmelder, bekommst du eine Meldung, auch nachts. HouseMind schaltet dann kein Licht ein und spricht nicht: Das Geräusch kann von den Nachbarn kommen."
    q15: "Was sind Zonen in einem Raum?"
    a15: "Manche Anwesenheitssensoren kennen Zonen, etwa ‚Bett‘. Trägt eine Zone den Namen eines anderen Raums, zählt sie dort; sonst ist sie ein Teil des Raums. Unter Zonen in einem Raum siehst du pro Zone, ob jemand da ist."
    q16: "Zählt ein Saugroboter als jemand?"
    a16: "Nein. Während ein Saugroboter fährt und noch 2 Minuten danach zählt Bewegung nicht. Anwesenheit, die dann beginnt, zählt nur wenig, und gar nicht, wenn niemand zu Hause ist. Wer schon da war, bleibt da."
    q17: "Was steht unter Was ich mir dachte?"
    a17: "Was HouseMind sah, dachte und tat. Bei Sorglos steht unter {name} ein Satz über die letzte Stunde. ‚Mehr im Logbuch‘ zeigt den Rest, mit ‚Warum?‘ und ‚Rückgängig‘. Bei Informiert ein Satz pro Sache, bei Beteiligt auch, was es ließ, bei Experte auch die Details. Ab Informiert steht das Neueste als zwei Kästchen da: was ich sah und was ich tat oder frage. Auf Beteiligt zeigt das Logbuch sah, dachte und tat untereinander, mit einer Linie: Sie fließt, wenn es getan ist, Punkte warten auf dich, und eine Linie, die stoppt, wurde nicht getan. Auf Sorglos hat ein dünner Ring um {name} einen Punkt für jedes Mal, dass HouseMind heute etwas tat, zur Stunde, in der es geschah. Auf Informiert und Beteiligt zeigt ‚Heute‘ pro Raum, was es tat, fragte oder ließ."
    q18: "Wie spreche ich mit {name}?"
    a18: "Tippe auf {name}: Ihr Fenster öffnet sich. Siehst du ‚Ich höre zu‘, sprich einfach; klappt das Mikrofon nicht, steht dort, warum. Schreiben kannst du unten im Fenster. Ohne KI gibt sie Knöpfe wie ‚Wie steht es im Haus?‘ und ‚Hilfe‘ und versteht feste Fragen. Nach ihrer Antwort hört sie nicht von selbst weiter zu: Tippe wieder auf sie, auch in ihrem Fenster."
    q19: "Stellt {name} auch selbst Fragen?"
    a19: "Ja. Wartet etwas auf deine Antwort, fragt {name} dich in ihrem Fenster, mit den Knöpfen dazu; bei einem Vorschlag auch ‚Warum?‘. Die Frage bleibt stehen, bis du antwortest oder das Fenster schließt; die nächste kommt danach. Dort stehen auch ‚Ich schaue es mir an‘ und ‚Später‘, und für einen Administrator ‚Nicht mehr anzeigen‘. Nach ‚Später‘ wartet die Frage im Logbuch. Hat ein Administrator ihr Fenster für das Haus ausgeschaltet, wartet die Frage im Logbuch; tippe auf {name}, dann stellt sie sie trotzdem."
    q20: "Wo sehe ich, wie weit HouseMind ist?"
    a20: "Unter Zuhause steht ‚Bereit für Selbstständigkeit?‘: pro Bereich, etwa Beleuchtung, ein Satz dazu, wie weit HouseMind ist und was noch fehlt. Du kannst auch {name} fragen: ‚Wie weit bist du?‘. HouseMind verdient sich jeden Schritt selbst."
    q21: "Wo sind die Hilfe und die Hauseinstellungen?"
    a21: "Oben rechts, auf jedem Bildschirm: Das Fragezeichen ist die Hilfe mit der Anleitung, der Kompass ist die Tour, das Zahnrad sind die Hauseinstellungen (nur für Administratoren) und die Person sind Meine Einstellungen. Kurze Meldungen wie ‚Gespeichert‘ stehen kurz neben diesen Knöpfen."
    q22: "Lernt HouseMind auch aus dem, was schon passiert ist?"
    a22: "Ja. Nach deinem Ja zum Lernen liest HouseMind einmal, was Home Assistant aufbewahrt hat, meist 10 Tage. Das bleibt im Haus und bringt etwas höchstens bis Vorschlagen. In den Hauseinstellungen stehen ‚Auch aus der Historie in Home Assistant lernen‘ und ‚Neu einlesen‘."
    q23: "Was steht im Logbuch?"
    a23: "Oben steht ‚Wartet auf dich‘: die Benachrichtigungen, die noch auf dich warten, mit ihren Knöpfen. Die Zahl bei Logbuch im Menü zählt genau diese, nicht was neu ist. Darunter alles, was passiert ist, 30 Tage zurück, mit deinen eigenen Gesprächen. Mit Filter wählst du Getan, Nur beobachtet, Benachrichtigungen oder Gespräche, mit Zeitraum etwa Heute. Bei dem, was HouseMind tat, stehen ‚Warum?‘ und ‚Rückgängig‘. Administratoren sehen bei KI ‚Ansehen, was gesendet und empfangen wurde‘: den Auftrag (warum HouseMind fragt und welche Antwort es möchte), was gesendet wurde und die Antwort."
    q24: "Wie beginne ich neu oder setze alles auf die Werkseinstellungen zurück?"
    a24: "Als Administrator: Hauseinstellungen › Neu beginnen. ‚Einführung noch einmal‘ geht die Einführung noch einmal durch. ‚Neu lernen‘ lässt HouseMind vergessen, was es gelernt hat; deine Hausregeln bleiben. ‚Zurück auf Werkseinstellungen‘ löscht alles; danach richtest du es mit ‚Einrichten‘ neu ein. Notfallreaktionen funktionieren weiter."
    q25: "Wie schalte ich den Urlaubs- oder Gästemodus ein?"
    a25: "Tippe auf {name} und wähle ‚Urlaub‘ oder ‚Gäste‘; danach steht dort ‚Wieder zu Hause‘. Du kannst es auch sagen: ‚wir fahren in den Urlaub‘. In beiden Modi lernt HouseMind nicht. Im Urlaub wirkt das Haus abends bewohnt."
    q26: "Was machen die Daumen?"
    a26: "Ab Informiert stehen 👍 und 👎 unter etwas, das {name} selbst getan hat, auch bei ‚Warum?‘; hat sie etwas selbst versucht, während es noch auf Vorschlagen stand, fragt sie manchmal, ob es gut war, mit ‚👍 Gut‘ und ‚👎 Nicht gut‘. Bei Selbstständig fragt sie nichts, auch nicht hinterher, und es kommt keine Meldung. Ein Daumen nach unten zählt als Korrektur. Deine Antwort steht im Logbuch; ab Beteiligt zählt ‚Bereit für Selbstständigkeit?‘ die Daumen."
    q27: "Kann ich ‚Hey {name}‘ sagen?"
    a27: "Ja, mit einem Sprachsatelliten oder mit Assist auf deinem Telefon. Ein Aktivierungswort mit ihrem Namen lässt du selbst erstellen; Home Assistant erklärt, wie. Gibt es eines, setzt HouseMind es in ihre eigene Assist-Pipeline (Hauseinstellungen › {name})."
    q28: "Was macht HouseMind mit Kameras?"
    a28: "HouseMind schaut sich selbst keine Bilder an. Es nutzt nur, was deine Kameras schon in Home Assistant melden, etwa eine Person oder ein Paket. Sind alle weg, bekommst du eine Meldung mit dem Bild. HouseMind speichert nie Bilder, Gesichter oder Kennzeichen. Nur wenn ein Administrator es einschaltet und die KI von Home Assistant im Haus arbeitet, beschreibt diese KI bei einer Meldung, was auf dem Bild zu sehen ist; das Bild bleibt im Haus."
    q29: "Schaltet HouseMind die Alarmanlage ein oder aus?"
    a29: "{name} fragt nur: ‚Soll ich die Alarmanlage auf abwesend stellen?‘, wenn alle weg sind, und ‚auf Nacht‘, wenn das Haus schlafen geht. Ausschalten tut HouseMind sie nie. Welche Alarmanlage es ist, wählst du unter Hauseinstellungen › Haus › Sicherheit."
    q30: "Wie regelt HouseMind die Heizung?"
    a30: "Ruhig. Ist länger als einen Tag niemand zu Hause, geht die Heizung 3 Grad herunter, nicht unter 15 °C. Bleibt ein Raum zu kalt, stellt HouseMind den Thermostat etwas höher. Was du selbst einstellst, merkt es sich als deinen Wunsch."
    q31: "Ich bekomme zu viele Nachrichten. Was kann ich tun?"
    a31: "Jede Nachricht hat ‚Ich schaue es mir an‘ und ‚Später‘. ‚Später‘ legt sie eine Weile weg. Ein Administrator hat auch ‚Nicht mehr anzeigen‘: Das schaltet diese Art für alle im Haus ab, außer Notfällen. Im Logbuch stehen sie noch als ‚nicht angezeigt‘. Ein Administrator holt sie mit ‚Wieder anzeigen‘ zurück, im Logbuch oder unter Hauseinstellungen › Haus."
    q32: "Warum steht in einem Raum noch jemand?"
    a32: "Hat der Raum einen Präsenzsensor, ist er leer, sobald dieser Sensor niemanden mehr sieht. Hat er nur einen Bewegungsmelder, bleibt ‚Jemand da‘ noch ein paar Minuten stehen: Ein Bewegungsmelder sieht nicht, ob jemand still sitzt oder gegangen ist. Ein Präsenzsensor, der offline ist, zählt nicht."
    q33: "Warum stehen die Geräte in einem Raum unter Überschriften?"
    a33: "Jede Überschrift ist ein Gerät, mit Name und Typ aus Home Assistant. Darunter steht, was dazugehört. Das eigene Licht eines Sensors oder Sprachassistenten ist eine Status-LED: HouseMind zählt es nicht als Licht im Raum und schaltet es selbst nie ein oder aus. Die Einstellungen eines Geräts sind unten eingeklappt; HouseMind ändert sie nie. Unter jedem Namen steht in einem Wort, was es ist, etwa Lampe, Thermostat des Raums, Einstellung oder noch unbekannt."
    q34: "Wie lange bleibt das Licht an, wenn niemand mehr da ist?"
    a34: "Das lernt HouseMind pro Raum aus dem, was ihr und eure Automationen tun. Bis es das weiß, ist es kurz in Toilette, Bad, Abstellraum oder Keller und länger in einem Flur, in dem man hin und her geht. Sieht dich nur ein Bewegungsmelder, wartet es mindestens 3 Minuten. Erst wird das Licht kurz gedimmt. Kommst du zurück oder machst du das Licht gleich wieder an, wartet HouseMind dort künftig länger. Bei ‚Bereit für Selbstständigkeit?‘ siehst du die Wartezeit pro Raum. Ohne Anwesenheits- oder Bewegungssensor kann HouseMind nicht sehen, dass der Raum leer ist: Dort schaltet es das Licht nicht aus."
    q35: "Geht das Licht draußen an, wenn wir weg sind?"
    a35: "Ja, sobald HouseMind das selbst tun darf. Wenn es dunkel wird, gehen die Lampen draußen an, auch wenn niemand zu Hause ist: So sieht das Haus bewohnt aus. Sie gehen aus, wenn das Haus schlafen geht. Ist niemand zu Hause, um deine übliche Schlafenszeit, jeden Abend ein paar Minuten anders."
    q36: "Geht das Licht draußen an, wenn ich im Dunkeln nach Hause komme?"
    a36: "Ja, am Eingang, sobald HouseMind das selbst tun darf. Kommst du im Dunkeln nach Hause, gehen die Lampen an der Einfahrt, an der Haustür oder am Carport sofort an und nach 5 Minuten wieder aus. Ist dann noch jemand draußen, bleiben sie länger an. Brennt das Licht schon, bleibt es, wie es ist. Schaltest du die Lampe kurz danach wieder ein, lässt HouseMind sie beim nächsten Mal länger brennen."
    q37: "Warum fragt HouseMind, ob es etwas ab jetzt selbst tun darf?"
    a37: "Weil es gesehen hat, dass es oft genug gut lief. Du siehst die Frage unter ‚Wartet auf dich‘ im Logbuch. Wähle ‚Ja, ab jetzt selbst‘, ‚Noch nicht‘ oder ‚Nie‘. Stellst du es später in einer Woche zweimal zurück, fragt HouseMind wieder zuerst."
    q38: "Ich habe eine Lampe von Hand bedient. Wie lange bleibt HouseMind davon weg?"
    a38: "Solange jemand im Raum ist, bleibt deine Wahl bestehen, höchstens ein paar Stunden. War der Raum leer und kommt jemand herein, ist das ein neuer Moment: Das Licht geht wieder wie gewohnt an, wenn es dunkel ist. Kommst du innerhalb von 2 Minuten zurück, bleibt es, wie du es verlassen hast. Schaltest du eine Lampe aus, während niemand in diesem Raum ist, zum Beispiel mit einem Knopf, der alles ausschaltet, gilt das sofort. Schaltest du sie so ein, bleibt sie an."
    q39: "Warum ändert sich die Farbe des Lichts mit dem Tag?"
    a39: "Das Licht folgt dem Tag: tagsüber heller und weißer, abends sanfter und wärmer. Hast du Adaptive Lighting, liest HouseMind dessen Einstellungen und übernimmt sie: auf Autonom macht es das selbst, darunter macht es noch Adaptive Lighting. Ohne diese Integration macht HouseMind selbst so eine Linie, aus dem, was es in diesem Raum für den Abend und den Tag gelernt hat. Wählst du selbst etwas anderes, bleibt es so, bis die Lampe ausgeht. Machst du das oft, merkt HouseMind es sich."
  l3:
    q1: "Was sind Vorschläge?"
    a1: "Wenn HouseMind noch nicht sicher ist, fragt es zuerst. Du antwortest mit ‚Mach es‘, ‚Jetzt nicht‘, ‚Ab jetzt selbst‘ oder ‚Nie‘. ‚Ab jetzt selbst‘ tut es jetzt und ab jetzt, ohne zu fragen. ‚Nie‘ wird nach deiner Bestätigung zur Hausregel. Mit KI kann HouseMind Administratoren auch einmal pro Woche höchstens drei Hausregeln vorschlagen, aus dem, was es gelernt hat, mit Begründung. Nur ‚nie‘ oder eine Höchsttemperatur, und erst nach deinem Ja; nach Nein kommt dieser Vorschlag nicht wieder."
    q2: "Was sind die Schritte?"
    a2: "Jede Fähigkeit geht pro Raum von Beobachten über Vorschlagen zu Selbstständig. Vorschlagen kommt schnell. Zu Selbstständig geht sie, wenn sie oft genug richtig lag, mindestens eine Woche lang: dann fragt HouseMind einmal, und ein Ja reicht. Wie weit sie pro Bereich gehen darf, wählt ein Administrator unter Hauseinstellungen › Lernen und Stufen › Bereiche."
    q3: "Was sind Hausregeln?"
    a3: "Regeln, die immer gelten, zum Beispiel ‚nie die Vorhänge im Schlafzimmer vor 7:00 öffnen‘. Tippe sie ein oder wähle sie aus; HouseMind wiederholt eine Regel zuerst. Mit einer KI änderst du eine Regel auch in deinen eigenen Worten, etwa ‚mach die Regel am Wochenende eine Stunde später‘; HouseMind wiederholt die neue Regel und wartet auf dein Ja. Du findest sie im Gehirn, im Tab Hausregeln. Beim Entfernen fragt es zuerst Ja oder Nein."
    q4: "Was zeigt der Grundriss?"
    a4: "Jeden Raum pro Etage. Ein heller Rand heißt, dass jemand da ist. Ein warmes Leuchten heißt, dass ein Licht an ist."
    q5: "Wie pausiere ich nur einen Teil?"
    a5: "Tippe unten auf ‚Pause‘ oder halte {name} gedrückt und wähle Beleuchtung, Rollläden und Vorhänge oder Klima."
    q6: "Was macht HouseMind nie?"
    a6: "Es schaltet nie einen Alarm aus, entriegelt nie ein Schloss und öffnet nie ein Garagentor, ein Tor oder eine Tür. Auch nicht im Notfall."
    q7: "Was passiert mit meinen Automatisierungen?"
    a7: "HouseMind erstellt oder löscht nie Automatisierungen und lässt ihre Geräte in Ruhe. Stellst du im Gehirn unter ‚Bereit für Selbstständigkeit?‘ eine Regel auf Selbstständig, schaltet HouseMind die Automatisierung, die sie steuert, sofort aus und macht es selbst; tut sie mehr, fragt es zuerst. Lief alles, was sie tut, oft genug gut, fragt HouseMind einmal unter Wartet auf dich; nach Ja geht sie aus, und HouseMind macht es selbst. Geht es zurück auf Vorschlagen oder Beobachten, geht die Automatisierung sofort wieder an. Rückgängig machen geht immer."
    q8: "Kann HouseMind das Auto laden?"
    a8: "Nein. HouseMind steuert die Ladestation und die Hausbatterie nicht. Im Tab Energie siehst du aber, wie voll das Auto ist und ob es lädt. Frag {name} zum Beispiel ‚lade das Auto bis 7:00 voll‘, dann nennt sie den günstigsten Moment."
    q9: "Woran sehe ich, dass es sich lohnt?"
    a9: "Nach den zwei Wochen Messen vergleicht HouseMind jeden Tag mit dem, was dieser Tag ohne HouseMind gekostet hätte. Dabei rechnet es Kälte und Sonne mit ein. Du siehst es auch, wenn es schlechter ausfällt."
    q10: "Was sind Momente?"
    a10: "Momente wie Kochen, Essen, Film oder Lesen, mit dem passenden Licht. Öffne einen Raum und tippe auf einen Moment, oder sag ihn. Stell das Licht ein, wie du magst, und tippe auf ‚Merken‘ für einen eigenen Moment."
    q11: "Warum fragt HouseMind abends, ob es mich wecken darf?"
    a11: "Solange HouseMind das Wecken noch lernt, fragt es am Abend vorher. Ja gilt nur für diesen Morgen. Schaltest du das Licht beim Wecken aus, bleibt es aus."
    q12: "Wie nutze ich ein Wandtablet?"
    a12: "Öffne HouseMind auf dem Tablet und wähle unter Meine Einstellungen › Dieses Gerät › Wandtablet den Raum. Das Tablet wacht auf, wenn jemand da ist. ‚Vollbild‘ verbirgt die Leiste des Browsers; ‚Wandtablet beenden‘ setzt alles zurück."
    q13: "Was sind Testbereiche?"
    a13: "Neue Bereiche: Haushalt, Medien, Putzen, Garten sowie Pflege und Wohlbefinden. Zuerst sind sie aus; ein Administrator schaltet sie unter Hauseinstellungen › Lernen und Stufen › Bereiche ein. Pflege und Wohlbefinden nur mit einem Ja der betroffenen Person."
    q14: "Was ist Pflege und Wohlbefinden?"
    a14: "Wenn die betroffene Person zu Hause ist und sich lange nichts bewegt, bekommt eine ausgewählte Kontaktperson eine Nachricht. Nur mit Zustimmung der betroffenen Person."
    q15: "Was macht HouseMind, wenn Home Assistant neu startet?"
    a15: "Dann tut HouseMind kurz nichts Neues und du siehst ‚Achtung‘. Es verbindet sich von selbst wieder und prüft danach, ob alles noch funktioniert. Was nicht mehr funktioniert, bekommt eine Meldung; dort schaut HouseMind nur zu, bis es wieder geht."
    q16: "Was steht unter HouseMind aktuell halten in den Hauseinstellungen?"
    a16: "Drei Dinge: Wissensupdates (neues Wissen über Geräte, Länder und Sprachen; abschaltbar), ob HouseMind den Kalender lesen darf (nur nach einem Ja) und der Knopf für das Diagnosepaket: eine Datei ohne Namen zum Teilen, wenn etwas nicht stimmt."
    q17: "Wie geht HouseMind mit Lampengruppen um?"
    a17: "HouseMind schaltet am liebsten eine Gruppe im eigenen Netz der Lampen: Sie reagieren zusammen. Danach Gruppen aus Home Assistant, dann einzelne Lampen. Ist eine Lampe in so einer Gruppe, zeigen das Logbuch, Was ich mir dachte und Bereit für Selbstständigkeit? nur die Gruppe. Wurde eine Lampe von Hand bedient, bleibt die Gruppe in Ruhe. Steht eine Lampe auf In Ruhe lassen, spricht HouseMind sie nie allein an, aber ihre Gruppe nimmt sie mit; stellst du die Gruppe auf In Ruhe lassen, bleibt alles darin still. Bei Experte: Gehirn › Geräte und Entitäten, nach Raum; dort stehen die Lampen einer Gruppe eingerückt unter der Gruppe."
    q18: "Wo sehe ich, wie weit HouseMind ist?"
    a18: "Im Gehirn, unter ‚Bereit für Selbstständigkeit?‘, siehst du pro Bereich und pro Fähigkeit in einem Raum den Schritt, den Wert gegenüber dem Ziel und was noch fehlt. Die Bereiche sind Kacheln: Tippe auf eine Kachel für die Erklärung und die Knöpfe dieses Bereichs, und die Liste darunter zeigt dann nur diesen. ‚Automatisierungen‘ zeigt, wie nah HouseMind am Übernehmen ist; unter ‚Mehr‘ steht die Erklärung."
    q19: "Wie finde ich schnell eine Automatisierung oder ein Gerät?"
    a19: "Über langen Listen stehen ein Suchfeld und ‚Filter‘: Kreuze pro Thema an, was du sehen willst; ‚Alle löschen‘ entfernt deine Auswahl. Unter Gehirn › Was ich weiß stehen auch die ‚Szenen und Skripte‘ aus Home Assistant, zum Ansehen."
    q20: "Lernt HouseMind auch aus dem, was schon passiert ist?"
    a20: "Ja. Nach deinem Ja zum Lernen liest HouseMind einmal, was Home Assistant aufbewahrt hat, meist 10 Tage. Das bleibt im Haus und bringt etwas höchstens bis Vorschlagen. In den Hauseinstellungen stehen ‚Auch aus der Historie in Home Assistant lernen‘ und ‚Neu einlesen‘."
    q21: "Wann ist es dunkel genug für Licht?"
    a21: "Das lernt HouseMind pro Raum von euch: Bei welchem Sonnenstand, oder wie viel Licht, macht ihr das Licht an, wenn ihr hereinkommt? Auch wann die Vorhänge abends zugehen, lernt es pro Raum."
    q22: "Wie viele Fragen stellt {name}?"
    a22: "Alle Fragen zusammen: bei Informiert höchstens eine am Tag, bei Beteiligt drei, bei Experte wählst du es unter Meine Einstellungen (sonst fünf). Der Rest wartet im Logbuch. Nach ‚Jetzt nicht‘ kommt eine Frage später wieder, nach ‚Nie‘ nicht mehr."
    q23: "Hier wohnen Menschen ohne eigenes Telefon, zum Beispiel Kinder."
    a23: "Schalte das unter Hauseinstellungen › Haus ein. Dann sind alle erst weg, wenn auch die Sensoren im Haus still sind. Trag auch ihre Vornamen ein: HouseMind nutzt sie nur, um sie bei der KI wegzulassen."
    q24: "Warum macht HouseMind etwas nicht mehr selbst?"
    a24: "Stellt jemand etwas in einer Woche zweimal zurück oder sagt zweimal Nein, geht HouseMind dort einen Schritt zurück und die Administratoren bekommen eine Nachricht. Danach verdient es sich den Schritt neu; unter ‚Bereit für Selbstständigkeit?‘ siehst du, wie weit."
    q25: "Kann ich selbst einen Schritt setzen oder etwas vergessen lassen?"
    a25: "Ja, als Administrator. Tippe unter ‚Bereit für Selbstständigkeit?‘ auf die Kachel eines Bereichs: In der Karte darunter steht ‚Selbst einen Schritt setzen‘. Was die Sicherheit nicht erlaubt, ist grau. ‚Vergiss das‘ löscht, was HouseMind über eine Fähigkeit in einem Raum gelernt hat. Du bestätigst immer mit Ja oder Nein."
    q26: "Welche Sprache spricht {name}?"
    a26: "In der App spricht sie deine Sprache, die du unter Meine Einstellungen wählst. Auf Lautsprechern, dem Wandtablet und in Assist spricht sie die Sprache des Hauses; die wählt ein Administrator unter Hauseinstellungen › {name} › Sprache des Hauses."
    q27: "Wie lese ich den Energieplan?"
    a27: "Unter Energie steht ‚Plan für die nächsten Stunden‘. Oben der Preis: blau ist negativ, orange ist teuer. Über der Linie, was hereinkommt, darunter, wohin es geht. Unten pro Gerät, was HouseMind tut. Tippe auf die Grafik oder einen Block für Details."
    q28: "Was macht der Check-up?"
    a28: "HouseMind schaut jede Stunde, was in Home Assistant kaputt ist, auch Backups und Speicher. Wichtiges kommt sofort als Meldung; ‚Ansehen‘ zeigt, was es ist. Die ganze Seite Check-up steht auf Experte im Menü."
    q29: "Zählt ein Knopf oder Wandschalter als Automatisierung?"
    a29: "Nein. Eine Automatisierung, die nur weitergibt, was ihr selbst tut, ist eure eigene Hand: ein Wandschalter, eine Fernbedienung oder ein Knopf in der App, die Lampen oder Schalter ein-, aus- oder umschalten oder dimmen. HouseMind bedient diese Lampen mit und fragt nie, ob es sie ausschalten darf; der Knopf funktioniert weiter. Was sie tut, zählt wie etwas, das ihr getan habt, also lässt HouseMind die Lampe danach eine Weile in Ruhe. Den Schalter selbst schaltet HouseMind nie."
    q30: "Was sehe ich unter Netzwerk?"
    a30: "Wähle unter Zuhause › Räume ‘Netzwerk’. {name} steht in der Mitte, mit ihrem Wort darunter; um sie herum die Räume, mit ihren Geräten als kleine Punkte. Tut HouseMind etwas, fließt zwanzig Sekunden lang eine Linie vom Raum über {name} zum Gerät: ‘fließt gerade’. Darunter bleibt stehen, was es zuletzt tat, mit der Uhrzeit und ‘Warum?’. Fragt HouseMind etwas, bleibt eine gepunktete Linie, solange die Frage offen ist: ‘wartet auf dich’. Darunter stehen die Frage und ‘Mach es’ und ‘Jetzt nicht’. Ist die KI an, siehst du einen gepunkteten Ring um {name}: Die KI denkt mit, entscheidet aber nie."
    q31: "Woher weiß HouseMind, ob Morgen, Abend oder Nacht ist?"
    a31: "Aus eurem eigenen Rhythmus, nicht von der Uhr. Nacht ist es, sobald das Haus schläft; ist noch jemand wach, dann zwei Stunden nach eurer üblichen Schlafenszeit. Der Morgen beginnt, wenn das Haus aufwacht, der Abend, wenn ihr meistens nach Hause kommt. Danach richten sich das Licht beim Hereinkommen und der Gruß von {name}. In einem Schlafzimmer geht ab der üblichen Schlafenszeit keine Lampe von selbst an. Kennt HouseMind eine Zeit noch nicht, schaut es auf die Uhr. Im Gehirn, im Tab Rhythmus, steht oben, was gerade ist. Unter den Balken steht ‚Demnächst‘: was HouseMind zu den nächsten Momenten des Tages tut, etwa wenn es dunkel wird oder das Haus schlafen geht."
    q32: "Wann macht HouseMind etwas ab jetzt selbst?"
    a32: "Wenn es oft genug gut lief: standardmäßig 85 von 100 Mal, 10-mal gesehen, in mindestens einer Woche. Dann steht eine Frage unter ‚Wartet auf dich‘, die nicht abläuft: ‚Ja, ab jetzt selbst‘, ‚Noch nicht‘ oder ‚Nie‘. Ein Ja reicht. Steuert es eine Automatisierung, bekommt nur ein Administrator die Frage, und nach Ja geht sie aus. Stellt es jemand in einer Woche zweimal zurück, fragt HouseMind wieder zuerst, und die Automatisierung geht wieder an."
    q33: "Hält das Licht vom Alarm oder der Türklingel einen Raum auf?"
    a33: "Nein. So eine Automatisierung gibt ein Signal: eine Farbe oder ein Blinken, das nicht durch jemanden im Raum, eine Tür, die Sonne oder die Uhrzeit beginnt. Sie bleibt an, hält nichts auf, und HouseMind lernt nichts daraus. Solange das Signal dauert, bleibt HouseMind von der Lampe weg. Bleibt die Lampe danach an, etwa bei einem ausgelösten Alarm, dann bis diese Lampe sich ändert. Eine Automatisierung, die nur Lampen schaltet, geht in der Frage mit, sobald deren Regeln bewiesen sind. Tut sie mehr, schaltet sie etwa auch eine Steckdose, dann bleibt sie an und behält nur ihre eigene Lampe."
    q34: "Wann gehen die Vorhänge im Schlafzimmer auf?"
    a34: "Wenn du aufgestanden bist, niemand mehr in dem Raum schläft und es draußen hell ist. Sieht ein Sensor, wer im Bett liegt oder im Raum ist, wartet HouseMind, bis er ein paar Minuten leer ist. Ohne solchen Sensor öffnet es sie nur, wenn alle weg sind, oder zu einem Zeitpunkt, den es von euch gelernt hat. In einem Raum, in dem heute Nacht niemand geschlafen hat, gehen sie mit dem Rest des Hauses auf."
    q35: "Ich habe ein Gerät hinzugefügt. Bekommt es von selbst Regeln?"
    a35: "Ja. Stellst du in Home Assistant ein Gerät in einen Raum, stehen die passenden Regeln sofort bei ‘Bereit für Selbstständigkeit?’, mit ‘Noch nicht gesehen’. Eine Regel für Feuchtigkeit oder CO₂ kommt erst, wenn der Raum auch diesen Sensor hat. Kennt HouseMind die Art des Raums nicht, fragt es einmal, was für ein Raum es ist; bis dahin bekommt der Raum die Regeln, die überall passen. Entfernst du ein Gerät, verschwindet seine Regel. Was HouseMind dafür gelernt hat, bewahrt es 30 Tage auf, falls wieder ein Gerät kommt."
  l4:
    q1: "Was ist der Entscheidungsverlauf?"
    a1: "Zu jeder Entscheidung siehst du die Lage, die Fähigkeit, die Zählungen und die Gewissheit, die sechs Prüfungen der Sicherheitsschranke und das Ergebnis. Im Gehirn, unter Mehr › Entscheidungsspur. Die Entscheidung steht als Strom da: Quelle, was ich sah, was ich dachte und das Ergebnis, darunter die sechs Schritte des Tors: bestanden, wo es stoppte oder nicht erreicht. Darüber zwei Spuren, der Kern und die KI-Spur, und heute von der Quelle zum Ergebnis."
    q2: "Was ist der Gedankenstrom?"
    a2: "Alles, was HouseMind erwogen hat, auch was es nicht gemacht hat, und warum nicht. Im Gehirn, unter Mehr › Gedankenstrom."
    q3: "Wie funktioniert das Lernen?"
    a3: "Für jede Fähigkeit, jeden Raum und jede halbe Stunde zählt HouseMind, was Menschen tun; nach 14 Tagen zählt etwas noch halb. Bewiesen sind 10 Situationen und 85 % richtig, in mindestens einer Woche: dann fragt HouseMind einmal, ob es das ab jetzt selbst tun darf, und ein Ja reicht. Über Antworten geht es auch: 15 Antworten und 90 % Ja, in mindestens einer Woche. Zwei Korrekturen oder zweimal Nein in einer Woche: ein Schritt zurück."
    q4: "Was prüft die Sicherheitsschranke?"
    a4: "Echt und gültig; erlaubt, auch nach den festen Grenzen im Code; darf es jetzt (Pause, Menschen haben Vorrang, anderes System, Hausregeln); der Schritt; sinnvoll (Schaltgrenzen, Batterien); und erledigt (Home Assistant bestätigt)."
    q5: "Geräte und Entitäten"
    a5: "Für jede Entität siehst du, was HouseMind erkannt hat und welcher Schritt der höchste ist. Ein Administrator kann ‚In Ruhe lassen‘ wählen. Du findest sie im Gehirn, im Tab Geräte. Labels aus Home Assistant nutzt HouseMind nur als Hinweis."
    q6: KI
    a6: "Optional. Fragen gehen durch einen Datenschutzfilter mit neutralen Bezeichnungen. KI darf nur vorschlagen, nie selbst handeln. Administratoren sehen genau, was gesendet wurde. Jede Frage sagt, in welcher Form die Antwort kommen muss; kann der Dienst das, dann kann die KI nicht anders antworten. Was nicht passt, zählt nicht. Bei Experte wählst du im KI-Block pro Aufgabe ein Modell und siehst, was jede Aufgabe kostete. KI kann auch helfen, dein Zuhause zu verstehen: Unter Gehirn › Was ich weiß siehst du, was sie meint, und änderst es, auch nach Stimmt. Erst nach Stimmt schlägt HouseMind damit etwas vor oder macht etwas selbst. Auch ohne KI leitet HouseMind Dinge aus dem Verhalten ab und fragt, wo die Regeln unsicher sind. Bei Informiert stellt {name} dazu höchstens eine Frage am Tag, mit Stimmt und Stimmt nicht. Etwas Wichtiges sagt {name} immer in HouseMinds eigenen Worten, ohne KI. Du kannst auch die KI von Home Assistant wählen, die KI-Aufgabe, die dort schon eingerichtet ist: dann speichert HouseMind keinen Schlüssel. Arbeitet diese KI im Haus, gibt es kein Budget; in der Cloud höchstens 100 Fragen am Tag. Dort steht auch, was jede Entität ist; das bestätigst du pro Gerät in einem Schritt."
    q7: "Wie rechnet der Energieplan?"
    a7: "Pro Viertelstunde für 36 Stunden: der Boiler extra warm, wenn es günstig ist oder die Sonne scheint, das Haus vorgeheizt vor einer teuren Spitze, wenn es sich wirklich lohnt, und ein Gerät zum günstigsten Moment. Die Hausbatterie und das Auto sind nicht dabei."
    q8: "Wie funktioniert die Integration mit Home Assistant?"
    a8: "Tippe als Administrator unter Hauseinstellungen › Wartung und Datenschutz auf ‚Verbinden‘: HouseMind richtet die Integration ein, startet Home Assistant bei Bedarf neu und stellt alles selbst fertig. Dann sind Zustand und ein Pausenschalter in Home Assistant. Alles geht durch dieselbe Sicherheitsschranke."
    q9: "HouseMind in Assist"
    a9: "Wähle HouseMind als Gesprächsagent und schalte ‚Befehle bevorzugt lokal verarbeiten‘ ein. Fragen zum Haus beantwortet HouseMind selbst. Andere Fragen nur, wenn ein Administrator das erlaubt, und dann geht nur die Frage mit."
    q10: "Wie lernt HouseMind den Rhythmus?"
    a10: "Aus dem Hausmodus: wann das Haus schlafen geht, aufwacht, leer wird und wieder bewohnt ist, je Art von Tag. Eine Zeit zählt erst nach mindestens drei Tagen, die nah beieinanderliegen. Im Gehirn siehst du es im Tab Rhythmus. Dort steht auch pro Raum, was HouseMind gelernt hat. Mit KI macht diese einmal am Tag eine kurze Geschichte daraus; die Zeiten und Zahlen kommen von HouseMind selbst."
    q11: "Wissensupdates"
    a11: "HouseMind kann jeden Tag neues Wissen abholen: Gerätearten, Länder und Sprachen. Nur ein Paket mit richtiger Signatur wird genutzt; das vorige bleibt erhalten. Du kannst das in den Hauseinstellungen ausschalten."
    q13: "Das Diagnosepaket"
    a13: "Ein Knopf in den Hauseinstellungen erstellt eine Datei zum Teilen, wenn etwas nicht stimmt: Versionen, Anzahlen und die letzten Warnungen, jeder Name durch eine neutrale Bezeichnung ersetzt."
    q14: "Selbsttest und getestete Versionen"
    a14: "Nach jedem Start von Home Assistant prüft HouseMind, ob das, was es nutzt, noch da ist. Ist Home Assistant neuer als getestet, fragt es einen Tag lang zuerst bei heiklen Geräten. Ist die Installation nicht unterstützt oder nicht gesund, bekommen Administratoren eine ruhige Meldung."
    q15: "Wo sehe ich, wie weit HouseMind ist?"
    a15: "Im Gehirn, unter ‚Bereit für Selbstständigkeit?‘, zeigt Experte auch die Zahlen: Wert, Gewissheit, richtig, anders und zurückgestellt. Unter dem Satz, was HouseMind tut, steht genau warum: die Sensoren, Schwellen, Quelle und wie sicher es ist. Die Grenze steht in den Hauseinstellungen."
    q16: "Wie finde ich schnell eine Automatisierung oder ein Gerät?"
    a16: "Über langen Listen stehen ein Suchfeld und ‚Filter‘: Kreuze an, was du sehen willst; ‚Alle löschen‘ entfernt deine Auswahl. Mit ‚Gruppieren‘ ordnest du die Liste nach Raum, Art oder Schritt. In den Hauseinstellungen stehen auch die ‚Szenen und Skripte‘ aus Home Assistant, zum Ansehen."
    q17: "Wie mache ich ein eigenes Farbschema?"
    a17: "Leg eine Datei in /config/housemind/themes/ ab. Kopiere die ‚Beispieldatei‘ aus Hauseinstellungen › Wartung und Datenschutz › Farbschemata und gib ihr eine eigene id, einen Namen und Farben. Innerhalb einer Minute steht sie in der Liste, wenn sie gut lesbar ist; sonst steht dort, warum."
    q18: "Lernt HouseMind auch aus dem, was schon passiert ist?"
    a18: "Ja. Nach deinem Ja zum Lernen liest HouseMind einmal, was Home Assistant aufbewahrt hat, meist 10 Tage. Das bleibt im Haus und bringt etwas höchstens bis Vorschlagen. In den Hauseinstellungen stehen ‚Auch aus der Historie in Home Assistant lernen‘ und ‚Neu einlesen‘."
    q19: "Wie zählt HouseMind ‚dunkel‘ und die Vorhänge?"
    a19: "HouseMind notiert bei jedem Hereinkommen ohne Licht den Sonnenstand, die Lux und ob innerhalb von 3 Minuten eine Lampe anging. Nach 6 Mal entscheidet das beste Maß; bis dahin Lux unter 40 oder Sonne unter 3°. Vorhänge: der Sonnenstand, bei dem sie dort meist zugehen."
    q20: "Schwellen, ein früherer Tag und was HouseMind jetzt tun würde"
    a20: "Im Gehirn › Bereit für Autonomie? stehen in der Karte eines Bereichs die Schwellen: Dort wählst du, wann ein Schritt weiter darf; ‚Standard‘ setzt sie zurück. ‚Einen früheren Tag zurückholen‘, bei Hauseinstellungen › Neu beginnen, setzt das Gelernte auf einen der letzten 7 Tage zurück. Was HouseMind jetzt pro Raum tun würde, siehst du in ‚Haus testen‘, ohne zu schalten; was es demnächst tut, im Gehirn › Rhythmus unter ‚Demnächst‘."
    q21: "Einstellungen speichern und einlesen"
    a21: "In Hauseinstellungen › Wartung und Datenschutz speicherst du die Einstellungen als eine lesbare Datei, ohne Gespräche, Logbuch, Menschen oder Schlüssel. Beim Einlesen siehst du zuerst, was sich ändert; erst nach Ja geschieht es. Eine Datei lockert nie die Sicherheit."
    q22: "Die Verbindung mit Home Assistant funktioniert nicht"
    a22: "Tippe in Hauseinstellungen › Wartung und Datenschutz bei ‚HouseMind in Home Assistant‘ auf ‚Verbinden‘. HouseMind stellt die Verbindung selbst fertig und startet Home Assistant bei Bedarf neu. Klappt das nicht, siehst du drei Schritte und ‚In Home Assistant öffnen‘."
    q23: "Wie entferne ich HouseMind?"
    a23: "Geh zu Hauseinstellungen › Neu beginnen › HouseMind entfernen und tippe auf ‚Alles zurückgeben‘. Automatisierungen, die HouseMind ausgeschaltet hat, gehen wieder an, und die Verbindung in Home Assistant verschwindet. Entferne danach die App in Home Assistant. Notfallreaktionen funktionieren bis dahin."
    q24: "Was macht der Check-up?"
    a24: "Im Menü unter Check-up schaut HouseMind jede Stunde, was kaputt ist, auch Backups und Speicher; ‚Jetzt prüfen‘ schaut sofort. Es löscht nie etwas; ausschalten nur nach deinem Ja, mit ‚Wieder einschalten‘. ‚Absichtlich aus‘, ‚So lassen‘, ‚Kein Doppel‘ und ‚Bewusst behalten‘ beenden eine Frage. Wichtiges kommt sofort, mit ‚Ansehen‘."
    q25: "Kann ich ausschalten, dass {name} ihr Fenster von selbst öffnet?"
    a25: "Ja, für das ganze Haus. Ein Administrator schaltet es in Hauseinstellungen, in der Gruppe {name}, aus. Dann springt ihre Frage bei niemandem mehr auf und wartet im Logbuch. Tippe auf {name} oder auf ‚Frag {name}‘, dann stellt sie sie trotzdem. Eine eigene Wahl pro Person gibt es nicht mehr."
    q26: "Was sehe ich unter Netzwerk?"
    a26: "Auf Experte beginnt Zuhause › Räume mit ‘Netzwerk’. {name} steht in der Mitte, mit ihrem Wort darunter; um sie herum die Räume, mit ihren Geräten als kleine Punkte. Tut HouseMind etwas, fließt zwanzig Sekunden lang eine Linie vom Raum über {name} zum Gerät: ‘fließt gerade’. Darunter bleibt stehen, was es zuletzt tat, mit der Uhrzeit und ‘Warum?’. Fragt HouseMind etwas, bleibt eine gepunktete Linie, solange die Frage offen ist: ‘wartet auf dich’. Darunter stehen die Frage und ‘Mach es’ und ‘Jetzt nicht’. Ist die KI an, siehst du einen gepunkteten Ring um {name}: Die KI denkt mit, entscheidet aber nie. Zeig auf einen Punkt, und du siehst, welches Gerät es ist; eine Gruppe wie unter Geräte ist ein Punkt für alle ihre Geräte."
    q27: "Wie teste ich HouseMind in meinem eigenen Haus?"  # Test het huis (E-474)
    a27: "Tippe als Administrator auf Experte oben rechts auf den Kolben, ‘Haus testen’; auf einem Telefon ist es der Tab ‘Testen’. Wähle einen Raum und bei ‘Nachspielen’, was passiert, etwa dass jemand im Dunkeln hereinkommt, oder den Abend. HouseMind zeigt dann, was es tun würde, und pro Zeile, wie das echt ginge: selbst tun, erst fragen, nur zusehen, oder nicht und warum. Es wird noch nichts geschaltet. Mit ‘Echt ausführen’ tut HouseMind es wirklich in deinem Haus: die Lampe geht an, der Vorhang zu, und im Netzwerk fließt die Linie. Nach einer Minute setzt es alles zurück, außer du wählst ‘So lassen’; mit ‘Zurücksetzen’ geht es sofort. Sagt eine Hausregel nein, steuert eine Automatisierung das Gerät oder kann es nicht zurück, dann tut der Test es nicht, und der Grund steht dabei. Abend bringt das Licht dieses Abends mit: im November ist es dunkel. Mit ‘Selbst herumgehen’ steht ein Bereich eine Weile auf Selbstständig mit den echten Sensoren, und du gehst selbst durch den Raum. Unter ‘Was gerade passiert ist’ siehst du, was HouseMind entschieden hat, welche Prüfung nein sagte und wie schnell es ging. Was du testest, zählt nicht fürs Lernen. Steht da, dass jemand das Gerät von Hand bedient hat, dann hat es gerade jemand selbst bedient; kurz aus dem Netzwerk zu fallen zählt nicht."
    q28: "Wie stelle ich die Stufen einer Lampe ein?"  # Standen voor lampen (E-490)
    a28: "Jede Lampe dimmt anders: 40 % ist bei der einen Lampe noch hell und bei der anderen schon Dämmerung. Darum hat jede Lampe vier Stufen: Gedimmt, Normal, Hell und Maximal. Öffne als Administrator auf Experte im Gehirn den Reiter Geräte und Entitäten und tippe bei einer Lampe auf ‘Stufen’. Schiebe jede Stufe auf den Prozentwert, der sich bei dieser Lampe richtig anfühlt, und wähle die Farbe: Sie folgt dem Tagesrhythmus, oder du legst sie fest, von warm bis weiß. Mit ‘Ausprobieren’ geht die Lampe selbst auf diese Stufe; ‘Alle vier zeigen’ geht sie nacheinander durch. Solange das Fenster offen ist, lässt HouseMind die Lampe in Ruhe. Mit ‘Fertig’ oder wenn du das Fenster schließt, ist sie wieder, wie sie war. Tippe auf ‘Speichern’: Das gilt nur für diese Lampe. Mit ‘Eine Stufe ausprobieren’ bei einem Raum siehst du, ob alle Lampen dort zusammenpassen. HouseMind spricht danach in Stufen: ‘Darf ich das Esszimmer auf Gedimmt stellen?’"

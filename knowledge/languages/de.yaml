privacy:
  speech_cloud: "Im Moment geht deine Stimme in die Cloud, über {engines}. Wähle in Hauseinstellungen › {name} eine Stimme und Spracherkennung, die im Haus arbeiten, wenn du das nicht willst."
  speech_local: "Im Moment bleibt deine Stimme im Haus: {name} hört und spricht mit Diensten, die in deinem eigenen Home Assistant laufen."
  title: "Datenschutzerklärung"
  intro: "HouseMind läuft ganz in deinem eigenen Home Assistant. Was es lernt und speichert, bleibt in deinem Haus. Nach außen geht nur etwas, wenn ein Administrator Ja dazu sagt oder wenn du eine Meldung auf deinem Telefon möchtest."
  stored_title: "Was HouseMind speichert, und wie lange"
  stored: "- Was im Haus passiert: Licht, Vorhänge, Heizung, wer zu Hause ist, und was HouseMind getan hat und warum. Das bleibt 30 Tage. Danach bleiben nur Zusammenfassungen, etwa gelernte Gewohnheiten und Tagessummen.\n- Deine Gespräche mit HouseMind, getippt oder über den Sprachassistenten, als Text. Nie Aufnahmen. Ebenfalls 30 Tage.\n- Was HouseMind gelernt hat, deine Hausregeln, Momente, Einstellungen und Vorlieben: bis du sie löschst.\n- Meldungen und Vorschläge: Eine Infomeldung verschwindet nach einer Woche aus der Liste, erledigte Meldungen werden nach 30 Tagen gelöscht und Vorschläge nach 90 Tagen. Wochenberichte und Energiesummen bleiben 2 Jahre.\n- Ein Schlüssel für einen KI-Dienst wird verschlüsselt im eigenen Speicher der App gespeichert. Was ihn öffnet, liegt dort auch: Wer diesen Speicher oder ein Backup hat, kann ihn lesen. Er erscheint nie in einem Protokoll oder im Diagnosepaket.\nAlles liegt im eigenen Speicher der App in Home Assistant und ist Teil der Sicherungen von Home Assistant."
  out_title: "Was nach außen geht, und warum"
  out: "- Standardmäßig nur die Wissensupdates unten; dabei geht nichts über dein Haus mit. Sonst funktioniert HouseMind ohne Internet.\n- KI, nur wenn ein Administrator sie einschaltet und zustimmt: eine kurze Frage mit neutralen Namen, etwa 'Lampe 3' oder 'Schlafzimmer 2'. Um dein Zuhause zu verstehen auch Art, Marke und Typ eines Geräts, wie die Integration eine Entität selbst nennt (etwa 'Child Lock'; nie ein Name, den ihr vergeben habt), und den Namen eines Raums ohne Namen von Menschen. Bei einer Frage an {name} darf die KI auch nachschauen, wie es in einem Raum ist, was HouseMind tat und warum, und eine Zusammenfassung von höchstens 7 Tagen, ebenfalls mit neutralen Namen. Nie Namen von Menschen, deine Adresse, dein Standort, Kalenderinhalte oder Ton. Nur die KI von Home Assistant im Haus darf ein Kamerabild beschreiben, wenn ein Administrator es einschaltet; das Bild bleibt im Haus. Der gewählte KI-Dienst verarbeitet die Frage nach seinen eigenen Bedingungen. Auf der Stufe Experte siehst du jede gesendete Frage.\n- Weiterleiten im Sprachassistenten, nur mit Zustimmung: Eine Frage, die HouseMind nicht selbst beantworten kann, geht an die KI oder den Assistenten, den der Administrator gewählt hat.\n- Wissensupdates: HouseMind holt neues Wissen über Gerätearten, Länder und Sprachen. Über dein Haus geht nichts mit. Ein Administrator kann das ausschalten.\n- Meldungen auf deinem Telefon laufen über die Benachrichtigungen von Home Assistant. Der Text geht dabei über den Benachrichtigungsdienst deines Telefons.\n- Sprache: Was du zu {name} sagst und was sie sagt, läuft über den Sprachassistenten von Home Assistant. Nutzt er einen Cloud-Dienst, geht deine Stimme an diesen Dienst; HouseMind sagt dir, wenn das so ist. Mit Piper, Whisper oder einem anderen lokalen Sprachdienst bleibt alles im Haus.\n- Der Kalender: HouseMind liest den Kalender von Home Assistant nur nach einem Ja eines Administrators, für die Müllerinnerung, das Morgenbriefing und Tage, die anders sind. Was darin steht, bleibt im Haus.\n- Das Diagnosepaket geht nur raus, wenn du es selbst teilst. Namen und Geräte darin sind durch neutrale Bezeichnungen ersetzt."
  see_title: "Wer was sieht"
  see: "- Jede Bewohnerin und jeder Bewohner wählt eine eigene Stufe. Je höher die Stufe, desto mehr Einzelheiten, etwa die Entscheidungsspur auf der Stufe Experte.\n- Hauseinstellungen, KI und das Diagnosepaket sind nur für Administratoren von Home Assistant.\n- HouseMind schaut und hört nicht über Kameras oder Mikrofone mit. Nur wenn ein Administrator es einschaltet und die KI von Home Assistant im Haus arbeitet, beschreibt diese KI bei einer Meldung, was auf dem Bild zu sehen ist; das Bild bleibt im Haus.\n- Gäste, Babysitter und andere Menschen im Haus: sag es ihnen. HouseMind sieht Bewegung und Anwesenheit pro Raum, keine Namen; der Gästemodus berücksichtigt sie. Richte Kameras nicht auf die Straße oder die Nachbarn: HouseMind speichert nie Bilder, aber die Kamera zeichnet sie auf."
  rights_title: "Was du selbst tun kannst"
  rights: "- Sehen, was HouseMind getan hat und warum: Tippe bei einer Aktion auf Warum?.\n- Etwas zurückstellen: Tippe auf Rückgängig, oder stell es einfach selbst zurück.\n- Das Lernen ausschalten, in den Hauseinstellungen. Dann reagiert HouseMind nur noch auf Notfälle und schickt Meldungen.\n- Alles zurückgeben, in den Hauseinstellungen: HouseMind schaltet die Automatisierungen, die es übernommen hat, wieder ein und geht zurück zum reinen Beobachten.\n- Alles löschen: Hauseinstellungen → Neu beginnen → Zurück auf Werkseinstellungen. Oder entferne die App in Home Assistant. Dann ist alles weg, was HouseMind gespeichert hat."
  contact: "Fragen zum Datenschutz? Stell sie auf der Projektseite von HouseMind."


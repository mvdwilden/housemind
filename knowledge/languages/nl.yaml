privacy:
  speech_cloud: "Op dit moment gaat je stem naar de cloud, via {engines}. Kies in Huisinstellingen › {name} een stem en spraakherkenning die in huis werken als je dat niet wilt."
  speech_local: "Op dit moment blijft je stem in huis: {name} hoort en spreekt met diensten die in je eigen Home Assistant werken."
  title: "Privacyverklaring"
  intro: "HouseMind draait helemaal in je eigen Home Assistant. Wat het leert en bewaart, blijft in je huis. Er gaat alleen iets naar buiten als een beheerder daar ja op zegt, of als je een melding op je telefoon wilt."
  stored_title: "Wat HouseMind bewaart, en hoe lang"
  stored: "- Wat er in huis gebeurt: lampen, gordijnen, verwarming, wie er thuis is, en wat HouseMind deed en waarom. Dat blijft 30 dagen. Daarna blijven alleen samenvattingen over, zoals geleerde gewoontes en dagtotalen.\n- Je gesprekken met HouseMind, getypt of via de spraakassistent, als tekst. Nooit opnames. Ook 30 dagen.\n- Wat HouseMind leerde, je huisregels, momenten, instellingen en voorkeuren: tot je ze verwijdert.\n- Meldingen en voorstellen: een informatiemelding gaat na een week uit de lijst, afgehandelde meldingen worden na 30 dagen gewist en voorstellen na 90 dagen. Weekverslagen en energietotalen blijven 2 jaar.\n- Een sleutel voor een AI-dienst wordt versleuteld bewaard in de eigen opslag van de App. Wat hem opent, staat daar ook: wie die opslag of een back-up heeft, kan hem lezen. Hij komt nooit in een logboek of in het diagnosepakket.\nAlles staat in de eigen opslag van de App in Home Assistant en gaat mee in de back-ups van Home Assistant."
  out_title: "Wat er naar buiten gaat, en waarom"
  out: "- Standaard alleen de kennisupdates hieronder; daarbij gaat niets over je huis mee. Verder werkt HouseMind zonder internet.\n- AI, alleen als een beheerder dat aanzet en toestemming geeft: een korte vraag met neutrale namen, zoals 'lamp 3' of 'slaapkamer 2'. Om je huis te begrijpen ook de soort, het merk en het type van een apparaat, hoe de integratie een entiteit zelf noemt (zoals 'Child Lock'; nooit een naam die jullie gaven), en de naam van een ruimte zonder namen van mensen. Bij een vraag aan {name} mag de AI ook opzoeken hoe het in een ruimte is, wat HouseMind deed en waarom, en een samenvatting van hooguit 7 dagen, ook met neutrale namen. Nooit namen van mensen, je adres, je locatie, agenda-inhoud of geluid. Alleen de AI van Home Assistant in huis mag een camerabeeld beschrijven, als een beheerder dat aanzet; het beeld blijft in huis. De gekozen AI-dienst verwerkt de vraag volgens zijn eigen voorwaarden. Op niveau Expert zie je elke verstuurde vraag.\n- Doorsturen in de spraakassistent, alleen met toestemming: een vraag die HouseMind niet zelf kan beantwoorden, gaat naar de AI of assistent die de beheerder koos.\n- Kennisupdates: HouseMind haalt nieuwe kennis op over apparaatsoorten, landen en talen. Er gaat niets over je huis mee. Een beheerder kan dit uitzetten.\n- Meldingen op je telefoon gaan via de meldingen van Home Assistant. De tekst gaat daarbij via de meldingsdienst van je telefoon.\n- Spraak: wat je tegen {name} zegt en wat zij zegt, gaat via de spraakassistent van Home Assistant. Werkt die met een clouddienst, dan gaat je stem naar die dienst; HouseMind zegt het als dat zo is. Met Piper, Whisper of een andere lokale spraakdienst blijft alles in huis.\n- De agenda: HouseMind leest de agenda van Home Assistant alleen na een ja van een beheerder, voor de afvalherinnering, de ochtendbriefing en dagen die anders zijn. Wat erin staat, blijft in huis.\n- Het diagnosepakket gaat alleen weg als je het zelf deelt. Namen en apparaten zijn daarin vervangen door neutrale labels."
  see_title: "Wie wat ziet"
  see: "- Elke bewoner kiest een eigen niveau. Hoe hoger het niveau, hoe meer details, zoals het beslisspoor op niveau Expert.\n- Huisinstellingen, AI en het diagnosepakket zijn alleen voor beheerders van Home Assistant.\n- HouseMind kijkt en luistert niet mee met camera's of microfoons. Alleen als een beheerder het aanzet en de AI van Home Assistant in huis werkt, beschrijft die AI bij een melding wat er op het beeld te zien is; het beeld blijft in huis.\n- Gasten, oppas en andere mensen in huis: vertel het ze. HouseMind ziet beweging en aanwezigheid per ruimte, geen namen; met de gastenstand houdt het daar rekening mee. Richt camera's niet op de straat of op de buren: HouseMind bewaart nooit beelden, maar de camera neemt ze wel op."
  rights_title: "Wat je zelf kunt"
  rights: "- Zien wat HouseMind deed en waarom: tik op Waarom? bij een actie.\n- Iets terugzetten: tik op Ongedaan maken, of zet het gewoon zelf terug.\n- Leren uitzetten in Huisinstellingen. Dan reageert HouseMind alleen nog op noodgevallen en stuurt het meldingen.\n- Alles teruggeven in Huisinstellingen: HouseMind zet de automatiseringen die het overnam weer aan, en gaat terug naar alleen kijken.\n- Alles wissen: Huisinstellingen → Opnieuw beginnen → Terug naar fabrieksinstellingen. Of verwijder de App in Home Assistant. Dan verdwijnt alles wat HouseMind bewaarde."
  contact: "Vragen over privacy? Stel ze via de projectpagina van HouseMind."

safe:
  older: "De gegevens komen van een versie van HouseMind van vóór 0.2.0. Die kan deze versie niet meer omzetten; ze blijven onaangeroerd. Alleen de noodreacties werken; verder schakelt, leert en bewaart HouseMind niets."
  title: "HouseMind staat in de veilige stand"
  failed: "Na de update konden de gegevens niet worden omgezet. De oude gegevens staan terug en blijven onaangeroerd. Alleen de noodreacties werken; verder schakelt, leert en bewaart HouseMind niets."

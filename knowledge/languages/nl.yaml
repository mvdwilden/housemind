  story:
    home_dark:
      title: "’s Avonds thuiskomen"
      what: "Het is donker en er is niemand thuis. Dan komt een bewoner door de voordeur binnen."
      expect: "HouseMind ziet dat er weer iemand thuis is en wil het licht aandoen waar iemand binnenkomt: de eerste keer kijkt het mee, daarna vraagt het, en op Autonoom doet het het zelf."
    leave:
      title: "Iedereen gaat weg"
      what: "Iemand zit in een ruimte met de lamp aan. Dan gaat iedereen de deur uit."
      expect: "Na tien minuten weet HouseMind dat er niemand thuis is. Een lamp die nog brandt, gaat uit. De verwarming blijft de eerste 24 uur zoals hij is."
    away_long:
      title: "Lang weg"
      what: "Iedereen gaat weg en blijft ruim een dag weg. De bewoners komen pas terug als je ‘Iedereen thuis’ kiest."
      expect: "Na een dag vraagt HouseMind of jullie op vakantie zijn. De verwarming gaat 3 graden lager, niet onder 15 °C."
    wake:
      title: "Wakker worden"
      what: "Het is vroeg in de ochtend. De bewoners staan op: licht in de slaapkamer, douchen, naar beneden."
      expect: "Licht waar iemand binnenkomt zolang het donker is. Na een tijdje weet HouseMind wanneer jullie opstaan; dan maakt het de slaapkamer licht en warm."
    shower:
      title: "Douchen"
      what: "Iemand gaat douchen. De badkamer wordt vochtig en daarna weer droog."
      expect: "De ventilator gaat aan als het vochtig wordt, en weer uit als het droog is."
    window:
      title: "Raam open"
      what: "In een ruimte met verwarming staat een raam tien minuten open. Daarna gaat het weer dicht."
      expect: "Zolang het raam open is, gaat de verwarming in die ruimte lager. Daarna weer terug."
    guests:
      title: "Gasten"
      what: "Er is geen bewoner thuis, maar er komt wel iemand binnen, zoals een oppas of gasten."
      expect: "Na een paar minuten denkt HouseMind dat er gasten zijn en vraagt het of dat klopt. Van een dag met gasten leert het niet."
    smoke:
      title: "Rook"
      what: "Een rookmelder slaat alarm."
      expect: "Meteen een noodmelding, alle lampen vol aan om de weg te zien, en de ventilatie uit. Sloten gaan nooit vanzelf open. Kies daarna ‘Alles weer veilig’."
    leak:
      title: "Waterlek"
      what: "Een lekmelder wordt nat."
      expect: "Meteen een melding. Heeft het huis een hoofdkraan, dan gaat die dicht. Kies daarna ‘Alles weer veilig’."
    frost:
      title: "Vorst"
      what: "Een vorstmelder meet kans op vorst."
      expect: "Een melding, en de verwarming in die ruimte gaat naar minstens 8 °C als die er is. Verder gaat het huis gewoon door."
    burglar:
      title: "Inbraakalarm"
      what: "Iedereen is weg en het alarm staat aan. Dan gaat het alarm af."
      expect: "Een noodmelding en alle lampen aan. Alleen gordijnen die een beheerder daarvoor koos, gaan open; standaard niets."
    price_negative:
      title: "Negatieve stroomprijs"
      what: "De komende twee uur kost stroom minder dan niets."
      expect: "HouseMind maakt een nieuw energieplan en schuift opwarmen en apparaten naar deze uren. Je ziet het bij Energie. De eerste twee weken meet HouseMind alleen en laat het zien wat het zou doen."
    sun_full:
      title: "Volle zon op de panelen"
      what: "Rond het middaguur schijnt de zon volop op de zonnepanelen."
      expect: "Er komt meer stroom dan het huis gebruikt. Bij Energie zie je het overschot. Heeft het huis een batterij, auto of boiler, dan gebruikt HouseMind het daarvoor; de eerste twee weken laat het alleen zien wat het zou doen."
    update:
      title: "Na een update"
      what: "Home Assistant krijgt een update. Daarna start één koppeling niet meer, en een lamp is even weg."
      expect: "Bij Check-up (op Expert in het menu), onder ‘Na de laatste update’, zie je na 30 minuten wat sindsdien niet meer werkt. Wat even weg was en weer werkt, staat er na 2 uur bij."

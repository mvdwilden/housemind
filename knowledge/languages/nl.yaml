help:
  l1:
    q1: Wat doet HouseMind?
    a1: HouseMind zorgt voor het licht, de gordijnen en de verwarming. Je merkt er weinig van. Bij nood, zoals rook of een lekkage, grijpt het meteen in.
    q2: Wat betekent de bol?
    a2: "De bol is {name}, de stem van je huis. Haar kleur, vorm en woord laten zien hoe het gaat; rood met twee ringen is nood. Tik op haar woord voor wat elke kleur betekent, of op de regel eronder voor de melding."
    q3: Hoe vraag ik iets?
    a3: "Tik op {name} of op ‘Vraag {name}’. Ze vraagt wat ze voor je kan doen, en luistert. Voor je volgende vraag tik je weer op haar. Wacht er iets op jou, dan zegt ze dat eerst. Kan je apparaat niet luisteren, dan vertelt ze kort wat er speelt."
    q4: Hoe zet ik HouseMind even op pauze?
    a4: "Tik op ‘Pauze’, of houd {name} vast. Kies ‘1 uur’, ‘Tot morgen’ of ‘Tot ik hem weer aanzet’; bij elke knop staat tot wanneer. Noodreacties blijven werken."
    q5: Er gebeurde iets wat ik niet wilde.
    a5: Zet het gewoon zelf terug. HouseMind merkt dat, blijft er even af en leert ervan.
    q6: Ik wil meer zien.
    a6: "Tik rechtsboven op het poppetje, Mijn voorkeuren, en kies bij Over mij een ander niveau."
    q7: "Kan HouseMind me wekken?"
    a7: "Ja, als er een wekker op je telefoon staat: dan gaat het licht in de slaapkamer vooraf langzaam aan en wordt het alvast warm. Op de andere niveaus kan HouseMind je ook wekken op de tijd dat je meestal opstaat."
    q8: "Kan ik met HouseMind praten?"
    a8: "Ja, via de spraakassistent van Home Assistant, als een beheerder de koppeling heeft aangezet. Vraag bijvoorbeeld: hoe gaat het?"
    q9: "Wat doet HouseMind met water?"
    a9: "Loopt er lang water terwijl niemand het gebruikt, dan meldt HouseMind dat. Is er een hoofdkraan, dan kan die dicht – nooit open."
    q10: "Vervangt HouseMind mijn rookmelder of alarm?"
    a10: "Nee. HouseMind helpt bij veiligheid, maar vervangt geen gecertificeerde rookmelder, CO-melder of alarmsysteem. Houd die gewoon in huis en test ze geregeld."
    q11: "Wie is {name}?"
    a11: "{name} is de stem van je huis. Tik op haar: ze vraagt wat ze voor je kan doen. Wat ze zegt, staat er ook als tekst. Bij Mijn voorkeuren kies je of ze je of u zegt, en of ze hardop praat."
    q12: "Kan ik de rondleiding nog eens doen?"
    a12: "Ja. Tik rechtsboven op het kompas, ‘Rondleiding’: {name} laat je opnieuw zien waar alles staat. Kies je een hoger niveau, dan laat ze vanzelf zien wat er nieuw is. Met ‘Overslaan’ stop je meteen."
    q13: "Hoe ver is HouseMind?"
    a13: "Vraag het {name}: ‘Hoe ver ben je?’ of ‘Hoe ver ben je met de verlichting?’. Ze zegt per onderdeel hoe ver HouseMind is en wat er nog nodig is, en laat het je zien als je wilt."
    q14: "Kan ik andere kleuren kiezen?"
    a14: "Ja. Tik rechtsboven op het poppetje (Mijn voorkeuren), kies Dit apparaat en dan een Kleurenschema, zoals Licht, Hoog contrast of Nacht. Dat geldt alleen voor dit apparaat; de kleuren van {name} blijven hetzelfde."
    q15: "Krijg ik een bericht als er iets mis is?"
    a15: "Bij nood, zoals rook of een lekkage, krijg je een bericht op je telefoon, ook ’s nachts, tenzij je nee zei. Zei je bij Mijn voorkeuren ja op berichten bij gevaar, dan ook bij iets onveiligs, zoals een open deur terwijl niemand thuis is."
    q16: "Wat bewaart HouseMind over mij?"
    a16: "Kijk in Mijn voorkeuren › Over mij › Mijn gegevens: je niveau, je toestemmingen, je huisregels en hoe lang HouseMind wat bewaart. ‘Bewaar als bestand’ geeft je eigen gegevens. ‘Vergeet mij’ wist wat HouseMind over jou bewaart."
    q17: "Ik heb meer tijd nodig om te praten of te lezen"
    a17: "Kies bij Mijn voorkeuren › Over mij › Tijd voor Langer of Lang. Dan luistert {name} langer en blijven korte meldingen langer staan; op Lang tot je ze wegtikt. Terwijl ze luistert, geeft ‘Nog even’ je meer tijd."
    q18: "Wat is ‘Speel het huis’?"
    a18: "Een paneel in een demohuis, op een breed scherm. ‘Spelen’ laat de tijd lopen, ‘Stop’ zet hem stil; bij ‘Zelf spelen’ zet je alles klaar, ook terwijl de tijd loopt. ‘Verhalen’ speelt huisleven na, ‘De tijd’ spoelt vooruit. ‘Wat er net gebeurde’ en Logboek tonen wat HouseMind deed; het echte huis merkt niets."
    q19: "Wat betekent ‘Geen verbinding – opnieuw proberen…’?"
    a19: "Dit scherm is even los van HouseMind, bijvoorbeeld tijdens een update of als het netwerk weg was. HouseMind zelf werkt gewoon door. Het scherm verbindt vanzelf opnieuw: meteen als je terugkomt of het netwerk terug is, anders binnen tien seconden. Staat het er na een minuut nog, vernieuw dan de pagina."
  l2:
    q1: Wat zie ik?
    a1: "Bovenaan zie je hoe het gaat. Daaronder hooguit drie kaarten die op jou wachten, één zin over wat HouseMind bedacht, en een kaart per ruimte. Al het andere staat in Logboek."
    q2: Wat is het bericht na een actie?
    a2: "Het zegt wat HouseMind net zelf probeerde, terwijl die regel nog op Voorstellen staat. Tik op ‘Waarom?’ voor de reden, of op ‘Ongedaan maken’ om het terug te zetten. Op Autonoom doet HouseMind het gewoon, zonder bericht; je ziet het in Logboek."
    q3: Hoeveel meldingen krijg ik?
    a3: "Hooguit drie per dag; nood en veiligheid komen altijd, ook ’s nachts. In je stille uren wacht de rest tot de ochtend. Wat ter informatie is, komt één keer per dag in een overzicht. Bij Mijn voorkeuren kies je minder of meer."
    q4: "Wat kan ik {name} vragen?"
    a4: "Tik op ‘Vraag {name}’ en praat of typ, bijvoorbeeld ‘hoe gaat het’, ‘waarom’, ‘pauze’ of ‘maak ongedaan’. Met een AI kun je meer vragen, zoals ‘waarom was het gisteren koud in de badkamer?’: dan zoekt ze het op, met neutrale namen. Ook doorpraten kan, zoals ‘en in de keuken ook’; iets doen vraagt ze eerst. ‘Zet dat terug’ zet terug wat ze net deed. Haar antwoord verschijnt terwijl het komt. Je gesprekken staan daarna in Logboek. Weet ze iets niet, dan zegt ze dat."
    q5: Waarom gebeurde iets niet?
    a5: "Open de ruimte en tik op het apparaat. Daaronder staat wat HouseMind ermee doet, en waarom."
    q6: Zijn mijn gegevens veilig?
    a6: "Alles blijft in je huis. Er gaat alleen iets naar buiten als een beheerder daar ja op zegt, of voor een melding op je telefoon. Bij Over HouseMind staat de hele privacyverklaring."
    q7: "Wat doet HouseMind met energie?"
    a7: "Na twee weken meten maakt HouseMind warm water en start het apparaten als stroom goedkoop is of de zon schijnt. De thuisbatterij en de auto stuurt het niet. Op Energie toont ‘De komende 24 uur’ prijs, zon en wat HouseMind doet."
    q8: "Wat is de ochtendbriefing?"
    a8: "Als je ’s ochtends opstaat, vertelt HouseMind kort het weer, de agenda en iets over stroom, op een speaker of bovenaan in Logboek. De agenda leest het alleen na een ja van een beheerder. Bij Mijn voorkeuren kies je wat erin staat."
    q9: "Wat is de bedtijdcheck?"
    a9: "Als je naar bed gaat, kijkt HouseMind of alles dicht en uit is. Staat er nog een deur open, dan hoor of zie je dat. HouseMind doet zelf nooit een slot of deur dicht of open."
    q10: "Vandaag is anders. Wat nu?"
    a10: "Tik in Logboek op ‘Vandaag anders?’, of typ bijvoorbeeld: vandaag werk ik thuis. HouseMind past zich die dag aan, zonder je gewone patroon te veranderen."
    q11: "Wat is het huisverslag?"
    a11: "Elke zondagavond een kort verslag: wat HouseMind deed, wat je terugzette en wat het bespaarde. Je vindt het in Logboek. Bij Mijn voorkeuren kies je een andere dag."
    q12: "Waarom krijg ik een seintje over een batterij?"
    a12: "HouseMind let op onderhoud: een bijna lege batterij, een rookmelder of andere noodmelder die een dag niet reageert, een filter, en de avond voor het ophalen van het afval. Het meldt alleen; het doet niets."
    q13: "De oven staat aan en ik ben weg?"
    a13: "Dan krijg je een melding. Kan de oven of kookplaat uit, dan vraagt HouseMind ‘Zal ik hem uitzetten?’ en doet het dat alleen na jouw ja. Aanzetten doet HouseMind nooit. Brandt een lamp al vier uur in een ruimte waar al een uur niemand is geweest, dan vraagt HouseMind ook ‘Zal ik hem uitzetten?’; met AI staat er een mogelijke reden bij. Bij ‘Nee, laat aan’ vraagt het een maand niet meer naar die lamp."
    q14: "Een sensor buiten hoort een alarm?"
    a14: "Hoort bijvoorbeeld een camera op het terras een rookalarm, dan krijg je een melding, ook ’s nachts. HouseMind zet dan geen lampen aan en spreekt niet: het geluid kan van de buren komen."
    q15: "Wat zijn zones in een ruimte?"
    a15: "Sommige aanwezigheidssensoren kennen zones, zoals ‘Bed’. Draagt een zone de naam van een andere ruimte, dan telt hij daar; anders is hij een deel van de ruimte. Onder Zones in een ruimte zie je per zone of er iemand is."
    q16: "Telt een stofzuigrobot als iemand?"
    a16: "Nee. Terwijl een stofzuigrobot rijdt, en nog 2 minuten daarna, telt beweging niet. Aanwezigheid die dan begint, telt maar weinig, en helemaal niet als er niemand thuis is. Wie er al was, blijft gewoon aanwezig."
    q17: "Wat staat er bij Wat ik bedacht?"
    a17: "Wat HouseMind zag, dacht en deed. Op Ontzorgd staat onder {name} één zin over het laatste uur. ‘Meer in Logboek’ toont de rest, met ‘Waarom?’ en ‘Ongedaan maken’. Op Geïnformeerd één zin per ding, op Betrokken ook wat het liet, op Expert ook de details. Vanaf Geïnformeerd staat het nieuwste als twee blokjes: wat ik zag en wat ik deed of vraag. Op Betrokken staat in het Logboek zag, dacht en deed onder elkaar, met een lijn: die stroomt als het gedaan is, stippels wachten op jou, en een lijn die stopt is niet gedaan. Op Ontzorgd staat om {name} een dunne ring met een stip voor elke keer dat HouseMind vandaag iets deed, op het uur dat het gebeurde. Op Geïnformeerd en Betrokken laat ‘Vandaag’ per ruimte zien wat het deed, vroeg of liet."
    q18: "Hoe praat ik terug met {name}?"
    a18: "Tik op {name}: haar venster gaat open. Zie je ‘Ik luister’, praat dan; lukt de microfoon niet, dan staat er waarom. Typen kan onderin het venster. Zonder AI geeft ze knoppen zoals ‘Hoe is het in huis?’ en ‘Help’, en verstaat ze vaste vragen. Na haar antwoord luistert ze niet vanzelf verder: tik weer op haar, ook in haar venster."
    q19: "Stelt {name} ook zelf vragen?"
    a19: "Ja. Wacht er iets op jouw antwoord, dan vraagt {name} het in haar venster, met de knoppen erbij; bij een voorstel ook ‘Waarom?’. De vraag blijft staan tot je antwoordt of het venster sluit; de volgende komt daarna. Er staan ook ‘Ik kijk ernaar’ en ‘Later’, en voor een beheerder ‘Niet meer tonen’. Na ‘Later’ wacht de vraag in Logboek. Heeft een beheerder haar venster voor het huis uitgezet, dan wacht de vraag in Logboek; tik op {name} en ze stelt hem alsnog."
    q20: "Hoe zie ik hoe ver HouseMind is?"
    a20: "Op Huis staat ‘Klaar voor autonomie?’: per onderdeel, zoals Verlichting, één zin over hoe ver HouseMind is en wat er nog nodig is. Je kunt het ook {name} vragen: ‘Hoe ver ben je?’. HouseMind verdient elke stap zelf."
    q21: "Waar staan Help en de Huisinstellingen?"
    a21: "Rechtsboven, op elk scherm: het vraagteken is Help, met de handleiding, het kompas is de Rondleiding, het tandwiel is Huisinstellingen (alleen voor beheerders) en het poppetje is Mijn voorkeuren. Korte berichtjes, zoals ‘Bewaard’, staan even naast die knoppen."
    q22: "Leert HouseMind ook van wat er al gebeurde?"
    a22: "Ja. Na je ja op leren leest HouseMind één keer wat Home Assistant bewaarde, meestal 10 dagen. Dat blijft in huis en brengt iets hooguit tot Voorstellen. In Huisinstellingen staan ‘Leer ook van de historie in Home Assistant’ en ‘Opnieuw inlezen’."
    q23: "Wat staat er in Logboek?"
    a23: "Bovenaan staat ‘Wacht op jou’: de meldingen die nog op je wachten, met hun knoppen. Het cijfer bij Logboek in het menu telt precies die, niet wat nieuw is. Daaronder alles wat er gebeurde, 30 dagen terug, met je eigen gesprekken. Met Filter kies je Gedaan, Alleen bekeken, Meldingen of Gesprekken, met Periode bijvoorbeeld Vandaag. Bij wat HouseMind deed staan ‘Waarom?’ en ‘Ongedaan maken’. Beheerders zien bij AI ‘Bekijk wat er verstuurd en ontvangen is’: de opdracht (waarom HouseMind het vraagt en welk antwoord het wil), wat er verstuurd is en het antwoord."
    q24: "Hoe begin ik opnieuw, of zet ik alles terug naar de fabrieksinstellingen?"
    a24: "Als beheerder: Huisinstellingen › Opnieuw beginnen. ‘Kennismaking opnieuw’ loopt de kennismaking nog eens door. ‘Opnieuw leren’ vergeet wat HouseMind leerde; je huisregels blijven. ‘Terug naar fabrieksinstellingen’ wist alles; daarna richt je het opnieuw in met ‘Inrichten’. Noodreacties blijven werken."
    q25: "Hoe zet ik de vakantie- of gastenstand aan?"
    a25: "Tik op {name} en kies ‘Vakantie’ of ‘Gasten’; daarna staat er ‘Weer thuis’. Zeggen kan ook: ‘we gaan op vakantie’. In beide standen leert HouseMind niet. Op vakantie lijkt het huis ’s avonds bewoond."
    q26: "Wat doen de duimpjes?"
    a26: "Vanaf Geïnformeerd staan 👍 en 👎 onder iets wat {name} zelf deed, ook bij ‘Waarom?’; probeerde ze iets zelf terwijl het nog op Voorstellen stond, dan vraagt ze soms of het goed was, met ‘👍 Goed’ en ‘👎 Niet goed’. Op Autonoom vraagt ze niets, ook niet achteraf, en komt er geen bericht. Een duim omlaag telt als correctie. Je antwoord staat in Logboek; vanaf Betrokken telt ‘Klaar voor autonomie?’ de duimen."
    q27: "Kan ik ‘Hey {name}’ zeggen?"
    a27: "Ja, met een spraaksatelliet of Assist op je telefoon. Een wakkerwoord met haar naam laat je zelf maken; Home Assistant legt uit hoe. Bestaat het, dan zet HouseMind het in haar eigen Assist-pijplijn (Huisinstellingen › {name})."
    q28: "Wat doet HouseMind met camera's?"
    a28: "HouseMind kijkt zelf niet naar beelden. Het gebruikt alleen wat je camera's al in Home Assistant melden, zoals een persoon of een pakket. Is iedereen weg, dan krijg je één melding met het beeld. HouseMind bewaart nooit beelden, gezichten of kentekens. Alleen als een beheerder het aanzet en de AI van Home Assistant in huis werkt, beschrijft die AI bij een melding wat er op het beeld te zien is; het beeld blijft in huis."
    q29: "Zet HouseMind het alarm aan of uit?"
    a29: "{name} vraagt het alleen: ‘Zal ik het alarm op afwezig zetten?’ als iedereen weg is, en ‘op nacht’ als het huis gaat slapen. Uitzetten doet HouseMind nooit. Welk alarm het is, kies je bij Huisinstellingen › Huis › Beveiliging."
    q30: "Hoe regelt HouseMind de verwarming?"
    a30: "Rustig. Is er langer dan een dag niemand thuis, dan gaat de verwarming 3 graden lager, niet onder 15 °C. Blijft een ruimte te koud, dan zet HouseMind de thermostaat wat hoger. Wat je zelf instelt, onthoudt het als je wens."
    q31: "Ik krijg te veel meldingen. Wat kan ik doen?"
    a31: "Elke melding heeft ‘Ik kijk ernaar’ en ‘Later’. ‘Later’ legt hem even weg. Een beheerder heeft ook ‘Niet meer tonen’: dat zet die soort uit voor iedereen in huis, behalve nood. In Logboek staan ze nog als ‘niet getoond’. Een beheerder zet ze terug met ‘Weer tonen’, in Logboek of bij Huisinstellingen › Huis."
    q32: "Waarom staat er nog iemand in een ruimte?"
    a32: "Heeft de ruimte een aanwezigheidssensor, dan is ze leeg zodra die sensor niemand meer ziet. Heeft ze alleen een bewegingsmelder, dan blijft ‘Iemand aanwezig’ nog een paar minuten staan: een bewegingsmelder ziet niet of iemand stilzit of weg is. Is een aanwezigheidssensor offline, dan telt hij niet mee."
    q33: "Waarom staan de apparaten in een ruimte onder kopjes?"
    a33: "Elk kopje is een apparaat, met de naam en het type uit Home Assistant. Eronder staat wat erbij hoort. Een eigen lampje van een sensor of spraakassistent heet status-LED: HouseMind telt het niet als licht in de ruimte en zet het zelf nooit aan of uit. De instellingen van een apparaat staan ingeklapt onderaan; die verandert HouseMind nooit. Onder elke naam staat in een woord wat het is, zoals lamp, thermostaat van de ruimte, instelling of nog onbekend."
    q34: "Hoe lang blijft het licht aan als er niemand meer is?"
    a34: "Dat leert HouseMind per ruimte van wat jullie en jullie automatiseringen doen. Tot het dat weet, is het kort in een toilet, badkamer, berging of kelder, en langer in een hal waar je heen en weer loopt. Ziet alleen een bewegingssensor je, dan wacht het minstens 3 minuten. Eerst dimt het licht even. Kom je terug, of doe je het licht meteen weer aan, dan wacht HouseMind daar voortaan langer. Bij ‘Klaar voor autonomie?’ zie je de wachttijd per ruimte. Zonder aanwezigheids- of bewegingssensor kan HouseMind niet zien dat de ruimte leeg is: dan doet het het licht daar niet uit."
    q35: "Gaat het licht buiten aan als we weg zijn?"
    a35: "Ja, zodra HouseMind dat zelf mag doen. Als het donker wordt, gaan de lampen buiten aan, ook als er niemand thuis is: zo lijkt het huis bewoond. Ze gaan uit als het huis gaat slapen. Is er niemand thuis, dan rond je gewone bedtijd, elke avond een paar minuten anders."
    q36: "Gaat het licht buiten aan als ik in het donker thuiskom?"
    a36: "Ja, bij de ingang, zodra HouseMind dat zelf mag doen. Kom je in het donker thuis, dan gaan de lampen op de oprit, bij de voordeur of bij de carport meteen aan, en na 5 minuten weer uit. Is er dan nog iemand buiten, dan blijven ze langer aan. Brandt het licht al, dan blijft het zoals het is. Doe je de lamp vlak daarna weer aan, dan laat HouseMind hem de volgende keer langer branden."
    q37: "Waarom vraagt HouseMind of het iets voortaan zelf mag doen?"
    a37: "Omdat het dat vaak genoeg goed zag gaan. Je ziet de vraag bij ‘Wacht op jou’ in Logboek. Kies ‘Ja, voortaan zelf’, ‘Nog niet’ of ‘Nooit’. Zet je het later in een week twee keer terug, dan vraagt HouseMind het weer eerst."
    q38: "Ik bediende een lamp met de hand. Hoe lang blijft HouseMind ervan af?"
    a38: "Zolang er iemand in de ruimte is, blijft jouw keuze staan, hoogstens een paar uur. Is de ruimte leeg geweest en komt iemand binnen, dan is dat een nieuw moment: dan gaat het licht weer gewoon aan als het donker is. Kom je binnen 2 minuten terug, dan blijft het zoals je het liet. Zet je een lamp uit terwijl er niemand in die ruimte is, bijvoorbeeld met een knop die alles uitzet, dan geldt dat meteen. Zet je hem zo aan, dan blijft hij aan."
    q39: "Waarom verandert de kleur van het licht met de dag?"
    a39: "Licht volgt de dag: overdag feller en witter, ’s avonds zachter en warmer. Heb je Adaptive Lighting, dan leest HouseMind die instellingen en neemt het ze over: op Autonoom doet het dat zelf, lager doet Adaptive Lighting het nog. Zonder die integratie maakt HouseMind zelf zo’n lijn, uit wat het in die ruimte voor de avond en de dag leerde. Kies je zelf iets anders, dan blijft dat zo tot de lamp uitgaat. Doe je dat vaak, dan onthoudt HouseMind het."
  l3:
    q1: Wat zijn voorstellen?
    a1: "Als HouseMind nog niet zeker is, vraagt het eerst. Je kiest ‘Doe het’, ‘Nu niet’, ‘Voortaan zelf’ of ‘Nooit zo’. ‘Voortaan zelf’ doet het nu en voortaan zonder te vragen. ‘Nooit zo’ wordt een huisregel, na jouw bevestiging. Met AI kan HouseMind beheerders ook één keer per week hooguit drie huisregels voorstellen, uit wat het leerde, met waarom. Alleen ‘nooit’ of een maximumtemperatuur, en pas na jouw ja; na nee komt dat voorstel niet terug."
    q2: Wat zijn de stappen?
    a2: "Elke vaardigheid gaat per ruimte van Observeren naar Voorstellen naar Autonoom. Voorstellen komt snel. Naar Autonoom gaat het als het vaak genoeg goed ging, minstens een week lang: dan vraagt HouseMind het één keer, en één ja is genoeg. Hoe ver het per onderdeel mag, kiest een beheerder bij Huisinstellingen › Leren en stappen › Onderdelen."
    q3: Wat zijn huisregels?
    a3: "Regels die altijd gelden, zoals ‘nooit de gordijnen in de slaapkamer open voor 7:00’. Typ ze of kies ze; HouseMind leest een regel eerst voor. Met een AI pas je een regel ook aan in je eigen woorden, zoals ‘maak die regel in het weekend een uur later’; HouseMind leest de nieuwe regel voor en wacht op je ja. Je vindt ze in Brein, bij het tabje Huisregels. Weghalen vraagt eerst ja of nee."
    q4: Wat laat de plattegrond zien?
    a4: Elke ruimte per verdieping. Een heldere rand betekent dat er iemand is. Een warme gloed betekent dat er licht aan is.
    q5: Hoe pauzeer ik één onderdeel?
    a5: "Tik onderin op ‘Pauze’, of houd {name} vast, en kies Verlichting, Raambekleding of Klimaat."
    q6: Wat doet HouseMind nooit?
    a6: Het zet nooit een alarm uit, doet nooit een slot open en opent nooit een garagedeur, poort of deur. Ook niet bij nood.
    q7: Wat gebeurt er met mijn automatiseringen?
    a7: "HouseMind maakt of wist nooit automatiseringen en blijft van hun apparaten af. Zet je in Brein bij ‘Klaar voor autonomie?’ een regel op Autonoom, dan zet HouseMind de automatisering die hem stuurt meteen uit en doet het zelf; doet ze meer, dan vraagt het eerst. Ging alles wat zij doet vaak genoeg goed, dan vraagt HouseMind het één keer bij Wacht op jou; na ja gaat ze uit en doet HouseMind het zelf. Gaat het terug naar Voorstellen of Observeren, dan gaat de automatisering meteen weer aan. Terugdraaien kan altijd."
    q8: "Kan HouseMind de auto laden?"
    a8: "Nee. HouseMind stuurt de lader en de thuisbatterij niet. Op het tabblad Energie zie je wel hoe vol de auto is en of hij laadt. Vraag {name} bijvoorbeeld ‘laad de auto vol voor 7:00’, dan zegt ze het goedkoopste moment."
    q9: "Hoe weet ik of het iets oplevert?"
    a9: "Na de twee weken meten vergelijkt HouseMind elke dag met wat die dag zonder HouseMind gekost zou hebben, rekening houdend met kou en zon. Ook als het eens tegenvalt, zie je dat."
    q10: "Wat zijn momenten?"
    a10: "Momenten zoals koken, eten, film of lezen, met het licht dat daarbij past. Open een ruimte en tik op een moment, of zeg het. Zet het licht zoals je wilt en tik op ‘Onthoud dit’ voor een eigen moment."
    q11: "Waarom vraagt HouseMind 's avonds of het me mag wekken?"
    a11: "Zolang HouseMind het wekken nog leert, vraagt het dat de avond ervoor. Ja geldt alleen voor die ochtend. Doe je het licht uit tijdens het wekken, dan blijft het uit."
    q12: "Hoe gebruik ik een wandtablet?"
    a12: "Open HouseMind op de tablet en kies bij Mijn voorkeuren › Dit apparaat › Wandtablet de ruimte. De tablet wordt wakker als er iemand is. ‘Volledig scherm’ verbergt de balk van de browser; ‘Stop wandtablet’ zet alles terug."
    q13: "Wat zijn proefonderdelen?"
    a13: "Nieuwe onderdelen: huishouden, media, schoonmaken, tuin, en zorg en welzijn. Ze staan eerst uit; een beheerder zet ze aan bij Huisinstellingen › Leren en stappen › Onderdelen. Zorg en welzijn alleen met een ja van wie het betreft."
    q14: "Wat is zorg en welzijn?"
    a14: "Als degene om wie het gaat thuis is en er lang niets beweegt, krijgt een gekozen contactpersoon één bericht. Alleen met toestemming van wie het betreft."
    q15: "Wat doet HouseMind als Home Assistant herstart?"
    a15: "Dan doet HouseMind even niets nieuws en zie je ‘Let op’. Het verbindt vanzelf opnieuw en controleert daarna of alles nog werkt. Wat niet meer werkt, krijgt een melding; daar kijkt HouseMind alleen naar tot het weer werkt."
    q16: "Wat staat er bij HouseMind bijhouden in Huisinstellingen?"
    a16: "Drie dingen: kennisupdates (nieuwe kennis over apparaten, landen en talen; kan uit), of HouseMind de agenda mag lezen (alleen na een ja) en de knop voor het diagnosepakket: een bestand zonder namen om te delen als er iets mis is."
    q17: "Hoe gaat HouseMind om met groepen lampen?"
    a17: "HouseMind schakelt liefst een groep in het netwerk van de lampen zelf: die reageren samen. Daarna groepen uit Home Assistant, dan losse lampen. Zit een lamp in zo'n groep, dan staat in het Logboek, bij Wat ik bedacht en bij Klaar voor autonomie? alleen de groep. Is één lamp met de hand bediend, dan blijft de groep met rust. Staat een lamp op Met rust laten, dan spreekt HouseMind hem nooit los aan, maar zijn groep neemt hem mee; zet je de groep op Met rust laten, dan blijft alles erin stil. Op Expert: Brein › Apparaten en entiteiten, per Ruimte; daar staan de lampen van een groep ingesprongen onder de groep."
    q18: "Hoe zie ik hoe ver HouseMind is?"
    a18: "In Brein, op het tabje ‘Klaar voor autonomie?’, zie je per onderdeel en per vaardigheid in een ruimte de stap, de score tegenover het doel en wat er nog nodig is. De onderdelen staan als tegels: tik op een tegel voor de uitleg en de knoppen van dat onderdeel, en de lijst eronder toont dan alleen dat. ‘Automatiseringen’ toont hoe dicht HouseMind bij overnemen is; onder ‘Meer’ staat de uitleg."
    q19: "Hoe vind ik snel een automatisering of apparaat?"
    a19: "Boven lange lijsten staan een zoekveld en ‘Filter’: vink per onderwerp aan wat je wilt zien; ‘Wis alles’ haalt je keuzes weg. In Brein › Wat ik weet staan ook de ‘Scènes en scripts’ uit Home Assistant, om te bekijken."
    q20: "Leert HouseMind ook van wat er al gebeurde?"
    a20: "Ja. Na je ja op leren leest HouseMind één keer wat Home Assistant bewaarde, meestal 10 dagen. Dat blijft in huis en brengt iets hooguit tot Voorstellen. In Huisinstellingen staan ‘Leer ook van de historie in Home Assistant’ en ‘Opnieuw inlezen’."
    q21: "Wanneer is het donker genoeg voor licht?"
    a21: "Dat leert HouseMind per ruimte van jullie: bij welke stand van de zon of hoeveel licht doe je het licht aan als je binnenkomt? Ook wanneer de gordijnen ’s avonds dichtgaan, leert het per ruimte."
    q22: "Hoeveel vragen stelt {name}?"
    a22: "Alle vragen samen: op Geïnformeerd hooguit één per dag, op Betrokken drie, op Expert kies je het bij Mijn voorkeuren (standaard vijf). De rest wacht in Logboek. Na ‘Nu niet’ komt een vraag later terug, na ‘Nooit zo’ niet meer."
    q23: "Er wonen mensen zonder eigen telefoon, zoals kinderen."
    a23: "Zet dat aan bij Huisinstellingen › Huis. Dan is iedereen pas weg als ook de sensoren in huis stil zijn. Vul ook hun voornamen in: HouseMind gebruikt die alleen om ze bij de AI weg te laten."
    q24: "Waarom doet HouseMind iets niet meer zelf?"
    a24: "Zet iemand iets twee keer in een week terug, of zegt iemand twee keer nee, dan gaat HouseMind daar een stap terug en krijgen de beheerders een bericht. Daarna verdient het de stap opnieuw; op ‘Klaar voor autonomie?’ zie je hoe ver."
    q25: "Kan ik zelf een stap zetten, of iets laten vergeten?"
    a25: "Ja, als beheerder. Tik op ‘Klaar voor autonomie?’ op de tegel van een onderdeel: in de kaart eronder staat ‘Zelf een stap zetten’. Wat de veiligheid niet toelaat, staat grijs. ‘Vergeet dit’ wist wat HouseMind leerde over één vaardigheid in één ruimte. Je bevestigt steeds met ja of nee."
    q26: "In welke taal spreekt {name}?"
    a26: "In de app spreekt ze jouw taal, te kiezen bij Mijn voorkeuren. Op speakers, de wandtablet en in Assist spreekt ze de taal van het huis; die kiest een beheerder bij Huisinstellingen › {name} › Taal van het huis."
    q27: "Hoe lees ik het energieplan?"
    a27: "Bij Energie staat ‘Plan voor de komende uren’. Bovenaan de prijs: blauw is negatief, oranje is duur. Boven de lijn wat er binnenkomt, eronder waar het heen gaat. Onderaan per apparaat wat HouseMind doet. Tik op de grafiek of een blok voor details."
    q28: "Wat doet de Check-up?"
    a28: "HouseMind kijkt elk uur wat er stuk is in Home Assistant, ook back-ups en schijf. Iets belangrijks komt meteen als melding; ‘Bekijken’ laat zien wat er is. De hele pagina Check-up staat op Expert in het menu."
    q29: "Telt een knop of wandschakelaar als een automatisering?"
    a29: "Nee. Een automatisering die alleen doorgeeft wat jullie zelf doen, is jullie eigen hand: een wandschakelaar, een afstandsbediening of een knop in de app die lampen of schakelaars aan, uit of om zet, of dimt. HouseMind bedient die lampen gewoon mee en vraagt nooit om haar uit te zetten; de knop blijft werken. Wat ze doet, telt als iets wat jullie deden, dus HouseMind blijft daarna even van de lamp af. De schakelaar zelf zet HouseMind nooit om."
    q30: "Wat zie ik bij Netwerk?"
    a30: "Kies bij Huis › Ruimtes ‘Netwerk’. {name} staat in het midden, met haar woord eronder; om haar heen de ruimtes, met hun apparaten als stipjes. Doet HouseMind iets, dan stroomt twintig seconden een lijn van de ruimte via {name} naar het apparaat: ‘stroomt nu’. Eronder blijft staan wat het laatst deed, met de tijd en ‘Waarom?’. Vraagt HouseMind iets, dan blijft een stippellijn staan zolang de vraag open is: ‘wacht op jou’. Eronder staan de vraag en ‘Doe het’ en ‘Nu niet’. Staat AI aan, dan zie je een gestippelde ring om {name}: de AI denkt mee, maar beslist niet."
    q31: "Hoe weet HouseMind of het ochtend, avond of nacht is?"
    a31: "Uit jullie eigen ritme, niet van de klok. Het is nacht zodra het huis slaapt; is er nog iemand op, dan twee uur na jullie gewone bedtijd. De ochtend begint als het huis wakker wordt, de avond als jullie meestal thuiskomen. Daar passen het licht bij binnenkomen en de groet van {name} zich aan. In een slaapkamer gaat vanaf de gewone bedtijd geen lamp vanzelf aan. Kent HouseMind een tijd nog niet, dan kijkt het naar de klok. In Brein, bij het tabje Ritme, staat bovenaan wat het nu is. Onder de balken staat ‘Straks’: wat HouseMind bij de volgende momenten van de dag doet, zoals als het donker wordt of het huis gaat slapen."
    q32: "Wanneer doet HouseMind iets voortaan zelf?"
    a32: "Als het vaak genoeg goed ging: standaard 85 van de 100 keer, 10 keer gezien, in minstens een week. Dan staat er één vraag bij ‘Wacht op jou’, die niet verloopt: ‘Ja, voortaan zelf’, ‘Nog niet’ of ‘Nooit’. Eén ja is genoeg. Stuurt een automatisering het, dan krijgt alleen een beheerder de vraag, en gaat ze na ja uit. Zet iemand het in een week twee keer terug, dan vraagt HouseMind het weer eerst en gaat de automatisering weer aan."
    q33: "Houdt het licht van het alarm of de deurbel een ruimte tegen?"
    a33: "Nee. Zo'n automatisering geeft een signaal: een kleur of een knipper, die niet begint door iemand in de ruimte, een deur, de zon of de tijd. Ze blijft aan, houdt niets tegen en HouseMind leert er niets van. Zolang het signaal duurt, blijft HouseMind van de lamp af. Blijft de lamp daarna aan, zoals bij een alarm dat afgaat, dan tot die lamp verandert. Een automatisering die alleen lampen schakelt, gaat mee in de vraag zodra hun regels bewezen zijn. Doet ze meer, zoals ook een stopcontact schakelen, dan blijft ze aan en houdt ze alleen haar eigen lamp."
    q34: "Wanneer gaan de gordijnen in de slaapkamer open?"
    a34: "Als je uit bed bent, niemand meer in die ruimte slaapt en het buiten licht is. Ziet een sensor wie er in bed ligt of in de ruimte is, dan wacht HouseMind tot die een paar minuten leeg is. Zonder zo'n sensor doet het ze alleen open als iedereen weg is, of op een moment dat het van jullie leerde. In een ruimte waar vannacht niemand sliep, gaan ze open met de rest van het huis."
    q35: "Ik heb een apparaat toegevoegd. Krijgt het vanzelf regels?"
    a35: "Ja. Zet je een apparaat in Home Assistant in een ruimte, dan staan de regels die erbij horen meteen bij ‘Klaar voor autonomie?’, met ‘Nog niet gezien’. Een regel voor vocht of CO₂ komt pas als de ruimte die sensor ook heeft. Kent HouseMind de soort van de ruimte niet, dan vraagt het één keer wat voor ruimte het is; tot dan krijgt die ruimte de regels die overal passen. Haal je een apparaat weg, dan verdwijnt de regel. Wat HouseMind ervoor leerde, bewaart het 30 dagen, voor als er weer een apparaat komt."
  l4:
    q1: Wat is het beslisspoor?
    a1: "Bij elk besluit zie je de situatie, de vaardigheid, de tellingen en zekerheid, de zes controles van de veiligheidspoort en de uitkomst. In Brein, onder Meer › Beslisspoor. Het besluit staat er als een stroom: bron, wat ik zag, wat ik dacht en de uitkomst, met eronder de zes stappen van de poort: gehaald, waar het stopte, of niet bereikt. Erboven twee rijen, de kern en de AI-rij, en vandaag van bron naar uitkomst."
    q2: Wat is de gedachtestroom?
    a2: "Alles wat HouseMind overwoog, ook wat het níet deed, en waarom niet. In Brein, onder Meer › Gedachtestroom."
    q3: Hoe werkt het leren?
    a3: "Per vaardigheid, ruimte en half uur telt HouseMind wat mensen doen; na 14 dagen telt iets nog half. Bewezen is 10 situaties en 85% goed, in minstens een week: dan vraagt HouseMind één keer of het dit voortaan zelf mag doen, en één ja is genoeg. Via antwoorden kan het ook: 15 antwoorden en 90% ja, in minstens een week. Twee correcties of twee keer nee in een week: een stap terug."
    q4: Wat controleert de veiligheidspoort?
    a4: Echt en geldig; toegestaan, inclusief de harde grenzen in de code; mag het nu (pauze, mens wint, ander systeem, huisregels); de stap; verstandig (schakelgrenzen, batterijen); en gelukt (Home Assistant bevestigt).
    q5: Apparaten en entiteiten
    a5: "Per entiteit zie je wat HouseMind herkende en wat de hoogste stap is. Een beheerder kan kiezen voor ‘Met rust laten’. Je vindt ze in Brein, bij het tabje Apparaten. Labels uit Home Assistant gebruikt HouseMind alleen als hint."
    q6: AI
    a6: "Optioneel. Vragen gaan door een privacyfilter met neutrale namen. AI mag alleen voorstellen, nooit zelf handelen. Beheerders zien precies wat er verstuurd is. Elke vraag zegt in welke vorm het antwoord moet; kan de dienst dat, dan kan de AI niet anders antwoorden. Wat niet past, telt niet. Op Expert kies je bij het AI-blok per taak een model en zie je wat elke taak kostte. AI kan ook helpen je huis te begrijpen: bij Brein › Wat ik weet zie je wat het denkt, en pas je het aan, ook na Klopt. Pas na Klopt stelt HouseMind er iets mee voor of doet het iets zelf. Ook zonder AI leidt HouseMind dingen af uit gedrag, en vraagt het waar de regels twijfelen. Op Geïnformeerd stelt {name} daar hooguit één vraag per dag over, met Klopt en Klopt niet. Iets belangrijks zegt {name} altijd in de eigen woorden van HouseMind, zonder AI. Je kunt ook de AI van Home Assistant kiezen, de AI-taak die daar al is ingesteld: dan bewaart HouseMind geen sleutel. Werkt die AI in huis, dan is er geen budget; in de cloud hooguit 100 vragen per dag. Daar staat ook wat elke entiteit is; dat bevestig je per apparaat in één keer."
    q7: "Hoe rekent het energieplan?"
    a7: "Per kwartier voor 36 uur: de boiler extra warm als het goedkoop is of de zon schijnt, voorverwarmen vóór een dure piek als dat echt oplevert, en een apparaat op het goedkoopste moment. De thuisbatterij en de auto zitten er niet in."
    q8: "Hoe werkt de koppeling met Home Assistant?"
    a8: "Tik als beheerder bij Huisinstellingen › Onderhoud en privacy op ‘Koppelen’: HouseMind zet de integratie klaar, herstart Home Assistant zo nodig en maakt het zelf af. Dan staan de toestand en een pauzeschakelaar in Home Assistant. Alles gaat door de veiligheidspoort."
    q9: "HouseMind in Assist"
    a9: "Kies HouseMind als gespreksagent en zet ‘Opdrachten eerst lokaal afhandelen’ aan. Huisvragen beantwoordt HouseMind zelf. Andere vragen alleen als een beheerder dat toestaat, en dan gaat alleen de vraag mee."
    q10: "Hoe leert HouseMind het ritme?"
    a10: "Uit de huisstand: wanneer het huis gaat slapen, wakker wordt, leeg raakt en weer thuis is, per soort dag. Een tijd telt pas na minstens drie dagen die dicht bij elkaar liggen. In Brein zie je het bij het tabje Ritme. Daar staat ook per ruimte wat HouseMind leerde. Met AI maakt die er één keer per dag een kort verhaal van; de tijden en getallen komen van HouseMind zelf."
    q11: "Kennisupdates"
    a11: "HouseMind kan elke dag nieuwe kennis ophalen: apparaatsoorten, landen en talen. Alleen een bundel met een goede handtekening wordt gebruikt; de vorige blijft bewaard. Je kunt dit uitzetten in Huisinstellingen."
    q13: "Het diagnosepakket"
    a13: "Eén knop in Huisinstellingen maakt een bestand om te delen als er iets mis is: versies, aantallen en de laatste waarschuwingen, met elke naam vervangen door een neutraal label."
    q14: "Zelfcontrole en geteste versies"
    a14: "Na elke start van Home Assistant kijkt HouseMind of wat het gebruikt er nog is. Is Home Assistant nieuwer dan getest, dan vraagt het een dag lang eerst bij gevoelige apparaten. Is de installatie niet ondersteund of gezond, dan krijgen beheerders één rustige melding."
    q15: "Hoe zie ik hoe ver HouseMind is?"
    a15: "In Brein, op ‘Klaar voor autonomie?’, staan op Expert ook de cijfers: score, zekerheid, goed, anders en teruggezet. Onder de zin over wat HouseMind doet staat waarom precies: de sensoren, drempels, bron en hoe zeker het is. De grens staat bij Huisinstellingen."
    q16: "Hoe vind ik snel een automatisering of apparaat?"
    a16: "Boven lange lijsten staan een zoekveld en ‘Filter’: vink aan wat je wilt zien; ‘Wis alles’ haalt je keuzes weg. Met ‘Groeperen’ zet je de lijst per ruimte, soort of stap. In Huisinstellingen staan ook de ‘Scènes en scripts’ uit Home Assistant, om te bekijken."
    q17: "Hoe maak ik een eigen kleurenschema?"
    a17: "Zet een bestand in /config/housemind/themes/. Kopieer het ‘Voorbeeldbestand’ uit Huisinstellingen › Onderhoud en privacy › Kleurenschema's en geef het een eigen id, naam en kleuren. Binnen een minuut staat het in de lijst, als het goed leesbaar is; anders staat daar waarom."
    q18: "Leert HouseMind ook van wat er al gebeurde?"
    a18: "Ja. Na je ja op leren leest HouseMind één keer wat Home Assistant bewaarde, meestal 10 dagen. Dat blijft in huis en brengt iets hooguit tot Voorstellen. In Huisinstellingen staan ‘Leer ook van de historie in Home Assistant’ en ‘Opnieuw inlezen’."
    q19: "Hoe telt HouseMind ‘donker’ en de gordijnen?"
    a19: "HouseMind noteert bij binnenkomen zonder licht de zonnestand, de lux en of er binnen 3 minuten een lamp aanging. Na 6 keer beslist de beste maat; tot dan lux onder 40 of zon onder 3°. Gordijnen: de zonnestand waarop ze daar meestal dichtgaan."
    q20: "Drempels, een eerdere dag en wat HouseMind nu zou doen"
    a20: "In Brein › Klaar voor autonomie? staan in de kaart van een onderdeel de Drempels: daar kies je wanneer een stap verder mag; ‘Standaard’ zet ze terug. ‘Een eerdere dag terugzetten’, bij Huisinstellingen › Opnieuw beginnen, zet het geleerde terug naar een van de laatste 7 dagen. Wat HouseMind nu per ruimte zou doen, zie je in ‘Test het huis’, zonder te schakelen; wat het straks doet in Brein › Ritme, onder ‘Straks’."
    q21: "Instellingen bewaren en inlezen"
    a21: "In Huisinstellingen › Onderhoud en privacy bewaar je de instellingen als één leesbaar bestand, zonder gesprekken, logboek, mensen of sleutels. Bij inlezen zie je eerst wat er verandert; pas na ja gebeurt het. Een bestand maakt de veiligheid nooit losser."
    q22: "De koppeling met Home Assistant werkt niet"
    a22: "Tik in Huisinstellingen › Onderhoud en privacy, bij ‘HouseMind in Home Assistant’, op ‘Koppelen’. HouseMind maakt de koppeling zelf af en herstart Home Assistant zo nodig. Lukt dat niet, dan zie je drie stappen en ‘Open in Home Assistant’."
    q23: "Hoe verwijder ik HouseMind?"
    a23: "Ga naar Huisinstellingen › Opnieuw beginnen › HouseMind verwijderen en tik op ‘Alles teruggeven’. Automatiseringen die HouseMind uitzette, gaan weer aan en de koppeling in Home Assistant gaat weg. Verwijder daarna de App in Home Assistant. Noodreacties werken tot dan."
    q24: "Wat doet de Check-up?"
    a24: "In het menu bij Check-up kijkt HouseMind elk uur wat er stuk is, ook back-ups en schijf; ‘Nu nakijken’ kijkt meteen. Het wist nooit iets; uitzetten kan na je ja, met ‘Terugzetten’. ‘Bewust uit’, ‘Laat zo’, ‘Geen dubbele’ en ‘Bewust houden’ stoppen een vraag. Iets belangrijks komt meteen, met ‘Bekijken’."
    q25: "Kan ik uitzetten dat {name} zelf haar venster opent?"
    a25: "Ja, voor het hele huis. Een beheerder zet het bij Huisinstellingen, in de groep {name}, uit. Dan springt haar vraag bij niemand meer open en wacht hij in Logboek. Tik op {name} of op ‘Vraag {name}’, dan stelt ze hem alsnog. Een eigen keuze per persoon is er niet meer."
    q26: "Wat zie ik bij Netwerk?"
    a26: "Huis › Ruimtes begint op Expert met ‘Netwerk’. {name} staat in het midden, met haar woord eronder; om haar heen de ruimtes, met hun apparaten als stipjes. Doet HouseMind iets, dan stroomt twintig seconden een lijn van de ruimte via {name} naar het apparaat: ‘stroomt nu’. Eronder blijft staan wat het laatst deed, met de tijd en ‘Waarom?’. Vraagt HouseMind iets, dan blijft een stippellijn staan zolang de vraag open is: ‘wacht op jou’. Eronder staan de vraag en ‘Doe het’ en ‘Nu niet’. Staat AI aan, dan zie je een gestippelde ring om {name}: de AI denkt mee, maar beslist niet. Wijs een stip aan en je ziet welk apparaat het is; een groep, zoals bij Apparaten, is één stip voor al zijn apparaten."
    q27: "Hoe test ik HouseMind in mijn eigen huis?"  # Test het huis (E-474)
    a27: "Tik als beheerder op Expert rechtsboven op het kolfje, ‘Test het huis’; op een telefoon is het de tab ‘Testen’. Kies een ruimte, en bij ‘Speel het na’ wat er gebeurt, zoals iemand die in het donker binnenkomt of de avond. HouseMind laat dan zien wat het zou doen, en per regel hoe dat in het echt gaat: zelf doen, eerst vragen, alleen meekijken, of niet en waarom. Er schakelt nog niets. Met ‘Doe het echt’ doet HouseMind het echt in je huis: de lamp gaat aan, het gordijn dicht, en in het netwerk stroomt de lijn. Na een minuut zet het alles terug, tenzij je ‘Laat zo’ kiest; met ‘Zet terug’ gaat het meteen. Zegt een huisregel nee, stuurt een automatisering het apparaat, of kan het niet terug, dan doet de test het niet, en staat de reden erbij. Avond neemt het licht van die avond mee: in november is dat donker. Met ‘Loop zelf rond’ staat een onderdeel even op Autonoom met de echte sensoren, en loop je zelf door de ruimte. Onder ‘Wat er net gebeurde’ zie je wat HouseMind besloot, welke controle nee zei, en hoe snel het ging. Wat je test, telt niet mee voor het leren. Staat er dat iemand het apparaat met de hand bediende, dan deed iemand dat net zelf; even weg uit het netwerk telt daar niet voor."
    q28: "Hoe stel ik de standen van een lamp in?"  # Standen voor lampen (E-490)
    a28: "Elke lamp dimt anders: 40% is bij de ene lamp nog fel en bij de andere al schemer. Daarom heeft elke lamp vier standen: Gedimd, Normaal, Helder en Maximaal. Kies als beheerder op Expert in Brein het tabje Apparaten en entiteiten, en tik bij een lamp op ‘Standen’. Schuif per stand naar het percentage dat bij die lamp goed voelt, en kies de kleur: die volgt het dagritme, of je zet hem vast van warm tot wit. Met ‘Proef’ gaat de lamp zelf naar die stand; ‘Laat alle vier zien’ loopt ze af. Zolang het venster open is, blijft HouseMind van de lamp af. Met ‘Klaar’ of als je het venster sluit, staat hij weer zoals hij was. Tik op ‘Bewaren’: dat geldt alleen voor deze lamp. Met ‘Proef een stand’ bij een ruimte zie je of alle lampen daar bij elkaar passen. HouseMind praat daarna in standen: ‘Mag ik de eetkamer op Gedimd zetten?’"

help:
  l1:
    q1: "Que fait HouseMind ?"
    a1: "HouseMind s'occupe pour toi des lumières, des rideaux et du chauffage. Tu le remarques à peine. En cas d'urgence, comme de la fumée ou une fuite, il agit tout de suite."
    q2: "Que veut dire la boule ?"
    a2: "La boule, c'est {name}, la voix de ta maison. Sa couleur, sa forme et son mot montrent comment ça va ; rouge avec deux anneaux, c'est une urgence. Touche son mot pour voir ce que veut dire chaque couleur, ou la ligne en dessous pour le message."
    q3: "Comment poser une question ?"
    a3: "Touche {name} ou ‘Demander à {name}’. Elle te demande ce qu'elle peut faire pour toi, et écoute. Pour ta question suivante, touche-la de nouveau. Si quelque chose t'attend, elle le dit d'abord. Si ton appareil ne peut pas écouter, elle te dit brièvement ce qui se passe."
    q4: "Comment mettre HouseMind en pause ?"
    a4: "Touche ‘Pause’, ou appuie longuement sur {name}. Choisis ‘Pendant 1 heure’, ‘Jusqu'à demain’ ou ‘Jusqu'à ce que je reprenne’ ; chaque bouton dit jusqu'à quand. Les réactions d'urgence continuent de fonctionner."
    q5: "Il s'est passé quelque chose que je ne voulais pas."
    a5: "Remets simplement les choses comme avant toi-même. HouseMind le remarque, n'y touche plus pendant un moment et en tient compte."
    q6: "Je veux en voir plus."
    a6: "Touche la personne en haut à droite, Mes préférences, et choisis un autre niveau sous À propos de moi."
    q7: "HouseMind peut-il me réveiller ?"
    a7: "Oui, si un réveil est réglé sur ton téléphone : la lumière de la chambre s'allume doucement avant et la pièce est chauffée. Aux autres niveaux, HouseMind peut aussi te réveiller à l'heure où tu te lèves d'habitude."
    q8: "Puis-je parler à HouseMind ?"
    a8: "Oui, via l'assistant vocal de Home Assistant, si un administrateur a activé l'intégration. Demande par exemple : comment ça va ?"
    q9: "Que fait HouseMind avec l'eau ?"
    a9: "Si l'eau coule longtemps alors que personne ne l'utilise, HouseMind te le dit. Avec une vanne d'eau principale, il peut la fermer – jamais l'ouvrir."
    q10: "HouseMind remplace-t-il mon détecteur de fumée ou mon alarme ?"
    a10: "Non. HouseMind aide pour la sécurité, mais ne remplace pas un détecteur de fumée, un détecteur de CO ou un système d'alarme certifié. Garde-les à la maison et teste-les régulièrement."
    q11: "Qui est {name} ?"
    a11: "{name} est la voix de ta maison. Touche-la : elle te demande ce qu'elle peut faire pour toi. Ce qu'elle dit s'affiche toujours aussi en texte. Dans Mes préférences, tu choisis si elle te dit tu ou vous, et si elle parle à voix haute."
    q12: "Puis-je refaire la visite ?"
    a12: "Oui. Touche la boussole en haut à droite, ‘Visite’ : {name} te montre à nouveau où tout se trouve. Si tu choisis un niveau plus élevé, elle te montre d'elle-même ce qui est nouveau. ‘Passer’ arrête tout de suite."
    q13: "Où en est HouseMind ?"
    a13: "Demande à {name} : ‘Où en es-tu ?’ ou ‘Où en es-tu avec l'éclairage ?’. Elle te dit par domaine où en est HouseMind et ce qu'il manque encore, et te le montre si tu veux."
    q14: "Puis-je choisir d'autres couleurs ?"
    a14: "Oui. Touche la personne en haut à droite (Mes préférences), choisis Cet appareil puis un Jeu de couleurs, comme Clair, Contraste élevé ou Nuit. Cela ne vaut que pour cet appareil ; les couleurs de {name} restent les mêmes."
    q15: "Est-ce que je reçois un message quand quelque chose ne va pas ?"
    a15: "En cas d'urgence, comme de la fumée ou une fuite, tu reçois un message sur ton téléphone, même la nuit, sauf si tu as dit non. Si tu as dit oui dans Mes préférences aux messages en cas de danger, tu en reçois aussi pour une chose risquée, comme une porte ouverte quand personne n'est là."
    q16: "Que garde HouseMind sur moi ?"
    a16: "Regarde dans Mes préférences › À propos de moi › Mes données : ton niveau, tes consentements, tes règles de la maison et combien de temps HouseMind garde quoi. ‘Enregistrer comme fichier’ te donne tes propres données. ‘Oublie-moi’ efface ce que HouseMind garde sur toi."
    q17: "J'ai besoin de plus de temps pour parler ou lire"
    a17: "Dans Mes préférences › À propos de moi › Temps, choisis Plus long ou Long. {name} écoute alors plus longtemps et les messages courts restent plus longtemps ; sur Long, jusqu'à ce que tu les fermes. Pendant qu'elle écoute, ‘Encore un peu’ te donne plus de temps."
    q18: "Qu'est-ce que « Jouer la maison » ?"
    a18: "Un panneau dans une maison de démo, sur un grand écran. ‘Lecture’ fait avancer le temps, ‘Stop’ l'arrête ; sous ‘Jouer soi-même’, tu prépares tout, même pendant que le temps avance. ‘Histoires’ joue un moment de vie de la maison, ‘Le temps’ avance. ‘Ce qui vient de se passer’ et le Journal montrent ce que HouseMind a fait ; la vraie maison ne remarque rien."
    q19: "Que veut dire ‘Pas de connexion – nouvel essai…’ ?"
    a19: "Cet écran n'a plus de contact avec HouseMind pendant un moment, par exemple pendant une mise à jour ou quand le réseau était coupé. HouseMind lui-même continue de fonctionner. L'écran se reconnecte tout seul : aussitôt quand tu reviens ou que le réseau est revenu, sinon en dix secondes au plus. Si le message est toujours là après une minute, recharge la page."
  l2:
    q1: "Qu'est-ce que je vois ?"
    a1: "En haut, tu vois comment ça va. En dessous, au plus trois cartes qui t'attendent, une phrase sur ce que HouseMind a pensé, et une carte pour chaque pièce. Tout le reste est dans le Journal."
    q2: "Quel est le message après une action ?"
    a2: "Il dit ce que HouseMind vient d'essayer de lui-même alors que cette règle est encore sur Proposer. Touche ‘Pourquoi ?’ pour la raison, ou ‘Annuler’ pour revenir en arrière. Sur Autonome, HouseMind le fait simplement, sans message ; tu le vois dans le Journal."
    q3: "Combien de notifications vais-je recevoir ?"
    a3: "Trois par jour au maximum ; les urgences et la sécurité arrivent toujours, même la nuit. Pendant tes heures calmes, le reste attend le matin. Les informations arrivent une fois par jour dans un résumé. Dans Mes préférences, tu choisis moins ou plus."
    q4: "Que puis-je demander à {name} ?"
    a4: "Touche ‘Demander à {name}’ et parle ou écris, par exemple « comment ça va », « pourquoi », « pause » ou « annule ». Avec une IA, tu peux demander plus, comme « pourquoi faisait-il froid dans la salle de bain hier ? » : elle le cherche alors, avec des noms neutres. Tu peux aussi continuer, comme « et dans la cuisine aussi » ; avant de faire quelque chose, elle demande. « Remets ça » remet ce qu'elle vient de faire. Sa réponse s'affiche au fur et à mesure. Tes conversations sont ensuite dans le Journal. Si elle ne sait pas quelque chose, elle le dit."
    q5: "Pourquoi quelque chose ne s'est pas passé ?"
    a5: "Ouvre la pièce et touche l'appareil. En dessous, tu vois ce que HouseMind en fait, et pourquoi."
    q6: "Mes données sont-elles en sécurité ?"
    a6: "Tout reste chez toi. Quelque chose ne sort que si un administrateur dit oui, ou pour un message sur ton téléphone. La déclaration de confidentialité complète se trouve sous À propos de HouseMind."
    q7: "Que fait HouseMind avec l'énergie ?"
    a7: "Après deux semaines de mesure, HouseMind fait de l'eau chaude et démarre des appareils quand l'électricité est bon marché ou que le soleil brille. Il ne pilote pas la batterie domestique ni la voiture. Dans Énergie, ‘Les prochaines 24 heures’ montre le prix, le soleil et ce que fait HouseMind."
    q8: "Qu'est-ce que le point du matin ?"
    a8: "Quand tu te lèves le matin, HouseMind te dit brièvement la météo, l'agenda et quelque chose sur l'énergie, sur une enceinte ou en haut du Journal. Il ne lit l'agenda qu'après un oui d'un administrateur. Dans Mes préférences, tu choisis ce qu'il contient."
    q9: "Qu'est-ce que la vérification du coucher ?"
    a9: "Quand tu vas te coucher, HouseMind regarde si tout est fermé et éteint. Si une porte est encore ouverte, tu l'entends ou tu le vois. HouseMind ne verrouille, n'ouvre ni ne ferme jamais lui-même une serrure ou une porte."
    q10: "Aujourd'hui est différent. Que faire ?"
    a10: "Dans le Journal, touche ‘Journée différente ?’, ou écris par exemple : aujourd'hui je suis en télétravail. HouseMind s'adapte ce jour-là, sans changer tes habitudes."
    q11: "Qu'est-ce que le rapport de la maison ?"
    a11: "Chaque dimanche soir, un court rapport : ce que HouseMind a fait, ce que tu as remis comme avant et ce qu'il a économisé. Tu le trouves dans le Journal. Dans Mes préférences, tu choisis un autre jour."
    q12: "Pourquoi un message sur une pile ?"
    a12: "HouseMind veille à l'entretien : une pile presque vide, un détecteur de fumée ou autre détecteur d'urgence qui ne répond plus depuis un jour, un filtre, et la veille du ramassage des déchets. Il le signale seulement ; il ne fait rien."
    q13: "Le four est allumé et je suis absent ?"
    a13: "Tu reçois alors un message. Si le four ou la plaque peut être éteint, HouseMind demande « Je l'éteins ? » et ne le fait qu'après ton oui. HouseMind ne les allume jamais. Si une lampe est allumée depuis quatre heures dans une pièce où personne n'est passé depuis une heure, HouseMind demande aussi « Je l'éteins ? » ; avec l'IA, une raison possible l'accompagne. Après « Non, garde-la active », il ne demande plus rien sur cette lampe pendant un mois."
    q14: "Un capteur dehors entend une alarme ?"
    a14: "Si par exemple une caméra sur la terrasse entend une alarme de fumée, tu reçois un message, aussi la nuit. HouseMind n'allume alors pas de lumière et ne parle pas : le son peut venir des voisins."
    q15: "Que sont les zones d'une pièce ?"
    a15: "Certains capteurs de présence connaissent des zones, comme « Lit ». Une zone qui porte le nom d'une autre pièce compte pour cette pièce ; sinon, elle fait partie de la pièce. Sous Zones dans une pièce, tu vois par zone si quelqu'un est là."
    q16: "Un robot aspirateur compte-t-il comme quelqu'un ?"
    a16: "Non. Pendant qu'un robot aspirateur roule, et 2 minutes après, un mouvement ne compte pas. Une présence qui commence alors compte peu, et pas du tout quand personne n'est à la maison. Qui était déjà là reste là."
    q17: "Qu'y a-t-il sous Ce que j'ai pensé ?"
    a17: "Ce que HouseMind a vu, pensé et fait. En Sans souci, une phrase sous {name} parle de la dernière heure. ‘Plus dans le Journal’ montre le reste, avec ‘Pourquoi ?’ et ‘Annuler’. En Informé une phrase par chose, en Impliqué aussi ce qu'il a laissé, en Expert aussi les détails. À partir d'Informé, le plus récent s'affiche en deux blocs : ce que j'ai vu et ce que j'ai fait ou demande. Sur Impliqué, le journal montre vu, pensé et fait l'un sous l'autre, avec une ligne : elle coule quand c'est fait, des points t'attendent, et une ligne qui s'arrête n'a pas été faite. En mode Sans souci, un fin anneau autour de {name} a un point pour chaque fois que HouseMind a fait quelque chose aujourd'hui, à l'heure où c'est arrivé. En mode Informé et Impliqué, « Aujourd'hui » montre par pièce ce qu'il a fait, demandé ou laissé."
    q18: "Comment répondre à {name} ?"
    a18: "Touche {name} : sa fenêtre s'ouvre. Quand tu vois ‘J'écoute’, parle ; si le micro ne marche pas, la fenêtre dit pourquoi. Tu peux aussi écrire en bas de la fenêtre. Sans IA, elle propose des boutons comme ‘Comment va la maison ?’ et ‘Aide’, et comprend des questions fixes. Après sa réponse, elle ne continue pas à écouter d'elle-même : touche-la de nouveau, aussi dans sa fenêtre."
    q19: "Est-ce que {name} pose aussi des questions ?"
    a19: "Oui. Quand quelque chose attend ta réponse, {name} te le demande dans sa fenêtre, avec les boutons ; une proposition a aussi ‘Pourquoi ?’. La question reste affichée jusqu'à ce que tu répondes ou fermes la fenêtre ; la suivante vient ensuite. Il y a aussi ‘Je m'en occupe’ et ‘Plus tard’, et pour un administrateur ‘Ne plus afficher’. Après ‘Plus tard’, la question attend dans le Journal. Si un administrateur a désactivé sa fenêtre pour la maison, la question attend dans le Journal ; touche {name} et elle la pose quand même."
    q20: "Où vois-je où en est HouseMind ?"
    a20: "Dans Maison, tu trouves ‘Prêt pour l'autonomie ?’ : par domaine, comme Éclairage, une phrase sur où en est HouseMind et ce qu'il manque encore. Tu peux aussi demander à {name} : « Où en es-tu ? ». HouseMind gagne chaque étape lui-même."
    q21: "Où se trouvent l'Aide et les Paramètres de la maison ?"
    a21: "En haut à droite, sur chaque écran : le point d'interrogation, c'est l'Aide avec le manuel, la boussole la Visite, la roue dentée les Paramètres de la maison (pour les administrateurs) et la personne Mes préférences. Les messages courts, comme ‘Enregistré’, s'affichent un instant à côté de ces boutons."
    q22: "HouseMind apprend-il aussi de ce qui s'est déjà passé ?"
    a22: "Oui. Après ton oui à l'apprentissage, HouseMind lit une fois ce que Home Assistant a gardé, en général 10 jours. Tout reste dans la maison et amène quelque chose au plus jusqu'à Proposer. Dans les Paramètres de la maison, tu trouves ‘Apprendre aussi de l'historique de Home Assistant’ et ‘Relire’."
    q23: "Qu'y a-t-il dans le Journal ?"
    a23: "En haut, ‘Attend ta réponse’ : les notifications qui t'attendent encore, avec leurs boutons. Le chiffre à côté de Journal dans le menu compte exactement celles-là, pas ce qui est nouveau. En dessous, tout ce qui s'est passé, 30 jours en arrière, avec tes propres conversations. Avec Filtrer, tu choisis Fait, Seulement observé, Notifications ou Conversations, avec Période par exemple Aujourd'hui. Ce que HouseMind a fait a ‘Pourquoi ?’ et ‘Annuler’. Les administrateurs voient sous IA ‘Voir ce qui a été envoyé et reçu’ : la consigne (pourquoi HouseMind demande et quelle réponse il attend), ce qui a été envoyé et la réponse."
    q24: "Comment recommencer, ou revenir aux réglages d'usine ?"
    a24: "En tant qu'administrateur : Paramètres de la maison › Recommencer. ‘Refaire la présentation’ reprend la présentation. ‘Réapprendre’ fait oublier à HouseMind ce qu'il a appris ; tes règles de la maison restent. ‘Retour aux réglages d'usine’ efface tout ; ensuite tu le réinstalles avec ‘Installer’. Les réactions d'urgence continuent de fonctionner."
    q25: "Comment activer le mode vacances ou invités ?"
    a25: "Touche {name} et choisis ‘Vacances’ ou ‘Invités’ ; ensuite il y a ‘De retour’. Tu peux aussi le dire : « nous partons en vacances ». Dans les deux modes, HouseMind n'apprend pas. En vacances, la maison semble habitée le soir."
    q27: "Puis-je dire « Hey {name} » ?"
    a27: "Oui, avec un satellite vocal ou avec Assist sur ton téléphone. Un mot d'activation avec son nom, tu le fais créer toi-même ; Home Assistant explique comment. S'il existe, HouseMind le met dans son propre pipeline Assist (Paramètres de la maison › {name})."
    q28: "Que fait HouseMind avec les caméras ?"
    a28: "HouseMind ne regarde pas lui-même les images. Il utilise seulement ce que tes caméras signalent déjà dans Home Assistant, comme une personne ou un colis. Quand tout le monde est parti, tu reçois un seul message avec l'image. HouseMind ne garde jamais d'images, de visages ni de plaques. Seulement si un administrateur l'active et que l'IA de Home Assistant fonctionne dans la maison, cette IA décrit avec un message ce qu'on voit sur l'image ; l'image reste dans la maison."
    q29: "HouseMind active-t-il ou éteint-il l'alarme ?"
    a29: "{name} demande seulement : « Je mets l'alarme en mode absent ? » quand tout le monde est parti, et « en mode nuit » quand la maison va dormir. HouseMind ne la désactive jamais. Quelle alarme c'est, tu le choisis dans Paramètres de la maison › Maison › Sécurité."
    q30: "Comment HouseMind gère-t-il le chauffage ?"
    a30: "Calmement. Si personne n'est à la maison depuis plus d'un jour, le chauffage baisse de 3 degrés, pas sous 15 °C. Si une pièce reste trop froide, HouseMind monte un peu le thermostat. Ce que tu règles toi-même, il le retient comme ton souhait."
    q31: "Je reçois trop de messages. Que puis-je faire ?"
    a31: "Chaque message a ‘Je m'en occupe’ et ‘Plus tard’. ‘Plus tard’ le met de côté un moment. Un administrateur a aussi ‘Ne plus afficher’ : cela coupe ce type pour toute la maison, sauf les urgences. Le Journal les garde comme ‘pas affiché’. Un administrateur les remet avec ‘Afficher de nouveau’, dans le Journal ou dans Paramètres de la maison › Maison."
    q32: "Pourquoi une pièce indique-t-elle encore quelqu'un ?"
    a32: "Si la pièce a un capteur de présence, elle est vide dès que ce capteur ne voit plus personne. Si elle n'a qu'un détecteur de mouvement, « Quelqu'un est là » reste encore quelques minutes : un détecteur de mouvement ne voit pas si quelqu'un reste immobile ou est parti. Un capteur de présence hors ligne ne compte pas."
    q33: "Pourquoi les appareils d'une pièce sont-ils sous des titres ?"
    a33: "Chaque titre est un appareil, avec son nom et son type venant de Home Assistant. En dessous se trouve ce qui en fait partie. Le voyant propre d'un capteur ou d'un assistant vocal est une LED d'état : HouseMind ne le compte pas comme lumière dans la pièce et ne l'allume ni ne l'éteint jamais de lui-même. Les réglages d'un appareil sont repliés en bas ; HouseMind ne les change jamais. Sous chaque nom, un mot dit ce que c'est, comme lampe, thermostat de la pièce, réglage ou pas encore connu."
    q34: "Combien de temps la lumière reste-t-elle allumée quand il n'y a plus personne ?"
    a34: "HouseMind l'apprend pour chaque pièce, d'après ce que vous et vos automatisations faites. En attendant, c'est court dans des toilettes, une salle de bain, un débarras ou une cave, et plus long dans un couloir où l'on va et vient. Si seul un détecteur de mouvement te voit, il attend au moins 3 minutes. D'abord, la lumière baisse un instant. Si tu reviens, ou si tu rallumes tout de suite, HouseMind attend plus longtemps dans cette pièce à l'avenir. « Prêt pour l'autonomie ? » montre l'attente par pièce. Sans capteur de présence ou de mouvement, HouseMind ne peut pas voir que la pièce est vide : il n'y éteint donc pas la lumière."
    q35: "La lumière extérieure s'allume-t-elle quand nous sommes absents ?"
    a35: "Oui, dès que HouseMind peut le faire lui-même. À la tombée de la nuit, les lampes extérieures s'allument, même quand personne n'est à la maison : la maison paraît habitée. Elles s'éteignent quand la maison va dormir. Quand personne n'est à la maison, vers ton heure de coucher habituelle, quelques minutes différemment chaque soir."
    q36: "La lumière extérieure s’allume-t-elle quand je rentre dans le noir ?"
    a36: "Oui, à l’entrée, dès que HouseMind peut le faire lui-même. Quand tu rentres dans le noir, les lampes de l’allée, de la porte d’entrée ou du carport s’allument tout de suite, et s’éteignent après 5 minutes. S’il y a encore quelqu’un dehors, elles restent allumées plus longtemps. Si la lumière est déjà allumée, elle reste comme elle est. Si tu rallumes la lampe juste après, HouseMind la laisse allumée plus longtemps la fois suivante."
    q37: "Pourquoi HouseMind demande-t-il s'il peut faire quelque chose lui-même désormais ?"
    a37: "Parce qu'il a vu cela bien marcher assez souvent. Tu vois la question dans ‘Attend ta réponse’ dans le Journal. Choisis ‘Oui, désormais’, ‘Pas encore’ ou ‘Jamais’. Si tu le remets ensuite comme avant deux fois en une semaine, HouseMind demande de nouveau d'abord."
    q38: "J'ai commandé une lampe à la main. Combien de temps HouseMind n'y touche-t-il pas ?"
    a38: "Tant que quelqu'un est dans la pièce, ton choix tient, quelques heures au plus. Si la pièce a été vide et que quelqu'un entre, c'est un nouveau moment : la lumière se rallume comme d'habitude quand il fait sombre. Si tu reviens en moins de 2 minutes, tout reste comme tu l'as laissé. Si tu éteins une lampe alors que personne n'est dans cette pièce, par exemple avec un bouton qui éteint tout, cela vaut tout de suite. Si tu l'allumes ainsi, elle reste allumée."
    q39: "Pourquoi la couleur de la lumière change-t-elle avec la journée ?"
    a39: "La lumière suit la journée : plus vive et plus blanche le jour, plus douce et plus chaude le soir. Si tu as Adaptive Lighting, HouseMind lit ses réglages et les reprend : en Autonome, il le fait lui-même ; en dessous, Adaptive Lighting le fait encore. Sans cette intégration, HouseMind fait lui-même une telle ligne, d’après ce qu’il a appris dans cette pièce pour le soir et le jour. Si tu choisis autre chose, cela reste ainsi jusqu’à ce que la lampe s’éteigne. Si tu le fais souvent, HouseMind s’en souvient."
  l3:
    q1: "Que sont les propositions ?"
    a1: "Quand HouseMind n'est pas encore sûr, il demande d'abord. Tu réponds ‘Fais-le’, ‘Pas maintenant’, ‘Moi-même désormais’ ou ‘Jamais’. ‘Moi-même désormais’ le fait maintenant et désormais sans demander. ‘Jamais’ devient une règle de la maison après ta confirmation. Avec l'IA, HouseMind peut aussi proposer aux administrateurs au plus trois règles de la maison par semaine, à partir de ce qu'il a appris, avec la raison. Seulement ‘jamais’ ou une température maximale, et seulement après ton oui ; après non, cette proposition ne revient pas."
    q2: "Que sont les étapes ?"
    a2: "Chaque compétence passe d'Observer à Proposer puis à Autonome, pièce par pièce. Proposer vient vite. Elle passe à Autonome quand elle a eu raison assez souvent, pendant au moins une semaine : HouseMind demande alors une fois, et un oui suffit. Jusqu'où elle peut aller par domaine, un administrateur le choisit dans Paramètres de la maison › Apprentissage et étapes › Domaines."
    q3: "Que sont les règles de la maison ?"
    a3: "Des règles qui s'appliquent toujours, par exemple « ne jamais ouvrir les rideaux de la chambre avant 7:00 ». Écris-les ou choisis-les ; HouseMind te relit d'abord une règle. Avec une IA, tu modifies aussi une règle avec tes propres mots, comme « mets cette règle une heure plus tard le week-end » ; HouseMind relit la nouvelle règle et attend ton oui. Tu les trouves dans Cerveau, sous l'onglet Règles de la maison. Pour en retirer une, il demande d'abord oui ou non."
    q4: "Que montre le plan ?"
    a4: "Chaque pièce, étage par étage. Un bord lumineux veut dire que quelqu'un est là. Une lueur chaude veut dire qu'une lumière est allumée."
    q5: "Comment mettre une seule partie en pause ?"
    a5: "Touche ‘Pause’ en bas, ou appuie longuement sur {name}, et choisis Éclairage, Volets et rideaux ou Climat."
    q6: "Qu'est-ce que HouseMind ne fait jamais ?"
    a6: "Il ne désactive jamais une alarme, ne déverrouille jamais une serrure et n'ouvre jamais une porte de garage, un portail ou une porte. Même pas en cas d'urgence."
    q7: "Que deviennent mes automatisations ?"
    a7: "HouseMind ne crée et ne supprime jamais d'automatisations, et ne touche pas à leurs appareils. Si tu mets une règle sur Autonome dans Cerveau sous ‘Prêt pour l'autonomie ?’, HouseMind désactive aussitôt l'automatisation qui la gère et le fait lui-même ; si elle fait plus, il demande d'abord. Quand tout ce qu'elle fait a assez souvent bien marché, HouseMind demande une fois dans Attend ta réponse ; après un oui, elle se désactive et HouseMind le fait lui-même. Si elle redescend sur Proposer ou Observer, l'automatisation se réactive aussitôt. Tu peux toujours revenir en arrière."
    q8: "HouseMind peut-il recharger la voiture ?"
    a8: "Non. HouseMind ne pilote pas la borne ni la batterie domestique. Dans l'onglet Énergie, tu vois quand même le niveau de la voiture et si elle charge. Demande par exemple à {name} « charge la voiture pour 7:00 », et elle te dit le moment le moins cher."
    q9: "Comment savoir si ça vaut le coup ?"
    a9: "Après les deux semaines de mesure, HouseMind compare chaque jour avec ce que ce jour aurait coûté sans HouseMind, en tenant compte du froid et du soleil. Tu le vois aussi quand le résultat est moins bon."
    q10: "Que sont les moments ?"
    a10: "Des moments comme cuisiner, dîner, un film ou la lecture, avec la lumière qui convient. Ouvre une pièce et touche un moment, ou dis-le. Règle la lumière comme tu l'aimes et touche ‘Retenir’ pour un moment à toi."
    q11: "Pourquoi HouseMind demande-t-il le soir s'il peut me réveiller ?"
    a11: "Tant que HouseMind apprend encore à te réveiller, il le demande la veille. Oui ne vaut que pour ce matin-là. Si tu éteins la lumière pendant le réveil, elle reste éteinte."
    q12: "Comment utiliser une tablette murale ?"
    a12: "Ouvre HouseMind sur la tablette et choisis la pièce dans Mes préférences › Cet appareil › Tablette murale. La tablette se réveille quand quelqu'un est là. ‘Plein écran’ cache la barre du navigateur ; ‘Arrêter la tablette murale’ remet tout comme avant."
    q13: "Que sont les domaines à l'essai ?"
    a13: "De nouveaux domaines : appareils ménagers, médias, ménage, jardin, et soins et bien-être. D'abord ils sont désactivés ; un administrateur les active dans Paramètres de la maison › Apprentissage et étapes › Domaines. Soins et bien-être seulement avec un oui de la personne concernée."
    q14: "Qu'est-ce que soins et bien-être ?"
    a14: "Quand la personne concernée est à la maison et que rien ne bouge longtemps, un contact choisi reçoit un seul message. Seulement avec l'accord de la personne concernée."
    q15: "Que fait HouseMind quand Home Assistant redémarre ?"
    a15: "HouseMind ne fait alors rien de nouveau pendant un moment et tu vois ‘Attention’. Il se reconnecte tout seul, puis vérifie que tout fonctionne encore. Ce qui ne fonctionne plus reçoit un message ; HouseMind se contente de l'observer jusqu'à ce que cela refonctionne."
    q16: "Qu'y a-t-il sous Tenir HouseMind à jour dans les paramètres de la maison ?"
    a16: "Trois choses : les mises à jour des connaissances (de nouvelles connaissances sur les appareils, les pays et les langues ; désactivables), si HouseMind peut lire l'agenda (seulement après un oui) et le bouton du paquet de diagnostic : un fichier sans noms à partager quand quelque chose ne va pas."
    q17: "Comment HouseMind gère-t-il les groupes de lampes ?"
    a17: "HouseMind commande de préférence un groupe dans le propre réseau des lampes : elles réagissent ensemble. Ensuite les groupes de Home Assistant, puis les lampes seules. Si une lampe est dans un tel groupe, le Journal, Ce que j'ai pensé et Prêt pour l'autonomie ? ne montrent que le groupe. Si une lampe a été réglée à la main, le groupe est laissé tranquille. Si une lampe est sur Laisser tranquille, HouseMind ne la commande jamais seule, mais son groupe l'emmène ; mets le groupe sur Laisser tranquille et tout ce qu'il contient reste immobile. En Expert : Cerveau › Appareils et entités, par Pièce ; les lampes d'un groupe y sont en retrait sous le groupe."
    q18: "Où vois-je où en est HouseMind ?"
    a18: "Dans Cerveau, sous ‘Prêt pour l'autonomie ?’, tu vois par domaine et par compétence dans une pièce l'étape, le score face à l'objectif et ce qu'il manque encore. Les domaines sont des tuiles : touche une tuile pour l'explication et les boutons de ce domaine, et la liste en dessous ne montre alors que lui. ‘Automatisations’ montre à quel point HouseMind est proche de reprendre ; sous ‘Plus’, il y a l'explication."
    q19: "Comment trouver vite une automatisation ou un appareil ?"
    a19: "Au-dessus des longues listes, il y a un champ de recherche et ‘Filtrer’ : coche par thème ce que tu veux voir ; ‘Tout effacer’ retire tes choix. Dans Cerveau › Ce que je sais, tu trouves aussi les ‘Scènes et scripts’ de Home Assistant, à consulter."
    q20: "HouseMind apprend-il aussi de ce qui s'est déjà passé ?"
    a20: "Oui. Après ton oui à l'apprentissage, HouseMind lit une fois ce que Home Assistant a gardé, en général 10 jours. Tout reste dans la maison et amène quelque chose au plus jusqu'à Proposer. Dans les Paramètres de la maison, tu trouves ‘Apprendre aussi de l'historique de Home Assistant’ et ‘Relire’."
    q21: "Quand fait-il assez sombre pour la lumière ?"
    a21: "HouseMind l'apprend pièce par pièce de vous : à quelle hauteur du soleil, ou avec combien de lumière, allumez-vous en entrant ? Quand les rideaux se ferment le soir, il l'apprend aussi pièce par pièce."
    q22: "Combien de questions {name} pose-t-elle ?"
    a22: "Toutes les questions ensemble : en Informé une par jour au maximum, en Impliqué trois, en Expert tu le choisis dans Mes préférences (cinq sinon). Le reste attend dans le Journal. Après ‘Pas maintenant’, une question revient plus tard, après ‘Jamais’ plus du tout."
    q23: "Des personnes sans téléphone vivent ici, comme des enfants."
    a23: "Active-le dans Paramètres de la maison › Maison. Alors tout le monde n'est absent que si les capteurs de la maison sont calmes aussi. Indique aussi leurs prénoms : HouseMind ne s'en sert que pour les retirer à l'IA."
    q24: "Pourquoi HouseMind ne fait-il plus quelque chose lui-même ?"
    a24: "Si quelqu'un remet quelque chose comme avant deux fois en une semaine, ou dit non deux fois, HouseMind y recule d'une étape et les administrateurs reçoivent un message. Ensuite, il regagne l'étape ; ‘Prêt pour l'autonomie ?’ montre où il en est."
    q25: "Puis-je fixer une étape moi-même, ou faire oublier quelque chose ?"
    a25: "Oui, en tant qu'administrateur. Sur ‘Prêt pour l'autonomie ?’, touche la tuile d'un domaine : la carte en dessous a ‘Fixer une étape toi-même’. Ce que la sécurité n'autorise pas est grisé. ‘Oublie ça’ efface ce que HouseMind a appris sur une compétence dans une pièce. Tu confirmes toujours par oui ou non."
    q26: "Quelle langue parle {name} ?"
    a26: "Dans l'app, elle parle ta langue, que tu choisis dans Mes préférences. Sur les enceintes, la tablette murale et dans Assist, elle parle la langue de la maison ; un administrateur la choisit dans Paramètres de la maison › {name} › Langue de la maison."
    q27: "Comment lire le plan d'énergie ?"
    a27: "Dans Énergie se trouve ‘Plan pour les prochaines heures’. En haut le prix : bleu est négatif, orange est cher. Au-dessus de la ligne ce qui entre, en dessous où ça va. En bas, ce que fait HouseMind par appareil. Touche le graphique ou un bloc pour les détails."
    q28: "Que fait le Check-up ?"
    a28: "HouseMind vérifie chaque heure ce qui est cassé dans Home Assistant, aussi les sauvegardes et le disque. L'important arrive tout de suite comme message ; ‘Voir’ montre ce que c'est. Toute la page Check-up est dans le menu en Expert."
    q29: "Un bouton ou un interrupteur mural compte-t-il comme une automatisation ?"
    a29: "Non. Une automatisation qui ne fait que transmettre ce que vous faites vous-mêmes est votre propre main : un interrupteur mural, une télécommande ou un bouton dans l'app qui allume, éteint ou bascule des lampes ou des interrupteurs, ou fait varier la lumière. HouseMind commande aussi ces lampes et ne demande jamais à la désactiver ; le bouton continue de marcher. Ce qu'elle fait compte comme ce que vous avez fait, donc HouseMind laisse ensuite la lampe tranquille un moment. HouseMind ne bascule jamais l'interrupteur lui-même."
    q30: "Que vois-je sous Réseau ?"
    a30: "Sous Maison › Pièces, choisis ‘Réseau’. {name} est au milieu, avec son mot en dessous ; autour d'elle, les pièces, avec leurs appareils en petits points. Quand HouseMind fait quelque chose, une ligne circule vingt secondes de la pièce à l'appareil en passant par {name} : ‘circule maintenant’. En dessous reste ce qu'il a fait en dernier, avec l'heure et ‘Pourquoi ?’. Quand HouseMind demande quelque chose, une ligne pointillée reste tant que la question est ouverte : ‘t'attend’. En dessous, la question avec ‘Fais-le’ et ‘Pas maintenant’. Si l'IA est activée, tu vois un anneau en pointillés autour de {name} : l'IA réfléchit avec, mais ne décide jamais."
    q31: "Comment HouseMind sait-il si c'est le matin, le soir ou la nuit ?"
    a31: "D'après votre propre rythme, pas d'après l'horloge. C'est la nuit dès que la maison dort ; si quelqu'un est encore debout, deux heures après votre heure de coucher habituelle. Le matin commence quand la maison se réveille, le soir quand vous rentrez d'habitude. La lumière en entrant et le salut de {name} s'y adaptent. Dans une chambre, aucune lampe ne s'allume d'elle-même à partir de l'heure de coucher habituelle. Si HouseMind ne connaît pas encore une heure, il regarde l'horloge. Dans Cerveau, sous l'onglet Rythme, la première ligne dit ce que c'est maintenant. Sous les barres se trouve ‘À venir’ : ce que HouseMind fera aux prochains moments de la journée, par exemple quand la nuit tombe ou que la maison va dormir."
    q32: "Quand HouseMind fait-il quelque chose lui-même désormais ?"
    a32: "Quand cela a assez souvent bien marché : par défaut 85 fois sur 100, vu 10 fois, sur au moins une semaine. Une question se trouve alors dans ‘Attend ta réponse’ et n'expire pas : ‘Oui, désormais’, ‘Pas encore’ ou ‘Jamais’. Un oui suffit. Si une automatisation le gère, seul un administrateur reçoit la question, et après un oui elle se désactive. Si quelqu'un le remet comme avant deux fois en une semaine, HouseMind demande de nouveau d'abord et l'automatisation se réactive."
    q33: "La lumière de l'alarme ou de la sonnette bloque-t-elle une pièce ?"
    a33: "Non. Une telle automatisation donne un signal : une couleur ou un clignotement qui ne démarre pas à cause de quelqu'un dans la pièce, d'une porte, du soleil ou de l'heure. Elle reste active, ne bloque rien et HouseMind n'en apprend rien. Tant que le signal dure, HouseMind ne touche pas à la lampe. Si la lampe reste allumée ensuite, comme quand une alarme se déclenche, jusqu'à ce que cette lampe change. Une automatisation qui ne commande que des lampes suit dans la question dès que leurs règles sont prouvées. Si elle fait plus, par exemple aussi une prise, elle reste active et ne garde que sa propre lampe."
    q34: "Quand les rideaux de la chambre s’ouvrent-ils ?"
    a34: "Quand tu es levé, que plus personne ne dort dans cette pièce et qu’il fait jour dehors. Si un capteur voit qui est au lit ou dans la pièce, HouseMind attend qu’il soit vide depuis quelques minutes. Sans un tel capteur, il ne les ouvre que quand tout le monde est sorti, ou à un moment appris de vous. Dans une pièce où personne n’a dormi cette nuit, ils s’ouvrent avec le reste de la maison."
    q35: "J'ai ajouté un appareil. Reçoit-il des règles tout seul ?"
    a35: "Oui. Quand tu mets un appareil dans une pièce dans Home Assistant, les règles qui vont avec sont tout de suite dans ‘Prêt pour l'autonomie ?’, avec ‘Pas encore vu’. Une règle pour l'humidité ou le CO₂ ne vient que si la pièce a aussi ce capteur. Si HouseMind ne connaît pas le type de pièce, il demande une fois quel type de pièce c'est ; d'ici là, la pièce reçoit les règles qui vont partout. Quand tu retires un appareil, sa règle disparaît. Ce que HouseMind a appris pour elle, il le garde 30 jours, au cas où un appareil revient."
  l4:
    q1: "Qu'est-ce que la trace des décisions ?"
    a1: "Pour chaque décision, tu vois le contexte, la compétence, les comptages et la certitude, les six contrôles de la barrière de sécurité et le résultat. Dans Cerveau, sous Plus › Fil des décisions. La décision s'affiche comme un flux : la source, ce que j'ai vu, ce que j'ai pensé et le résultat, avec en dessous les six étapes de la porte : réussie, où elle s'est arrêtée, ou pas atteinte. Au-dessus deux voies, le cœur et la voie IA, et aujourd'hui de la source au résultat."
    q2: "Qu'est-ce que le fil des pensées ?"
    a2: "Tout ce que HouseMind a envisagé, même ce qu'il n'a pas fait, et pourquoi. Dans Cerveau, sous Plus › Flux de pensées."
    q3: "Comment fonctionne l'apprentissage ?"
    a3: "Pour chaque compétence, pièce et demi-heure, HouseMind compte ce que font les gens ; après 14 jours, une chose compte encore à moitié. Prouvé, c'est 10 situations et 85 % de juste, sur au moins une semaine : HouseMind demande alors une fois s'il peut le faire lui-même désormais, et un oui suffit. Par les réponses, c'est possible aussi : 15 réponses et 90 % de oui, sur au moins une semaine. Deux corrections ou deux non en une semaine : une étape en arrière."
    q4: "Que vérifie la barrière de sécurité ?"
    a4: "Réel et valide ; autorisé, y compris les limites strictes dans le code ; permis maintenant (pause, les personnes ont la priorité, autre système, règles de la maison) ; l'étape ; raisonnable (limites de commutation, batteries) ; et fait (Home Assistant confirme)."
    q5: "Appareils et entités"
    a5: "Pour chaque entité, tu vois ce que HouseMind a reconnu et son étape la plus haute. Un administrateur peut choisir ‘Laisser tranquille’. Tu les trouves dans Cerveau, sous l'onglet Appareils. HouseMind utilise les étiquettes de Home Assistant seulement comme indice."
    q6: "IA"
    a6: "Facultative. Les questions passent par un filtre de confidentialité avec des noms neutres. L'IA peut seulement proposer, jamais agir. Les administrateurs voient exactement ce qui a été envoyé. Chaque question dit sous quelle forme la réponse doit venir ; si le service le permet, l'IA ne peut pas répondre autrement. Ce qui ne convient pas ne compte pas. En Expert, dans le bloc IA, tu choisis un modèle par tâche et tu vois ce que chaque tâche a coûté. L'IA peut aussi aider à comprendre ta maison : dans Cerveau › Ce que je sais, tu vois ce qu'elle pense et tu le changes, même après C'est juste. Ce n'est qu'après C'est juste que HouseMind propose ou fait quelque chose avec. Même sans IA, HouseMind déduit des choses du comportement et demande là où les règles ne sont pas sûres. En Informé, {name} pose au plus une question par jour à ce sujet, avec C'est juste et Pas juste. Quelque chose d'important, {name} le dit toujours avec les mots de HouseMind, sans IA. Tu peux aussi choisir l'IA de Home Assistant, la tâche IA déjà configurée là-bas : HouseMind ne garde alors aucune clé. Si cette IA fonctionne dans la maison, il n'y a pas de budget ; dans le cloud, au plus 100 questions par jour. On y voit aussi ce qu'est chaque entité ; tu le confirmes par appareil en une fois."
    q7: "Comment le plan d'énergie calcule-t-il ?"
    a7: "Par quart d'heure sur 36 heures : le chauffe-eau plus chaud quand c'est bon marché ou ensoleillé, la maison préchauffée avant un pic cher si cela rapporte vraiment, et un appareil au moment le moins cher. La batterie domestique et la voiture n'y sont pas."
    q8: "Comment fonctionne l'intégration avec Home Assistant ?"
    a8: "En tant qu'administrateur, touche ‘Lier’ dans Paramètres de la maison › Entretien et vie privée : HouseMind prépare l'intégration, redémarre Home Assistant si nécessaire et termine tout seul. Ensuite l'état et un interrupteur de pause sont dans Home Assistant. Tout passe par la même barrière de sécurité."
    q9: "HouseMind dans Assist"
    a9: "Choisis HouseMind comme agent de conversation et active ‘Traiter les commandes localement en priorité’. HouseMind répond lui-même aux questions sur la maison. Les autres questions seulement si un administrateur l'autorise, et alors seule la question est transmise."
    q10: "Comment HouseMind apprend-il le rythme ?"
    a10: "À partir du mode de la maison : quand la maison s'endort, se réveille, se vide et est de nouveau habitée, par type de jour. Une heure ne compte qu'après au moins trois jours proches les uns des autres. Dans Cerveau, tu le vois sous l'onglet Rythme. Tu y vois aussi, par pièce, ce que HouseMind a appris. Avec l'IA, celle-ci en fait une petite histoire une fois par jour ; les heures et les chiffres viennent de HouseMind lui-même."
    q11: "Mises à jour des connaissances"
    a11: "HouseMind peut récupérer chaque jour de nouvelles connaissances : types d'appareils, pays et langues. Seul un paquet à la signature correcte est utilisé ; le précédent est conservé. Tu peux désactiver cela dans les paramètres de la maison."
    q13: "Le paquet de diagnostic"
    a13: "Un bouton dans les paramètres de la maison crée un fichier à partager quand quelque chose ne va pas : versions, nombres et derniers avertissements, chaque nom remplacé par une étiquette neutre."
    q14: "Autocontrôle et versions testées"
    a14: "Après chaque démarrage de Home Assistant, HouseMind vérifie que ce qu'il utilise est toujours là. Si Home Assistant est plus récent que testé, il demande d'abord pendant un jour pour les appareils sensibles. Si l'installation n'est pas prise en charge ou pas saine, les administrateurs reçoivent un seul message calme."
    q15: "Où vois-je où en est HouseMind ?"
    a15: "Dans Cerveau, sous ‘Prêt pour l'autonomie ?’, Expert montre aussi les chiffres : score, certitude, juste, autrement et remis. Sous la phrase sur ce que fait HouseMind, il dit exactement pourquoi : les capteurs, les seuils, la source et sa certitude. La limite est dans les Paramètres de la maison."
    q16: "Comment trouver vite une automatisation ou un appareil ?"
    a16: "Au-dessus des longues listes, il y a un champ de recherche et ‘Filtrer’ : coche ce que tu veux voir ; ‘Tout effacer’ retire tes choix. Avec ‘Regrouper’, tu classes la liste par pièce, type ou étape. Dans les Paramètres de la maison, tu trouves aussi les ‘Scènes et scripts’ de Home Assistant, à consulter."
    q17: "Comment faire mon propre jeu de couleurs ?"
    a17: "Mets un fichier dans /config/housemind/themes/. Copie le ‘Fichier d'exemple’ de Paramètres de la maison › Entretien et vie privée › Jeux de couleurs et donne-lui son propre id, un nom et des couleurs. En une minute, il est dans la liste s'il est bien lisible ; sinon, il y est dit pourquoi."
    q18: "HouseMind apprend-il aussi de ce qui s'est déjà passé ?"
    a18: "Oui. Après ton oui à l'apprentissage, HouseMind lit une fois ce que Home Assistant a gardé, en général 10 jours. Tout reste dans la maison et amène quelque chose au plus jusqu'à Proposer. Dans les Paramètres de la maison, tu trouves ‘Apprendre aussi de l'historique de Home Assistant’ et ‘Relire’."
    q19: "Comment HouseMind compte-t-il ‘sombre’ et les rideaux ?"
    a19: "À chaque entrée sans lumière, HouseMind note la hauteur du soleil, les lux et si une lampe s'est allumée dans les 3 minutes. Après 6 fois, la meilleure mesure décide ; d'ici là, lux sous 40 ou soleil sous 3°. Rideaux : la hauteur du soleil à laquelle ils se ferment d'habitude dans cette pièce."
    q20: "Seuils, un jour précédent et ce que HouseMind ferait maintenant"
    a20: "Dans Cerveau › Prêt pour l'autonomie ?, la carte d'un domaine a les Seuils : tu y choisis quand une étape peut aller plus loin ; ‘Standard’ les remet. ‘Revenir à un jour précédent’, dans Paramètres de la maison › Recommencer, ramène ce que HouseMind savait à l'un des 7 derniers jours. Ce que HouseMind ferait maintenant dans chaque pièce, tu le vois dans ‘Tester la maison’, sans rien commander ; ce qu'il fera ensuite, dans Cerveau › Rythme, sous ‘À venir’."
    q21: "Enregistrer et relire les réglages"
    a21: "Dans Paramètres de la maison › Entretien et vie privée, tu enregistres les réglages dans un fichier lisible, sans conversations, journal, personnes ni clés. Quand tu le relis, tu vois d'abord ce qui change ; cela ne se fait qu'après un oui. Un fichier ne rend jamais la sécurité plus souple."
    q22: "Le lien avec Home Assistant ne fonctionne pas"
    a22: "Dans Paramètres de la maison › Entretien et vie privée, à ‘HouseMind dans Home Assistant’, touche ‘Lier’. HouseMind termine le lien tout seul et redémarre Home Assistant si nécessaire. Si ça ne marche pas, tu vois trois étapes et ‘Ouvrir dans Home Assistant’."
    q23: "Comment supprimer HouseMind ?"
    a23: "Va dans Paramètres de la maison › Recommencer › Supprimer HouseMind et touche ‘Tout rendre’. Les automatisations que HouseMind avait désactivées sont réactivées et le lien dans Home Assistant disparaît. Supprime ensuite l'App dans Home Assistant. Les réactions d'urgence fonctionnent jusque-là."
    q24: "Que fait le Check-up ?"
    a24: "Dans le menu, au Check-up, HouseMind vérifie chaque heure ce qui est cassé, aussi les sauvegardes et le disque ; ‘Vérifier maintenant’ vérifie tout de suite. Il n'efface jamais rien ; il désactive seulement après ton oui, avec ‘Réactiver’. ‘Éteint exprès’, ‘Laisser ainsi’, ‘Pas un doublon’ et ‘Garder exprès’ arrêtent une question. L'important arrive tout de suite, avec ‘Voir’."
    q25: "Puis-je désactiver que {name} ouvre elle-même sa fenêtre ?"
    a25: "Oui, pour toute la maison. Un administrateur le désactive dans Paramètres de la maison, dans le groupe {name}. Sa question ne s'ouvre alors plus pour personne et attend dans le Journal. Touche {name} ou ‘Demander à {name}’, et elle la pose quand même. Il n'y a plus de choix personnel."
    q26: "Que vois-je sous Réseau ?"
    a26: "En Expert, Maison › Pièces s'ouvre sur ‘Réseau’. {name} est au milieu, avec son mot en dessous ; autour d'elle, les pièces, avec leurs appareils en petits points. Quand HouseMind fait quelque chose, une ligne circule vingt secondes de la pièce à l'appareil en passant par {name} : ‘circule maintenant’. En dessous reste ce qu'il a fait en dernier, avec l'heure et ‘Pourquoi ?’. Quand HouseMind demande quelque chose, une ligne pointillée reste tant que la question est ouverte : ‘t'attend’. En dessous, la question avec ‘Fais-le’ et ‘Pas maintenant’. Si l'IA est activée, tu vois un anneau en pointillés autour de {name} : l'IA réfléchit avec, mais ne décide jamais. Pointe un point pour voir de quel appareil il s'agit ; un groupe, comme dans Appareils, est un seul point pour tous ses appareils."
    q27: "Comment tester HouseMind dans ma propre maison ?"  # Test het huis (E-474)
    a27: "En tant qu'administrateur en Expert, touche la fiole en haut à droite, ‘Tester la maison’ ; sur un téléphone, c'est l'onglet ‘Tester’. Choisis une pièce, et sous ‘Rejouer’ ce qui se passe, par exemple quelqu'un qui entre dans le noir, ou le soir. HouseMind montre alors ce qu'il ferait, et pour chaque ligne comment cela irait pour de vrai : le faire lui-même, demander d'abord, seulement observer, ou non et pourquoi. Rien n'est encore commandé. Avec ‘Le faire pour de vrai’, HouseMind le fait vraiment dans ta maison : la lampe s'allume, le rideau se ferme, et la ligne circule dans le réseau. Après une minute, il remet tout, sauf si tu choisis ‘Laisser ainsi’ ; avec ‘Remettre’, c'est tout de suite. Si une règle de la maison dit non, si une automatisation pilote l'appareil, ou si cela ne peut pas revenir, le test ne le fait pas, et la raison est indiquée. Le soir apporte la lumière de ce soir-là : en novembre, il fait nuit. Avec ‘Fais le tour toi-même’, un domaine passe un moment en Autonome avec les vrais capteurs, et tu traverses toi-même la pièce. Sous ‘Ce qui vient de se passer’, tu vois ce que HouseMind a décidé, quel contrôle a dit non, et à quelle vitesse. Ce que tu testes ne compte pas pour l'apprentissage. S'il est dit que quelqu'un a utilisé l'appareil à la main, quelqu'un vient de le faire lui-même ; une courte absence du réseau ne compte pas."
    q28: "Comment régler les niveaux d’une lampe ?"  # Standen voor lampen (E-490)
    a28: "Chaque lampe varie autrement : 40 % est encore fort sur une lampe et déjà pénombre sur une autre. C’est pourquoi chaque lampe a quatre niveaux : Tamisé, Normal, Vif et Maximal. En tant qu’administrateur en Expert, ouvre dans Cerveau l’onglet Appareils et entités, et touche ‘Niveaux’ à côté d’une lampe. Règle chaque niveau sur le pourcentage qui convient à cette lampe, et choisis sa couleur : elle suit le rythme du jour, ou tu la fixes, du chaud au blanc. Avec ‘Essayer’, la lampe elle-même passe à ce niveau ; ‘Montrer les quatre’ les parcourt. Tant que la fenêtre est ouverte, HouseMind laisse la lampe tranquille. Avec ‘Terminé’ ou quand tu fermes la fenêtre, elle est de nouveau comme elle était. Touche ‘Enregistrer’ : cela ne vaut que pour cette lampe. Avec ‘Essayer un niveau’ à côté d’une pièce, tu vois si toutes les lampes y vont ensemble. HouseMind parle ensuite en niveaux : ‘Puis-je mettre la salle à manger sur Tamisé ?’"

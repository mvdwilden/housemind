privacy:
  speech_cloud: "En ce moment, ta voix part dans le cloud, via {engines}. Choisis dans Paramètres de la maison › {name} une voix et une reconnaissance vocale qui fonctionnent dans la maison si tu ne le veux pas."
  speech_local: "En ce moment, ta voix reste dans la maison : {name} entend et parle avec des services qui tournent dans ton propre Home Assistant."
  title: "Déclaration de confidentialité"
  intro: "HouseMind fonctionne entièrement dans ton propre Home Assistant. Ce qu'il apprend et garde reste chez toi. Quelque chose ne sort que si un administrateur dit oui, ou si tu veux un message sur ton téléphone."
  stored_title: "Ce que HouseMind garde, et combien de temps"
  stored: "- Ce qui se passe à la maison : lumières, rideaux, chauffage, qui est là, et ce que HouseMind a fait et pourquoi. Cela reste 30 jours. Ensuite, il ne reste que des résumés, comme les habitudes apprises et les totaux du jour.\n- Tes conversations avec HouseMind, tapées ou via l'assistant vocal, sous forme de texte. Jamais d'enregistrements. Aussi 30 jours.\n- Ce que HouseMind a appris, tes règles de la maison, tes moments, réglages et préférences : jusqu'à ce que tu les supprimes.\n- Messages et propositions : un message d'information quitte la liste après une semaine, les messages réglés sont effacés après 30 jours et les propositions après 90 jours. Les rapports de la semaine et les totaux d'énergie restent 2 ans.\n- Une clé pour un service d'IA est gardée chiffrée dans le stockage propre de l'App. Ce qui l'ouvre s'y trouve aussi : qui a ce stockage ou une sauvegarde peut la lire. Elle n'apparaît jamais dans un journal ni dans le paquet de diagnostic.\nTout se trouve dans le stockage propre de l'App dans Home Assistant et fait partie des sauvegardes de Home Assistant."
  out_title: "Ce qui sort, et pourquoi"
  out: "- Par défaut, seulement les mises à jour de connaissances ci-dessous ; rien sur ta maison ne part avec. Pour le reste, HouseMind fonctionne sans internet.\n- L'IA, seulement si un administrateur l'active et donne son accord : une courte question avec des noms neutres, comme 'lampe 3' ou 'chambre 2'. Pour comprendre ta maison, aussi le type, la marque et le modèle d'un appareil, comment l'intégration nomme elle-même une entité (comme 'Child Lock' ; jamais un nom que vous avez donné), et le nom d'une pièce sans noms de personnes. Pour une question à {name}, l'IA peut aussi consulter l'état d'une pièce, ce que HouseMind a fait et pourquoi, et un résumé de 7 jours au plus, toujours avec des noms neutres. Jamais de noms de personnes, ton adresse, ta position, le contenu de ton agenda ou du son. Seule l'IA de Home Assistant dans la maison peut décrire une image de caméra, si un administrateur l'active ; l'image reste dans la maison. Le service d'IA choisi traite la question selon ses propres conditions. Au niveau Expert, tu vois chaque question envoyée.\n- Transmettre dans l'assistant vocal, seulement avec accord : une question à laquelle HouseMind ne sait pas répondre va à l'IA ou à l'assistant choisi par l'administrateur.\n- Mises à jour des connaissances : HouseMind récupère de nouvelles connaissances sur les types d'appareils, les pays et les langues. Rien sur ta maison ne part avec. Un administrateur peut désactiver cela.\n- Les messages sur ton téléphone passent par les notifications de Home Assistant. Le texte passe alors par le service de notifications de ton téléphone.\n- Parole : ce que tu dis à {name} et ce qu'elle dit passe par l'assistant vocal de Home Assistant. S'il utilise un service cloud, ta voix va à ce service ; HouseMind te le dit quand c'est le cas. Avec Piper, Whisper ou un autre service vocal local, tout reste dans la maison.\n- L'agenda : HouseMind ne lit l'agenda de Home Assistant qu'après un oui d'un administrateur, pour le rappel des poubelles, le briefing du matin et les jours différents. Ce qu'il contient reste dans la maison.\n- Le paquet de diagnostic ne part que si tu le partages toi-même. Les noms et les appareils y sont remplacés par des étiquettes neutres."
  see_title: "Qui voit quoi"
  see: "- Chaque habitant choisit son propre niveau. Plus le niveau est élevé, plus il y a de détails, comme la trace des décisions au niveau Expert.\n- Les paramètres de la maison, l'IA et le paquet de diagnostic sont réservés aux administrateurs de Home Assistant.\n- HouseMind ne regarde ni n'écoute par des caméras ou des micros. Seulement si un administrateur l'active et que l'IA de Home Assistant fonctionne dans la maison, cette IA décrit dans un message ce qu'on voit sur l'image ; l'image reste dans la maison.\n- Invités, baby-sitter et autres personnes dans la maison : dis-le-leur. HouseMind voit les mouvements et la présence par pièce, pas les noms ; le mode invités en tient compte. N'oriente pas les caméras vers la rue ou les voisins : HouseMind ne garde jamais d'images, mais la caméra les enregistre."
  rights_title: "Ce que tu peux faire toi-même"
  rights: "- Voir ce que HouseMind a fait et pourquoi : touche Pourquoi ? à côté d'une action.\n- Remettre quelque chose comme avant : touche Annuler, ou remets-le simplement toi-même.\n- Désactiver l'apprentissage dans les paramètres de la maison. HouseMind ne réagit alors plus qu'aux urgences et envoie des messages.\n- Tout rendre, dans les paramètres de la maison : HouseMind rallume les automatisations qu'il a reprises et revient à la seule observation.\n- Tout effacer : Paramètres de la maison → Recommencer → Retour aux réglages d'usine. Ou supprime l'App dans Home Assistant. Tout ce que HouseMind gardait disparaît alors."
  contact: "Des questions sur la confidentialité ? Pose-les sur la page du projet HouseMind."


    leave:
      title: "Tout le monde part"
      what: "Quelqu'un est assis dans une pièce, la lampe allumée. Puis tout le monde sort."
      expect: "Après dix minutes, HouseMind sait qu'il n'y a personne. Une lampe encore allumée s'éteint. Le chauffage reste tel quel pendant les premières 24 heures."
    away_long:
      title: "Longtemps absent"
      what: "Tout le monde part et reste absent plus d'un jour. Les habitants ne reviennent que lorsque vous choisissez « Tout le monde à la maison »."
      expect: "Après un jour, HouseMind demande si vous êtes en vacances. Le chauffage baisse de 3 degrés, pas en dessous de 15 °C."
    wake:
      title: "Se réveiller"
      what: "C'est tôt le matin. Les habitants se lèvent : lumière dans la chambre, douche, en bas."
      expect: "De la lumière là où quelqu'un entre tant qu'il fait nuit. Après un moment, HouseMind sait quand vous vous levez ; alors il rend la chambre claire et chaude."
    shower:
      title: "Une douche"
      what: "Quelqu'un prend une douche. La salle de bain devient humide, puis sèche à nouveau."
      expect: "Le ventilateur s'allume quand il fait humide, et s'éteint quand c'est sec."
    window:
      title: "Fenêtre ouverte"
      what: "Dans une pièce chauffée, une fenêtre reste ouverte dix minutes. Puis elle se referme."
      expect: "Tant que la fenêtre est ouverte, le chauffage de cette pièce baisse. Ensuite il revient."
    guests:
      title: "Des invités"
      what: "Aucun habitant n'est à la maison, mais quelqu'un entre quand même, comme une baby-sitter ou des invités."
      expect: "Après quelques minutes, HouseMind pense qu'il y a des invités et demande si c'est bien le cas. Il n'apprend rien d'une journée avec des invités."
    smoke:
      title: "Fumée"
      what: "Un détecteur de fumée sonne."
      expect: "Tout de suite un message d'urgence, toutes les lampes à fond pour voir le chemin, et la ventilation éteinte. Les serrures ne s'ouvrent jamais d'elles-mêmes. Choisissez ensuite « Tout est de nouveau sûr »."
    leak:
      title: "Fuite d'eau"
      what: "Un détecteur de fuite est mouillé."
      expect: "Tout de suite un message. Si la maison a un robinet principal, il se ferme. Choisissez ensuite « Tout est de nouveau sûr »."
    frost:
      title: "Gel"
      what: "Un détecteur de gel mesure un risque de gel."
      expect: "Un message, et le chauffage de cette pièce monte à au moins 8 °C s'il y en a un. Sinon la maison continue normalement."
    burglar:
      title: "Alarme intrusion"
      what: "Tout le monde est parti et l'alarme est activée. Puis l'alarme se déclenche."
      expect: "Un message d'urgence et toutes les lampes allumées. Seuls les rideaux choisis par un administrateur s'ouvrent ; par défaut, rien."
    price_negative:
      title: "Prix négatif de l'électricité"
      what: "Pendant les deux prochaines heures, l'électricité coûte moins que rien."
      expect: "HouseMind fait un nouveau plan d'énergie et déplace le chauffage et les appareils vers ces heures. Vous le voyez dans Énergie. Les deux premières semaines, HouseMind mesure seulement et montre ce qu'il ferait."
    sun_full:
      title: "Plein soleil sur les panneaux"
      what: "Vers midi, le soleil brille pleinement sur les panneaux solaires."
      expect: "Il arrive plus d'électricité que la maison n'en utilise. Dans Énergie, vous voyez le surplus. Si la maison a une batterie, une voiture ou un chauffe-eau, HouseMind l'utilise pour cela ; les deux premières semaines, il montre seulement ce qu'il ferait."
    update:
      title: "Après une mise à jour"
      what: "Home Assistant reçoit une mise à jour. Ensuite, une intégration ne démarre plus et une lampe disparaît un moment."
      expect: "Dans le Check-up (dans le menu en Expert), à ‘Après la dernière mise à jour’, tu vois après 30 minutes ce qui ne marche plus depuis. Ce qui a disparu un moment et remarche s’ajoute après 2 heures."

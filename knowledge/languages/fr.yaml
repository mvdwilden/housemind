      sleep: "La maison dort."
      woke: "C'est là que la maison s'est réveillée."
      rhythm: "C'est ainsi que ça se passe ici d'habitude."
      late: "Bien après l'heure du coucher habituelle : alors c'est la nuit quand même."
      clock: "D'après l'horloge : je ne connais pas encore cette partie de votre rythme."

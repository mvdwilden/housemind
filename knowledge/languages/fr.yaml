# Quand je fais quoi (E-385 – E-387) : par compétence dans une pièce une phrase, par étape ses
# propres mots – do : Autonome « J’allume … », ask : Proposer « Je demande si … », would :
# Observer « J’allumerais … ». brain/when.py remplit les places et ajoute une règle de la maison,
# une limite fixe ou ce qui n’est pas encore connu, et un point.
# Niveaux des lampes (E-490 – E-496, design 73) : comment le cerveau les nomme.

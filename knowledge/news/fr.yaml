# Quoi de neuf, par version (E-150) : une phrase pour Informé, une courte liste pour Impliqué et
# Expert. Langage simple, sans noms de marques.
"0.4.5":
  one: "Températures par pièce, et une question une seule fois."
  list:
    - "Sur un thermostat, tu choisis maintenant toi-même la température pour À la maison, Sommeil et Absent, par demi-degrés : dans Cerveau › Appareils › Températures. Avec ‘Seulement après’, tu choisis combien de temps tout le monde doit être parti avant de passer à Absent."
    - "Si tu commandes une lampe toi-même, avec un interrupteur ou dans l'app, cela reste une demi-heure au plus. Ensuite HouseMind reprend la main, aussi pour la couleur et la luminosité."
    - "Une question reçoit une seule réponse : dès que quelqu'un répond, elle disparaît partout, aussi des téléphones des autres. Un ancien bouton ne fait plus rien ensuite."
    - "Un non à la question de savoir si l'alarme peut désormais s'activer seule, et un non à l'attention, sont gardés : cette question ne revient pas."
"0.4.4":
  one: "HouseMind a tes lampes pour lui seul."
  list:
    - "Quand une règle de lumière d'une pièce est en Autonome, HouseMind fait aussi lui-même le rythme du jour de ces lampes, avec leurs niveaux. Adaptive Lighting ne les pilote plus."
    - "Tant que tu règles les niveaux d'une lampe, Adaptive Lighting se repose pour cette lampe. Toi seul la pilotes alors ; après Terminé, le groupe pilote de nouveau."
    - "Dans Ce que je sais, tu choisis ce que commande un interrupteur : une lampe, un appareil ou un autre appareil. Les interrupteurs devenus lampe par une étiquette y sont maintenant aussi."
    - "La fenêtre Niveaux dit en haut, en bref, d'où viennent les valeurs et la couleur, et un seul Enregistrer garde tout : les niveaux et le délai."
    - "Plus de bêta : HouseMind est gratuit à installer et à utiliser. Le code est ouvert à la lecture, mais pas à la modification ni à la transmission. La liste des changements commence à 0.4.0."
"0.4.3":
  one: "La mise à jour garde tout ce que HouseMind sait."
  list:
    - "Une mise à jour par Home Assistant garde tout : ce que HouseMind a appris, tes réglages, niveaux et délais. La configuration et la présentation ne reviennent pas ; tu ne vois que ce message."
    - "Le manuel explique comment mettre à jour, et qu'il ne faut jamais supprimer HouseMind pour cela : le supprimer efface tout."
    - "Un nouveau test vérifie à chaque version qu'une mise à jour n'oublie rien."
"0.4.2":
  one: "Choisis pour chaque lampe au bout de combien de minutes elle s'éteint, et les niveaux passent d'abord."
  list:
    - "Pour chaque lampe, un curseur choisit au bout de combien de minutes elle s'éteint quand il n'y a plus personne : de tout de suite à 30 minutes. Si tu ne choisis rien, HouseMind l'apprend comme toujours."
    - "Une lampe avec des niveaux reçoit toujours l'un de ses quatre niveaux, avec la luminosité et la couleur que tu as enregistrées. Si Tamisé est violet, la veilleuse est violette."
    - "Le rythme du jour ne choisit lui aussi qu'un niveau pour une telle lampe : elle change par paliers."
    - "Juste avant de s'éteindre, une telle lampe baisse un instant dans la couleur de Tamisé. Si tu reviens, elle retrouve sa lumière et sa couleur."
"0.4.1":
  one: "HouseMind 0.4.1 est testé avec Home Assistant 2026.11."
  list:
    - "Sur Home Assistant 2026.11, HouseMind n'est plus particulièrement prudent : il refait lui-même ce qu'il a le droit de faire, sans demander d'abord."
    - "Les tests avec un vrai Home Assistant tournent maintenant sur GitHub à chaque version : avec 2026.4, avec la version de ce mois et avec la bêta du mois prochain."
    - "Le manuel cite les versions testées : 2026.4, 2026.10 et 2026.11."
"0.4.0":
  one: "HouseMind 0.4.0 est prêt à devenir la première bêta publique."
  list:
    - "Bientôt, chacun pourra installer HouseMind depuis GitHub, avec des paquets prêts et signés pour les ordinateurs ordinaires et pour ARM, comme un Raspberry Pi."
    - "Tant que c'est une bêta, l'App apparaît comme expérimentale dans Home Assistant."
    - "Une nouvelle page d'accueil et un résumé court et honnête de la façon dont HouseMind est testé."
    - "Une nouvelle installation crée sa base de données en une étape ; une installation à partir de 0.2.0 suit simplement."
"0.3.33":
  one: "Une règle pour les mots, les nombres et les noms, dans chaque langue."
  list:
    - "Un accent dans un nom ne change plus rien : un relais « Garáge deur » est aussi protégé que « Garagedeur »."
    - "Un mot court ne compte que comme mot entier – « car » n'est jamais « carbon » – et « portail2 » est tout simplement un portail."
    - "HouseMind écrit les nombres et les tailles avec le séparateur décimal de ta langue, même dans ton propre fichier de langue."
    - "L'écran Énergie lit les chiffres du jour et l'économie une fois par quart d'heure, pas à chaque mise à jour."
"0.3.32":
  one: "La carte du matin et la tablette murale suivent le rythme de votre maison."
  list:
    - "La carte du matin reste tant que c'est le matin dans votre maison, même un dimanche tardif."
    - "Une tablette murale s'assombrit dans la nuit de votre maison, pas seulement à onze heures."
    - "Une maison sans rythme garde l'horloge : la carte de 5 à 11 heures, la tablette sombre de 23 à 6 heures."
    - "Ainsi tous les écrans suivent la maison, comme la lumière et la salutation de Vesta."
"0.3.31":
  one: "Les réglages sont au même endroit, et en mémoire."
  list:
    - "Chaque réglage de la maison est dans un seul tableau : sa valeur par défaut, si un écran peut le changer et s'il part dans le fichier de réglages."
    - "Ce que les Paramètres de la maison enregistrent est vraiment gardé, pour chaque réglage ; un test y veille."
    - "Mettre un écran à jour ne demande plus sans cesse les réglages à la base de données : ils sont en mémoire."
    - "Un réglage qui change autrement, comme lors d'une journée remise, est relu."
"0.3.30":
  one: "Un tour est plus rapide dans une grande maison."
  list:
    - "HouseMind sait d'un coup, par pièce et par appareil, ce qui en fait partie, au lieu que chaque règle fouille toute la maison."
    - "Aérer, une fenêtre ouverte avec le chauffage, la lumière d'une pièce et les capteurs d'un appareil utilisent cette seule liste."
    - "Dans une maison d'environ 1 750 entités, un tour passe d'environ 15 à environ 6 millisecondes, et une maison plus grande ne ralentit plus au carré."
    - "Un appareil ajouté ou déplacé dans une autre pièce compte tout de suite."
"0.3.29":
  one: "Mettre les écrans à jour demande moins de travail, surtout dans une grande maison."
  list:
    - "Prêt pour l'autonomie ? n'est recalculé que si HouseMind a décidé, appris ou reçu une réponse, ou si quelque chose a été réglé ; sinon une fois par tour."
    - "Les écrans ouverts dans la même langue et au même niveau partagent ce travail."
    - "Une maison animée donne à un écran une nouvelle image au plus cinq fois par seconde, et la plus récente passe toujours."
    - "Dans une grande maison avec trois écrans ouverts, un capteur prend maintenant environ 40 au lieu de 150 millisecondes."
"0.3.28":
  one: "Moins sur les écrans : seulement ce qui te demande quelque chose."
  list:
    - "Appareils sans codes, et la colonne État est masquée jusqu'à ce que tu la choisisses. Seul non disponible ou non reconnu s'y ajoute, et le haut dit combien ne sont pas disponibles."
    - "Ouvrir dans Home Assistant t'amène à l'appareil ; c'est là aussi que tu choisis une autre icône. Essayer un niveau pour toute la pièce est maintenant dans la fenêtre Niveaux."
    - "La fenêtre de la pièce montre les moments. Tu en lances un avec ta voix ou sur la tablette murale."
    - "Check-up › Système tient en une phrase quand tout va bien ; seul ce qui ne va pas a une tuile."
    - "Plus de ligne Dernière fois à sous le réseau, l'explication une seule fois sous plusieurs questions, et Prêt pour l'autonomie ? dit combien de fois tout s'est bien passé, sans score."
"0.3.27":
  one: "Le Journal est plus calme : une ligne par décision, moins de boutons."
  list:
    - "Une question, ta réponse et ce qui en est sorti tiennent en une ligne : Tu as dit oui à 09:14."
    - "Plus d’aperçu avec des pourcentages ni de petites étiquettes par ligne, mais une ligne grise : 18:29 · Salon · fait. Regrouper par type a disparu ; Filtrer › Type le fait déjà."
    - "Pourquoi ? n’est plus qu’en Informé ; à partir d’Impliqué, la ligne le dit elle-même. Journée différente ? est un petit bouton."
    - "Colonnes et Exporter seulement en Expert, en CSV ou Markdown. Filtrer et Regrouper n’apparaissent qu’à partir d’une liste de 20 lignes."
    - "Ce qui est parti vers une IA est à un seul endroit : le Journal en Expert. Une notification pour information n’a plus de Plus tard."
"0.3.26":
  one: "Cerveau est plus calme : ce qui n’était que pour les développeurs est parti."
  list:
    - "Plus de jauge, de trace des décisions ni de fil des pensées dans Cerveau, donc plus de menu Plus. Chaque décision est dans le Journal ; en Expert elle se déplie jusqu’à ses contrôles, en mots."
    - "En Expert, plus de codes sous une proposition ou une ligne du Journal, mais des phrases comme : J’en suis sûr à 80 %."
    - "Prêt pour l’autonomie ? : plus de double titre, plus d’anneau avec un chiffre ni de pourcentages ; une phrase avec En savoir plus vers le manuel. Les seuils ne sont plus que dans le fichier de réglages."
    - "Énergie sans le tableau par quart d’heure, et sans batterie domestique ni voiture : HouseMind ne les pilote pas, et Home Assistant les montre déjà."
    - "Le temps de réaction est dans À propos de HouseMind en Expert. Mes préférences n’ont plus de groupe Aide."
"0.3.25":
  one: "HouseMind est plus rapide et fait moins de travail en double."
  list:
    - "Un écran démarre plus vite : il reçoit les textes dans sa langue une seule fois, sans liste en anglais à côté."
    - "Quand quelqu'un rentre, HouseMind ne demande plus à chaque fois toute la liste des actions à Home Assistant."
    - "Une pièce n'envoie plus ses appareils qu'une seule fois à l'écran."
    - "Quand une caméra voit quelqu'un, HouseMind compte cette personne tout de suite."
"0.3.24":
  one: "HouseMind est plus sûr : un piratage éthique a trouvé quelques failles, et elles sont fermées."
  list:
    - "Une porte de garage, un portail ou une porte derrière un interrupteur, un bouton ou un relais n'est jamais ouvert par HouseMind. Même si quelqu'un l'a un jour indiqué comme lampe."
    - "Seul un administrateur peut mettre en pause plus d'une heure. Le Journal dit qui a mis en pause."
    - "Qui n'est pas administrateur va jusqu'à Impliqué par défaut et crée des règles pour un seul appareil. Une règle pour une pièce ou toute la maison, c'est un administrateur qui la crée."
    - "Personne ne peut plus écarter un message d'urgence avec Plus tard. Plus tard ne vaut plus que pour toi."
    - "Sur une enceinte partagée, un oui à une proposition ne compte plus ; un non, si. Le nom de Vesta ne peut contenir que des lettres ordinaires."
"0.3.23":
  one: "Ce que tu choisis dans Sécurité est maintenant vraiment enregistré."
  list:
    - "Quelle alarme, les sons, les rideaux à l'alarme, activer l'alarme toute seule, les lampes de signal et les rideaux en cas d'incendie : l'écran disait Enregistré, mais HouseMind ne recevait jamais le choix. Maintenant oui."
    - "La case Apprendre aussi de l'historique reste aussi quand tu la décoches."
    - "Si l'enregistrement ne marche pas, l'écran le dit, et plus jamais Enregistré."
"0.3.22":
  one: "Quand l'alarme se déclenche, ou en cas d'incendie, la maison en fait plus."
  list:
    - "La musique et la télé se taisent, et l'avertissement retentit chaque demi-minute jusqu'à la fin."
    - "Les lampes que tu choisis dans Sécurité clignotent en rouge en cas d'intrusion. La tablette murale devient rouge, avec l'image de la caméra et un bouton vers l'alarme."
    - "Sur ton téléphone, des boutons vers la caméra, l'alarme et le 112. Qui n'a pas vu le message après deux minutes le reçoit une fois de plus."
    - "En cas d'incendie, les volets choisis remontent, une climatisation s'éteint, et le message dit quelle porte est verrouillée. HouseMind n'ouvre jamais une serrure."
"0.3.21":
  one: "L'alarme peut s'activer toute seule, et tu peux la tester."
  list:
    - "Si tu as dit oui à « Activer l'alarme ? » les cinq dernières fois, HouseMind demande une fois à un administrateur s'il peut le faire lui-même désormais. C'est aussi dans Paramètres de la maison › Sécurité."
    - "HouseMind active alors l'alarme lui-même quand tout le monde est parti ou que la maison va dormir, et le dit tout de suite. Seulement quand c'est sûr : aucun capteur qui voit encore quelqu'un, aucune fenêtre ouverte. Il ne la désactive jamais."
    - "Si quelqu'un la désactive vite deux fois, HouseMind redemande."
    - "Dans Tester la maison, tu choisis « L'alarme se déclenche » : tu vois ce qui se passe, et avec Le faire pour de vrai les lampes de cette pièce s'allument et toi seul reçois le message, comme test."
"0.3.20":
  one: "Vesta montre que l'alarme est activée, et qu'elle s'est déclenchée."
  list:
    - "Quand l'alarme est activée, Vesta est bleue avec un bouclier : Sécurisé. La nuit, elle reste sur Bonne nuit, avec « sécurisé » en plus."
    - "Quand l'alarme s'est déclenchée puis a été désactivée, Vesta affiche Attention, avec l'heure, jusqu'à ce que quelqu'un l'ait vu."
    - "Tout le monde reçoit aussi un message, pour que celui qui rentre plus tard le sache. Quand l'alarme est réactivée, il disparaît."
"0.3.19":
  one: "Des rappels pour l'eau qui coule la nuit, la pluie avec quelque chose d'ouvert et une panne, et les automatisations d'un même appareil s'arrêtent et reprennent ensemble."
  list:
    - "Si le compteur d'eau avance un peu chaque heure la nuit alors que personne n'utilise d'eau, tu reçois un rappel le matin : un robinet goutte peut-être, ou la chasse d'eau coule."
    - "S'il va pleuvoir dans l'heure alors qu'une fenêtre ou une porte extérieure est ouverte, tout le monde reçoit un rappel qui dit ce qui est ouvert."
    - "Si un appareil signale lui-même une panne, comme une pompe à chaleur ou un interrupteur qui chauffe trop, tu le sais. Une surchauffe ou une surcharge est importante."
    - "Si plusieurs automatisations pilotent la même lampe, HouseMind les arrête ensemble et les réactive ensemble. S'il ne peut pas en reprendre une, elles restent toutes activées."
"0.3.18":
  one: "L'alarme apparaît dans le Journal, et après sa désactivation HouseMind remet la maison comme avant."
  list:
    - "L'activation, le déclenchement et la désactivation de l'alarme sont maintenant dans le Journal, chacun en une ligne. Au déclenchement, la ligne dit ce que HouseMind a fait, au lieu d'une ligne par lampe."
    - "Une minute après la désactivation de l'alarme, les lampes et les rideaux reviennent comme ils étaient juste avant le déclenchement. Ce que tu as changé toi-même pendant cette minute, et la lumière d'une pièce où quelqu'un se trouve, reste ainsi."
    - "Pour chaque action, Pourquoi ? donne maintenant la vraie raison, comme « parce que l'alarme s'est déclenchée », même après un redémarrage."
"0.3.17":
  one: "Chaque pièce a sa propre lumière, et HouseMind reconnaît une douche et l'air confiné."
  list:
    - "Une cuisine et une salle à manger avec un seul capteur sont maintenant des pièces à part. Entre dans la cuisine dans le noir, et sa lumière s'allume, même si la salle à manger est éclairée. Si vous éteignez à chaque fois la lumière de la cuisine, HouseMind apprend que la lumière de la salle à manger y suffit."
    - "Si l'humidité de la salle de bain monte vite alors que quelqu'un vient d'y être, quelqu'un prend une douche. La lumière reste allumée, même si le capteur ne te voit pas derrière le rideau de douche, et le ventilateur se met en marche tout de suite."
    - "Si le CO₂ reste élevé pendant un quart d'heure là où quelqu'un se trouve, tu reçois un rappel pour aérer. La nuit, il n'y en a pas : le point du matin te le dit."
    - "Dans Tester la maison, la zone d'une pièce compte maintenant comme le capteur de cette pièce. La salle à manger a alors aussi Quelqu'un entre et Plus personne."
"0.3.16":
  one: "Un animal n'allume plus la lumière la nuit et ne réveille plus la maison."
  list:
    - "Dans les pièces avec des animaux, ce que seul un capteur voit ne compte pas comme une personne pendant que la maison dort ou que personne n'est là. Cela vaut maintenant aussi pour un capteur de présence, car il voit un chien tout aussi bien."
    - "Une personne compte : une caméra qui y voit une personne, quelqu'un qui y utilise un interrupteur, quelqu'un qui vient d'une pièce sans animaux (l'escalier, la salle de bain), ou un habitant qui vient de rentrer."
    - "Le chien ne réveille plus la maison tôt. À partir d'une demi-heure avant votre heure habituelle de lever, un mouvement réveille à nouveau la maison. Avant l'heure du coucher, tout reste comme avant."
"0.3.15":
  one: "La page Info de HouseMind dans Home Assistant montre maintenant en bref ce que HouseMind fait pour toi."
  list:
    - "Dans Paramètres › Applications › HouseMind, la page Info raconte ce que HouseMind t'enlève des mains, avec trois écrans de l'application et une journée avec HouseMind."
    - "La Documentation a de nouvelles images, et explique maintenant aussi le matin et la nuit, les signalements comme un chauffe-eau qui ne chauffe pas, le Check-up et les niveaux d'une lampe."
    - "La déclaration de confidentialité dans la Documentation est maintenant la même que dans l'application."
"0.3.14":
  one: "Si le chauffe-eau ne chauffe plus depuis plus d'un jour, tu reçois un rappel."
  list:
    - "L'eau du chauffe-eau est au moins 10 degrés plus froide que son réglage, et il n'a pas chauffé depuis plus d'un jour ? Alors tout le monde reçoit un message important, avec la température de l'eau."
    - "Regarde alors sur l'appareil ou dans sa propre app s'il y a une panne, ou si le courant est coupé. HouseMind lui-même ne change rien au chauffe-eau."
    - "Si le chauffe-eau est éteint ou sur absence, ou si la maison est en vacances, tu ne reçois pas ce message. Dès qu'il chauffe à nouveau, le message disparaît tout seul."
"0.3.13":
  one: "Le point du matin ne se dit plus qu'une fois, même quand la lecture prend un moment."
  list:
    - "Un long point du matin était parfois dit plusieurs fois de suite. HouseMind pensait que la lecture avait échoué, parce qu'elle durait si longtemps."
    - "Maintenant, une phrase encore en cours de lecture compte comme dite. Si cela ne marche vraiment pas, par exemple parce que l'enceinte est éteinte, HouseMind le remarque tout de suite et réessaie plus tard."
    - "C'est vrai pour tout ce que Vesta dit d'elle-même, comme la vérification du coucher. Et HouseMind n'attend plus une demi-minute l'enceinte : le reste de la maison continue pendant ce temps."
"0.3.12":
  one: "Tester la maison : avec « La maison dort », chaque lampe n'apparaît plus qu'une fois."
  list:
    - "Quand tu choisis « La maison dort » dans Tester la maison, tu vois une ligne par lampe : ce que fait Bonne nuit quand tout le monde vient de se coucher."
    - "Avant, une lampe apparaissait parfois deux fois : éteinte « parce qu'il n'y a plus personne depuis un moment » et éteinte « parce que la maison va dormir ». La première va avec « Plus personne »."
    - "Ce que HouseMind fait vraiment ne change pas : dans la première demi-heure de la nuit, les lampes des pièces vides s'éteignent et les rideaux ouverts se ferment."
"0.3.11":
  one: "Apprentissage et étapes est court ; ce que HouseMind sait de ta maison est maintenant dans Cerveau, et tu peux toujours le changer."
  list:
    - "Paramètres de la maison › Apprentissage et étapes n'a plus que l'apprentissage, l'historique et les domaines. Deux boutons t'amènent dans Cerveau."
    - "Cerveau a un nouvel onglet pour les administrateurs : Ce que je sais. Avec des tuiles pour À confirmer, Confirmé, Pas juste et Scènes et scripts, par pièce, et ce qui appartient à un appareil replié ensemble."
    - "Tout peut revenir en arrière, même après C'est juste ou Pas juste : choisis autre chose, dis Pas juste finalement, ou remets-le dans À confirmer. HouseMind se souvient de ce qu'il pensait lui-même."
    - "Les automatisations sont maintenant à un seul endroit : Cerveau › Prêt pour l'autonomie ? › Automatisations, avec ce qu'elles font et Désactiver ou Réactiver. Les seuils sont dans la carte d'un domaine ; revenir à un jour précédent, dans Recommencer."
    - "Ce qui vient de l'IA est marqué en violet partout : de l'IA."
"0.3.10":
  one: "Bonne nuit : quand la maison va dormir, HouseMind éteint ce qui est encore allumé et ferme ce qui est encore ouvert."
  list:
    - "Les lampes des pièces où il n'y a personne s'éteignent, aussi dans une pièce sans détecteur de mouvement. Les chambres et l'extérieur restent comme ils sont."
    - "Les rideaux et volets encore ouverts se ferment, aussi en été quand il ne fait nuit qu'après l'heure du coucher."
    - "Une fois par nuit, dans la première demi-heure : si tu rallumes quelque chose ensuite, cela reste ainsi."
    - "Comme chaque règle, cela commence par observer et demander. Dans Tester la maison, tu le vois avec ‘La maison dort’."
"0.3.9":
  one: "Tester la maison le fait maintenant pour de vrai : choisis ce qui se passe, et avec Le faire pour de vrai la lampe s'allume et le rideau se ferme."
  list:
    - "Faire comme si et Essayer maintenant forment ensemble Rejouer. Tu choisis ce qui se passe et vois tout de suite ce que HouseMind ferait ; rien n'est encore commandé."
    - "Avec Le faire pour de vrai, HouseMind fait vraiment tout ce qui est dans cette liste, dans ta maison, et tu le vois circuler dans le réseau. Après une minute tout revient tout seul, ou plus tôt avec Remettre. Tant que le test tourne, les règles habituelles laissent ces appareils tranquilles."
    - "Chaque ligne dit honnêtement comment cela irait pour de vrai : je le fais aussi pour de vrai, je demande d'abord, je regarde seulement, ou non et pourquoi. Une règle de la maison ou une automatisation arrête aussi le test."
    - "Le soir apporte la lumière de ce soir-là : en novembre il fait alors nuit, et dans le test les rideaux se ferment. Les choix qui se contredisent, comme Levé et Tout le monde parti, ne vont plus ensemble."
    - "Le quart d'heure de test s'appelle maintenant Fais le tour toi-même : un domaine passe un moment en Autonome, et tu traverses toi-même la pièce."
"0.3.8":
  one: "Sur un ordinateur, Tester la maison est maintenant un petit bouton en haut à droite."
  list:
    - "Sur un ordinateur, dans un navigateur, Tester la maison n'est plus dans le menu à gauche. Tu l'ouvres avec la fiole en haut à droite, à côté de l'Aide et de la visite."
    - "Le panneau s'ouvre comme avant à droite de ta maison. Tant qu'il est ouvert, la fiole est allumée. Touche-la encore ou Fermer pour le fermer."
    - "Rien ne change sur un téléphone : Tester la maison reste l'onglet Tester en bas. Dans une fenêtre plus étroite et dans l'app Home Assistant, il reste dans le menu."
"0.3.7":
  one: "Pendant que tu règles les niveaux d'une lampe, HouseMind laisse cette lampe tranquille."
  list:
    - "Tant que la fenêtre Niveaux est ouverte, aucune règle, proposition ou règle de la maison ne fait quoi que ce soit avec cette lampe. Seule la sécurité passe avant."

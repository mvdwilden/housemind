"0.2.32":
  one: "Si tu as commandé une lampe à la main, celui qui entre plus tard a simplement de nouveau de la lumière."
  list:
    - "Tant que quelqu'un est dans la pièce, ton choix tient. Si la pièce a été vide et que quelqu'un entre, c'est un nouveau moment et la lumière se rallume comme d'habitude quand il fait sombre."
    - "Si tu appuies sur un bouton qui éteint tout, les pièces où personne n'était n'en souffrent pas : celui qui y entre plus tard a de la lumière."
    - "Si tu allumes une lampe à distance alors que personne n'y est, elle reste allumée, comme avant."
    - "Dans une pièce sans capteur de présence ou de mouvement, HouseMind n'éteint plus la lumière parce qu'il croit qu'il n'y a personne. Il ne peut pas le voir là. Il ne le demande plus non plus."
"0.2.31":
  one: "La lumière de l'alarme ou de la sonnette ne bloque plus une pièce."
  list:
    - "Une automatisation qui ne donne qu'un signal avec une lampe, comme une couleur pour l'alarme ou un clignotement pour la sonnette, ne bloque plus rien. Elle reste simplement active, et HouseMind n'en apprend rien."
    - "Tant qu'un tel signal dure, HouseMind ne touche pas à la lampe. Si la lampe reste allumée, comme quand une alarme se déclenche, HouseMind n'y touche pas jusqu'à ce que cette lampe change."
    - "Une automatisation qui ne commande que des lampes suit dans la question unique dès que les règles de ces lampes sont prouvées. Elle y est nommée."
    - "Une automatisation fait plus, par exemple aussi une prise ? Alors elle reste active et ne garde que sa propre lampe. Le reste de la pièce continue."
    - "HouseMind comprend maintenant aussi la nouvelle façon dont Home Assistant écrit la présence et les portes comme début d'une automatisation, et en apprend donc aussi."
"0.2.30":
  one: "Ce qui marche assez souvent, HouseMind le fait lui-même après un seul oui."
  list:
    - "Quand HouseMind voit quelque chose marcher assez souvent, il demande une fois s'il peut le faire lui-même désormais. La question se trouve dans Attend ta réponse et n'expire pas. Un oui suffit."
    - "Si une automatisation le gère, la question porte sur toute l'automatisation, et seul un administrateur la reçoit. Après un oui, HouseMind le fait lui-même et elle se désactive. Remis comme avant deux fois en une semaine : elle se réactive d'elle-même."
    - "La barre et l'anneau de Prêt pour l'autonomie ? montrent maintenant à quelle fréquence cela a bien marché, et en dessous ce qu'il faut encore. Si HouseMind ne fait qu'observer, c'est indiqué aussi, avec la raison."
    - "Si tu fais toi-même ce que HouseMind demande, cela compte comme un oui. Si tu éteins la lumière et que tu pars, cela compte aussi."
    - "Une question propose maintenant « Moi-même désormais » au lieu de « Toujours ». Une lampe ne bloque plus tout un groupe."
"0.2.29":
  one: "Une prise ne devient plus une lampe parce qu'elle est revenue après un redémarrage en même temps qu'une lampe."
  list:
    - "HouseMind ne déduit plus qu'un interrupteur appartient à une lampe que s'il s'allume et s'éteint vraiment. Un redémarrage de Home Assistant ne compte plus."
    - "Ce que HouseMind avait déduit ainsi comme lampe, il le regarde à nouveau juste après la mise à jour. Ce que tu as répondu avec C'est juste ou Pas juste reste."
    - "Si une étiquette dans Home Assistant dit qu'un appareil est autre chose, comme un chauffage, HouseMind n'en fait pas une lampe."
    - "Ainsi, une couverture chauffante ou l'interrupteur de mise à jour d'un compteur ne figure plus parmi les lampes d'une pièce."
"0.2.28":
  one: "Si des lampes sont dans un groupe, HouseMind utilise et montre le groupe, pas chaque lampe à part."
  list:
    - "Le Journal, Ce que j'ai pensé, le Fil des décisions et Prêt pour l'autonomie ? montrent une ligne pour le groupe, pas une par lampe."
    - "Laisser tranquille veut dire laisser tranquille : un tel appareil n'apparaît plus que dans Appareils, où tu enlèves la coche."
    - "Si une lampe d'un groupe est sur Laisser tranquille, le groupe l'emmène. Mets le groupe lui-même sur Laisser tranquille et tout ce qu'il contient reste immobile."
    - "Un interrupteur en plus d'une prise, comme une protection de charge, n'est plus parmi les lampes."
    - "La maison de démo extended a maintenant chaque type de groupe de lampes, et Appareils dit pourquoi un groupe ne fait que rassembler."
"0.2.27":
  one: "‘Home Assistant en ordre’ s'appelle maintenant Check-up."
  list:
    - "Dans le menu et sur le téléphone, la page qui vérifie Home Assistant s'appelle maintenant Check-up."
    - "La fenêtre qu'ouvre ‘Voir’ s'appelle Check-up de Home Assistant."
    - "L'aide et le guide utilisent le nouveau nom, dans les quatre langues."
    - "Demande le check-up à Vesta, elle sait ce que tu veux dire ; elle connaît aussi encore l'ancien nom."
"0.2.26":
  one: "L'écran se reconnecte aussitôt quand tu reviens."
  list:
    - "L'écran a perdu le contact un moment, par exemple après une mise à jour ou quand le réseau était coupé ? Quand tu reviens à l'écran, il se reconnecte aussitôt."
    - "Quand le réseau revient, l'écran essaie aussi aussitôt."
    - "Tant que tu regardes l'écran, il n'attend jamais plus de dix secondes entre deux essais."
    - "L'aide et le guide disent ce que veut dire ‘Pas de connexion – nouvel essai…’."
"0.2.25":
  one: "HouseMind connaît maintenant la partie de la journée d'après votre propre rythme : nuit, matin, journée et soir."
  list:
    - "C'est la nuit dès que la maison dort. Si quelqu'un est encore debout, deux heures après votre heure de coucher habituelle."
    - "Le matin commence quand la maison se réveille, le soir quand vous rentrez d'habitude. Si HouseMind ne connaît pas encore une heure, l'horloge compte."
    - "La lumière en entrant et le salut de Vesta s'y adaptent. Dans une chambre, aucune lampe ne s'allume d'elle-même à partir de l'heure de coucher habituelle."
    - "Dans Cerveau › Rythme, la première ligne dit ce que c'est maintenant, depuis quand et pourquoi."
"0.2.24":
  one: "Dans le réseau, la ligne ne circule plus que pendant que HouseMind fait quelque chose, et tu peux répondre à une question sur place."
  list:
    - "Quand HouseMind fait quelque chose, la ligne circule quelques secondes puis s'éteint d'elle-même, au lieu de dix minutes."
    - "Sous le dessin reste ce qu'il a fait en dernier aujourd'hui, avec l'heure et Pourquoi ?."
    - "Une question reste une ligne pointillée tant qu'elle est ouverte, avec en dessous Fais-le et Pas maintenant : pas besoin du Journal pour ça."
"0.2.23":
  one: "Sur les tuiles de Prêt pour l'autonomie ?, l'anneau est maintenant en bas à droite."
  list:
    - "L'anneau est à côté du nombre de pièces, et ne recouvre jamais les étapes."
    - "Le nom a toute la largeur, donc un mot long reste entier."
    - "Les anneaux sont alignés en bas des tuiles, aussi sur un téléphone."
"0.2.22":
  one: "Les tuiles de Prêt pour l'autonomie ? sont plus calmes : l'anneau est maintenant en haut à droite."
  list:
    - "L'anneau avec le score est à côté du nom, et ne recouvre plus jamais les étapes."
    - "Ensemble, les tuiles remplissent toute la ligne, aussi sur un grand écran."
    - "Sur un téléphone, il y en a toujours deux côte à côte."
"0.2.21":
  one: "Prêt pour l'autonomie ? est plus petit : les domaines sont maintenant des tuiles côte à côte."
  list:
    - "Chaque tuile montre le nom, les étapes, l'anneau et le nombre de pièces. Sur un ordinateur, elles tiennent sur une ligne ; sur un téléphone, deux côte à côte."
    - "Touche une tuile : en dessous vient une carte avec l'explication et les boutons de ce domaine, et la liste est juste en dessous, avec seulement ce domaine."
    - "L'aperçu par sorte au-dessus d'une longue liste est aussi en tuiles, dans le Journal, les Appareils, les Automatisations existantes, les Scènes et Home Assistant en ordre."
"0.2.20":
  one: "Dans Énergie, un lecteur d'écran dit maintenant où en est la mesure et atteint les blocs du plan."
  list:
    - "Les premières semaines, Énergie montre une barre avec les jours que HouseMind a mesurés. Un lecteur d'écran la lit maintenant avec les mêmes mots qu'au-dessus, comme ‘Jour 3 sur 14’."
    - "Dans le plan (Impliqué et Expert), un lecteur d'écran atteint maintenant aussi les blocs de la chronologie. Choisis-en un et il dit ce que fait HouseMind à ce moment, et pourquoi."
    - "Chaque barre de l'app qui montre où en est quelque chose a maintenant un nom : dans Énergie, pendant l'apprentissage de l'historique, pendant que Vesta écoute et dans la maison de démo."
    - "Le contrôle qui ouvre chaque écran à chaque niveau, sur un téléphone et un grand écran, en clair et en sombre, ne trouve de nouveau rien à améliorer."
"0.2.19":
  one: "Le Journal commence maintenant par ‘Attend ta réponse’, et une réponse de l'IA se perd moins souvent."
  list:
    - "Le chiffre à côté de Journal compte les notifications qui t'attendent encore. Elles sont maintenant en haut du Journal, avec leurs boutons ; une fois traitées, elles sont dans la chronologie."
    - "Chaque question à l'IA reçoit la forme de sa réponse. Si le service le permet, l'IA ne peut pas répondre autrement."
    - "Si une réponse ne tient pas, ce qui était complet compte. Si l'IA ne donne pas de réponse après avoir cherché, HouseMind redemande une fois."
    - "Le nom qu'une intégration donne elle-même à un appareil, comme ‘Lumières’, reste un mot ordinaire dans ta question à Vesta."
"0.2.18":
  one: "Dans Home Assistant en ordre, Système est maintenant en haut, avec un anneau comme l’horloge d’Énergie."
  list:
    - "L’anneau extérieur montre ce qu’il y a sur le disque : la base de données, les sauvegardes, les anciennes sauvegardes isolées, le reste et ce qui est libre."
    - "Des traits à 85 % et 95 % montrent quand HouseMind le signale. L’anneau intérieur compte les jours depuis la sauvegarde la plus récente."
    - "Pointe une partie de l’anneau et HouseMind le dit en mots. Les tuiles de la sauvegarde, de la base de données et du disque sont en dessous."
"0.2.17":
  one: "Le réseau sous Maison › Pièces ressemble maintenant à la maquette : avec Vesta en grand au milieu."
  list:
    - "Vesta respire au milieu dans sa couleur, avec son mot en dessous. Si l’IA est activée, un anneau en pointillés l’entoure."
    - "Les pièces sont des blocs avec leur nom, et leurs appareils en petits points. Sur un téléphone, le réseau est à la verticale."
    - "Quand HouseMind vient de faire ou de demander quelque chose, une ligne circule pendant dix minutes de la pièce à l’appareil, en passant par Vesta. En dessous, ce qui s’est passé, avec ‘Pourquoi ?’."
    - "Quand tout est calme, une ligne dit quand une ligne circulera. Une légende dit ce que signifient les lignes."
"0.2.16":
  one: "Que Vesta ouvre elle-même sa fenêtre avec une question est maintenant un seul choix pour toute la maison."
  list:
    - "Un administrateur en Expert trouve le choix dans Paramètres de la maison, dans le groupe Vesta. Désactivé vaut pour tout le monde à la maison."
    - "Quand c’est désactivé, sa question ne s’ouvre plus pour personne et attend dans le Journal. Touche Vesta et elle la pose quand même."
    - "Le choix n’est plus dans Mes préférences ; un choix personnel d’avant ne compte plus."
"0.2.15":
  one: "Énergie « Maintenant et aujourd'hui » montre maintenant aussi le soleil, le réseau et la maison quand un compteur a un capteur vide."
  list:
    - "Un appareil peut avoir plusieurs capteurs de puissance. HouseMind prenait le premier, même sans valeur ou s’il mesurait autre chose, comme le réseau sur les panneaux solaires."
    - "Maintenant il choisit le capteur qui dit ce qu’il mesure et qui a une valeur. Si celui-ci disparaît, il lit le suivant."
    - "Quand le réseau n’est mesuré que par phase, HouseMind additionne les phases. Quand la batterie domestique elle-même ne donne rien, il lit la batterie du système dont elle fait partie."
    - "Ainsi « Aujourd’hui » se remplit à nouveau, et Vesta sait ce que la maison consomme maintenant."
"0.2.14":
  one: "Home Assistant en ordre est maintenant une page à part dans le menu, seulement pour un administrateur en Expert."
  list:
    - "C’était un groupe dans Paramètres de la maison, dans une petite fenêtre. Maintenant il a toute la largeur de l’écran."
    - "Sur un ordinateur il est dans le menu à gauche, sur un téléphone c’est un cinquième bouton en bas."
    - "Aux autres niveaux, il n’est plus dans Paramètres de la maison. ‘Voir’ sur un message à ce sujet le montre toujours."
"0.2.13":
  one: "Si tu dis « Fais-le » quand HouseMind demande de mettre le chauffage en absence, le réglage d’avant revient quand quelqu’un rentre."
  list:
    - "Quand personne n’est à la maison depuis un jour, HouseMind peut demander de mettre une pompe à chaleur en absence. Après « Fais-le », il oubliait son réglage d’avant."
    - "Au retour, il remettait donc la pompe à chaleur sur son réglage normal, même si elle était par exemple sur éco avant."
    - "Désormais, HouseMind retient le réglage d’avant et remet exactement celui-là."
"0.2.12":
  one: "Quand Vesta pose une question, elle donne maintenant la même raison que l’écran."
  list:
    - "Pour certaines questions, Vesta donnait une autre raison que l’écran. Elle disait par exemple « parce que quelqu’un est rentré dans le noir », alors que l’écran disait « parce que quelqu’un est rentré il y a 5 min et il n’y a plus personne dehors »."
    - "Désormais, HouseMind garde la raison entière avec chaque question, donc Vesta donne la même."
    - "Cela vaut aussi pour « Pourquoi ? » sous sa question, et pour les questions sur la lumière du soir ou le chauffage."
"0.2.11":
  one: "Un interrupteur mural d'une automatisation à bouton ne compte plus comme une lampe pour l'éclairage."
  list:
    - "HouseMind prenait certains interrupteurs muraux pour une lampe, parce qu'ils s'allument et s'éteignent avec elle."
    - "Désormais, l'éclairage laisse complètement de côté les interrupteurs d'une automatisation à bouton. Vous les commandez vous-mêmes."
    - "Ainsi, aucun « pas fait » n'apparaît plus dans le Journal pour un tel interrupteur."
"0.2.10":
  one: "Un bouton ou un interrupteur mural qui commande une lampe n'empêche plus HouseMind de s'occuper de cette lampe."
  list:
    - "Une automatisation qui ne fait que transmettre ce que vous faites vous-mêmes, comme un interrupteur mural, une télécommande ou un bouton dans l'app, est votre propre main. HouseMind commande maintenant aussi ces lampes, également en Autonome."
    - "HouseMind ne demande jamais à désactiver une telle automatisation ; le bouton continue de marcher. Ce qu'elle fait compte comme ce que vous avez fait, donc HouseMind laisse ensuite la lampe tranquille un moment."
    - "HouseMind ne bascule jamais l'interrupteur lui-même. Si HouseMind a éteint la lampe alors que l'interrupteur est encore sur marche, bascule-le une fois de plus."
"0.2.9":
  one: "Quand tu rentres dans le noir, la lumière de l’entrée s’allume, et s’éteint quelques minutes plus tard."
  list:
    - "Ce sont les lampes de l’allée, de la porte d’entrée ou du carport. Un jardin ou une terrasse à l’arrière reste dans le noir."
    - "Elles s’éteignent après 5 minutes, plus tard s’il y a encore quelqu’un dehors. Si la lumière est déjà allumée, comme la lumière du soir, elle reste comme elle est."
    - "Une automatisation qui allume l’allée quand tu rentres et l’éteint quand tu pars apprend maintenant à HouseMind. En Autonome, HouseMind peut la reprendre."
"0.2.8":
  one: "Si tu mets quelque chose en Autonome, HouseMind désactive aussitôt l’automatisation qui le faisait. Si cela redescend, elle se réactive aussitôt."
  list:
    - "Si tu mets une ligne ou un domaine en Autonome dans ‘Prêt pour l’autonomie ?’, HouseMind désactive aussitôt l’automatisation de Home Assistant qui le faisait et le fait lui-même. Si cette automatisation fait plus, comme envoyer un message, il demande d’abord."
    - "Si cela redescend sur Proposer ou Observer, si tu désactives un domaine, ou si HouseMind recule lui-même d’une étape, l’automatisation se réactive aussitôt. Ainsi rien n’est laissé de côté ; tu le lis dans une notification et dans le Journal."
    - "Réapprendre, les réglages d’usine et la suppression de HouseMind les réactivent d’abord, comme toujours."
"0.2.7":
  one: "La lumière extérieure s'allume à la tombée de la nuit, même quand personne n'est à la maison."
  list:
    - "La maison paraît habitée et les cambrioleurs restent à distance. Elle s'éteint quand la maison va dormir, et au plus tard à l'heure qui convient à votre maison ; tant que HouseMind ne le sait pas, à 23:30."
    - "Quand personne n'est à la maison, elle s'éteint vers l'heure de coucher habituelle, quelques minutes différemment chaque soir, pour ne pas ressembler à une minuterie."
    - "Une automatisation qui allume la lumière extérieure apprend maintenant à HouseMind sa luminosité et son heure. En Autonome, HouseMind demande s'il peut la reprendre."
"0.2.6":
  one: "Dans le manuel, ‘Les suggestions de l’IA’ se trouvent maintenant dans Règles de la maison."
  list:
    - "La partie sur les règles de la maison qu’une IA peut suggérer se trouvait par erreur dans Matin et soir."
    - "Elle est maintenant à la fin de Règles de la maison, dans les quatre langues, et de même dans le manuel en ligne."
    - "Un lien vers cette partie mène toujours au bon endroit."
"0.2.5":
  one: "Le journal des modifications est court et lisible, et la Documentation dans Home Assistant explique comment fonctionne HouseMind."
  list:
    - "Dans Home Assistant, le journal des modifications ne montre plus, par version, que ce qui est nouveau, en mots simples, à partir de 0.2.0."
    - "La Documentation explique les trois étapes Observer, Proposer et Autonome, les parties de la maison, ainsi que les appareils et les entités."
    - "Deux dessins montrent ce qui fait passer HouseMind à l'étape suivante, et comment il apprend avec le temps pendant que les anciennes habitudes comptent moins."
"0.2.4":
  one: "Dans Cerveau › Appareils, les lampes d'un groupe sont maintenant en retrait sous le groupe."
  list:
    - "Le groupe vient en premier ; ses lampes sont en retrait en dessous, le long d'une ligne."
    - "Tu vois ainsi tout de suite quelles lampes appartiennent à un groupe, comme « Garage - Lampe 1 » sous « Garage »."
    - "Un groupe plus petit dans un plus grand est aussi en retrait, avec ses propres lampes en dessous."
"0.2.3":
  one: "La lumière s'allume dès que tu entres, et s'éteint après le temps qui convient à ta maison."
  list:
    - "Si tu entres dans le noir, la lumière s'allume tout de suite. Dans une pièce que l'on traverse souvent après 10 secondes, et non plus après une demi-minute ou davantage."
    - "Un détecteur de mouvement plus rapide que le détecteur de présence compte de nouveau tout de suite. S'il fait nuit pendant que tu es dans une pièce, la lumière s'allume sans attendre."
    - "Combien de temps la lumière reste allumée quand il n'y a plus personne, HouseMind l'apprend pour chaque pièce de ta maison. En attendant, c'est court dans des toilettes, une salle de bain, un débarras ou une cave, et plus long dans un couloir."
    - "Si tu reviens pendant que la lumière baisse, ou si tu rallumes tout de suite, HouseMind attend plus longtemps dans cette pièce à l'avenir. L'attente compte à partir du moment où le détecteur ne voit plus personne."
"0.2.2":
  one: "L'allemand et le français apparaissent maintenant sans « pas encore relu » dans la liste des langues."
  list:
    - "Dans Mes préférences › Langue, l'allemand et le français n'affichent plus « pas encore relu »."
    - "C'est aussi le cas dans Paramètres de la maison › Vesta › Langue de la maison."
    - "Le manuel n'en parle plus, dans les quatre langues."
"0.2.1":
  one: "Le comptage anonyme par semaine a disparu : une sortie de moins hors de la maison."
  list:
    - "Dans Entretien et vie privée, la case à cocher et l'aperçu ont disparu. Il n'a jamais rien envoyé, et cela reste ainsi."
    - "La déclaration de confidentialité, l'aide, le manuel et le site n'en parlent plus."
    - "Si un administrateur avait dit oui, c'est effacé après la mise à jour ; HouseMind n'en garde rien."
"0.2.0":
  one: "Tu vois maintenant en images comment HouseMind décide, et HouseMind sait mieux ce qu'est chaque appareil."
  list:
    - "Tu vois maintenant comment HouseMind décide, comme un flux : ce qu'il a vu, ce qu'il a pensé et ce qu'il a fait. Une ligne qui coule est faite, des points t'attendent, une ligne qui s'arrête n'a pas été faite."
    - "En mode Sans souci, un fin anneau autour de Vesta a un point pour tout ce que HouseMind a fait aujourd'hui. À partir d'Informé, « Aujourd'hui » sous Ce que j'ai pensé montre par pièce ce qu'il a fait, demandé ou laissé."
    - "Sous Énergie, tu vois le courant circuler : du soleil et du réseau vers la maison, la batterie et la voiture."
    - "En mode Expert, Cerveau › Fil des décisions montre chaque décision comme un pipeline avec les six étapes de la porte, le cœur et l'IA à part, et aujourd'hui de la source au résultat. Dans le réseau, le chemin de ce que HouseMind vient de faire s'allume."
    - "HouseMind sait maintenant ce qu'est chaque entité : une lampe, le thermostat d'une pièce, quelque chose qui mesure l'air ou l'appareil lui-même, une LED d'état ou un réglage. Il agit partout en conséquence et ne touche jamais un réglage."
    - "Une pièce montre maintenant ses entités par appareil, avec ce qu'est chaque entité. Sous Ce que HouseMind sait de ta maison, tu confirmes par appareil en une fois."
    - "Le voyant propre d'un capteur ou d'un assistant vocal ne compte plus comme lumière dans la pièce."
    - "Une pièce avec un capteur de présence est vide dès que ce capteur ne voit plus personne."
    - "Avec l'IA, HouseMind comprend mieux ta maison et Vesta est plus maligne : elle cherche des choses et continue la conversation. Ce qui est important, elle le dit toujours avec ses propres mots, et le cœur n'attend jamais l'IA."
    - "Avec l'IA, tu vois tes habitudes et le bilan de la semaine en mots simples, tu reçois une question sur quelque chose d'inhabituel, comme une lampe allumée depuis des heures dans une pièce vide, et l'IA propose des règles de la maison."
    - "Tu peux choisir l'IA de Home Assistant elle-même. Si elle fonctionne dans la maison, un administrateur peut faire décrire les images des caméras ; elles ne vont jamais dans le cloud."
    - "Pour chaque question à l'IA, tu vois la consigne : pourquoi HouseMind demande et quelle réponse il veut."
    - "Une plaque ou un four allumé alors que personne n'est à la maison devient une question pour l'éteindre."
    - "Cerveau a des onglets, tu actives et désactives des domaines dans les Paramètres de la maison, et Ne plus afficher est le choix de l'administrateur."
    - "À propos de HouseMind a « Bon à savoir ». Le manuel est plus court et existe maintenant aussi en allemand et en français."
"0.1.0":
  one: "Vesta ne dit plus que ce qui s'est vraiment passé, et HouseMind fonctionne mieux au clavier, sur un téléphone et avec un grand texte."
  list:
    - "Home Assistant en ordre dit maintenant combien de sauvegardes tiennent encore sur le disque, et ce que Home Assistant garde lui-même. Les anciennes sauvegardes isolées, que Home Assistant ne supprime pas lui-même, sont sur une seule carte. HouseMind ne supprime rien."
    - "L'eau chaude en plus et le préchauffage n'ont plus lieu que s'ils rapportent vraiment : HouseMind compte la chaleur perdue, l'apprend lui-même et mesure par partie ce que cela a rapporté. Si quelque chose coûte de l'argent pendant trois semaines, il arrête."
    - "Les administrateurs apprennent maintenant tout de suite quand quelque chose d’important ne va pas dans Home Assistant, comme une vieille sauvegarde, avec Voir. Vesta le sait aussi : ‘Quelque chose de cassé dans Home Assistant ?’"
    - "Home Assistant en ordre montre maintenant aussi les automatisations qui ne s’exécutent plus depuis longtemps, la sauvegarde, la base de données et le disque, et ce qui ne marche plus après une mise à jour."
    - "Dans Home Assistant en ordre, tu peux maintenant désactiver quelque chose après un oui, par exemple une entité en double. HouseMind n’efface rien, et Réactiver marche toujours. Avec Éteint exprès, Laisser ainsi et Pas un doublon, ce que tu as décidé reste."
    - "Home Assistant en ordre voit maintenant aussi les compteurs des paramètres d’énergie à l’arrêt, une intégration qui ne mesure plus rien depuis un jour, et un compteur réseau absent des paramètres d’énergie."
    - "Les administrateurs voient dans Paramètres de la maison › Home Assistant en ordre ce qui est cassé dans Home Assistant : une intégration qui ne démarre pas, un appareil qui ne répond pas, une entité en double, ou une automatisation qui renvoie à quelque chose qui n’existe plus. Chaque carte ouvre le bon endroit dans Home Assistant."
    - "Les messages d'urgence disent exactement ce qui s'est passé, par exemple combien de lampes se sont allumées."
    - "Demande « Pourquoi le chauffage n'est pas allumé ? » : Vesta dit pourquoi et quand, ou qu'elle ne sait pas."
    - "Dans « Prêt pour l'autonomie ? », tu vois par domaine combien de fois quelqu'un est intervenu, sur quatre semaines."
    - "Les fenêtres fonctionnent bien au clavier, et Grande n'agrandit que les lettres."
    - "Supprimer une règle de la maison ou un moment demande d'abord oui ou non."
    - "HouseMind démarre de façon plus fiable et se rétablit tout seul après un problème."
    - "HouseMind réagit beaucoup plus vite, même dans une grande maison : après un changement, il ne calcule que la pièce concernée."
    - "Les écrans se mettent à jour plus légèrement : après la première fois, seul ce qui a changé est envoyé, les téléphones et la tablette murale sont plus rapides."
    - "Le manuel dans l'appli ressemble maintenant à celui en ligne, avec des chapitres numérotés, et peut occuper tout l'écran ou s'ouvrir dans sa propre fenêtre."
    - "Les longues listes indiquent combien il y en a et ont des pages, des colonnes au choix, des lignes compactes, un aperçu par type et, sur un ordinateur, l'export en CSV, Markdown ou JSON."
    - "Ce que HouseMind a réglé lui-même sur le chauffe-eau, la pompe à chaleur ou l'injection, il le remet quand ce n'est plus utile, en pause et quand il s'arrête. Si HouseMind ne répond pas, la liaison dans Home Assistant s'en charge."
    - "Dans Énergie, tu vois maintenant et aujourd'hui : le soleil, le réseau, la maison, chaque batterie domestique et la voiture, ce que coûte l'électricité aujourd'hui et ce mois-ci, des conseils et les plus gros consommateurs. HouseMind ne pilote pas la batterie domestique ni la voiture ; Vesta te dit quand même quand la recharge coûte le moins cher."
    - "HouseMind apprend aussi des étiquettes et catégories de Home Assistant, comme indice : il demande d'abord avant de commander quoi que ce soit à cause d'elles, et tu peux filtrer dessus dans les listes. Une étiquette comme Home Assistant ou Réseau ne laisse tranquille que ce que HouseMind ne connaît pas lui-même."
    - "Dans Énergie, les prochaines 24 heures apparaissent en horloge, et le plan en un seul graphique : le prix (bleu quand il est négatif), ce qui entre et où cela va, avant maintenant ce qui a été mesuré, et ce que HouseMind fait par appareil. L'Énergie figure maintenant aussi dans ‘Prêt pour l'autonomie ?’."
    - "En Expert, Mes préférences te laissent choisir si Vesta ouvre elle-même sa fenêtre avec une question. ‘Jusqu'à demain’ met en pause jusqu'au prochain 06:00, aussi après minuit."
    - "Vesta écoute : une réponse va avec sa question, écrite ou dite. Sans IA, elle propose des choix sous forme de boutons, aussi Pourquoi ?, et dit honnêtement ce qu'elle ne sait pas au lieu de deviner. Avec une IA, tu lui parles librement, avec la conversation ; une action n'a lieu qu'après ton oui."
    - "Quand Vesta est rouge, orange ou ambre, la ligne sous son mot dit pourquoi, sur chaque onglet, avec ‘+2’ si d'autres choses attendent. Touche-la et le Journal s'ouvre à ce message."
    - "Sur Supervised, HouseMind fonctionne normalement. Home Assistant ne prend plus en charge ce mode d'installation depuis 2025.12 ; si Home Assistant est en mode Supervised, ou si le Supervisor indique que l'installation n'est pas prise en charge ou pas saine, les administrateurs reçoivent un seul message calme."
    - "Dans Cerveau, sur ‘Prêt pour l'autonomie ?’, chaque compétence dans une pièce dit en une phrase quand HouseMind le fait, avec ce qu'il a appris, comme ‘J’allume la lampe de l’entrée dès que quelqu’un entre et qu’il fait sombre’. En Expert, une ligne en dessous dit exactement pourquoi."

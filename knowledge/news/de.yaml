# Was ist neu, pro Version (E-150): ein Satz für Informiert, eine kurze Liste für Beteiligt und
# Experte. Einfache Sprache, keine Markennamen.
"0.4.5":
  one: "Temperaturen pro Raum, und eine Frage nur einmal."
  list:
    - "An einem Thermostat wählst du jetzt selbst die Temperatur für Zuhause, Schlafen und Weg, in halben Grad: unter Gehirn › Geräte › Temperaturen. Mit ‚Erst nach‘ wählst du, wie lange alle weg sein müssen, bevor es Weg wird."
    - "Bedienst du eine Lampe selbst, mit einem Schalter oder in der App, bleibt das höchstens eine halbe Stunde so. Danach übernimmt HouseMind wieder, auch Farbe und Helligkeit."
    - "Eine Frage beantwortet man einmal: Sobald jemand antwortet, ist sie überall weg, auch auf den Handys der anderen. Eine alte Schaltfläche tut danach nichts mehr."
    - "Ein Nein auf die Frage, ob die Alarmanlage künftig von selbst angehen darf, und ein Nein zur Fürsorge bleiben gespeichert: Diese Frage kommt nicht wieder."
"0.4.4":
  one: "HouseMind hat deine Lampen für sich."
  list:
    - "Steht in einem Raum eine Lichtregel auf Selbstständig, macht HouseMind auch den Tagesrhythmus dieser Lampen selbst, mit ihren Stufen. Adaptive Lighting steuert sie dann nicht mehr."
    - "Solange du die Stufen einer Lampe einstellst, ruht Adaptive Lighting für diese Lampe. Nur du steuerst sie dann; nach Fertig steuert die Gruppe wieder."
    - "In Was ich weiß wählst du, was ein Schalter schaltet: eine Lampe, ein Gerät oder ein anderes Gerät. Auch Schalter, die durch ein Label eine Lampe wurden, stehen jetzt dort."
    - "Das Fenster Stufen sagt oben kurz, woher die Werte und die Farbe kommen, und einmal Speichern speichert alles: die Stufen und die Wartezeit."
    - "Keine Beta mehr: HouseMind ist kostenlos zu installieren und zu nutzen. Der Code ist offen zum Lesen, aber nicht zum Ändern oder Weitergeben. Die Änderungsliste beginnt bei 0.4.0."
"0.4.3":
  one: "Aktualisieren behält alles, was HouseMind weiß."
  list:
    - "Ein Update über Home Assistant behält alles: was HouseMind gelernt hat, deine Einstellungen, Stufen und Wartezeiten. Die Einrichtung und das Kennenlernen kommen nicht zurück; du siehst nur diese Nachricht."
    - "Das Handbuch sagt, wie du aktualisierst, und dass du HouseMind dafür nie entfernst: Entfernen wirft alles weg."
    - "Ein neuer Test prüft bei jeder Version, dass ein Update nichts vergisst."
"0.4.2":
  one: "Pro Lampe wählst du, nach wie vielen Minuten sie ausgeht, und Stufen gehen vor."
  list:
    - "Für jede Lampe wählst du mit einem Schieber, nach wie vielen Minuten sie ausgeht, wenn niemand mehr da ist: von sofort bis 30 Minuten. Wählst du nichts, lernt HouseMind es wie immer."
    - "Hat eine Lampe Stufen, bekommt sie immer eine ihrer vier Stufen, mit der Helligkeit und Farbe, die du gespeichert hast. Ist Gedimmt lila, ist das Nachtlicht lila."
    - "Auch der Tagesrhythmus wählt bei so einer Lampe nur eine Stufe, sie ändert sich also in Schritten."
    - "Kurz vor dem Ausgehen dimmt so eine Lampe einen Moment in der Farbe von Gedimmt. Kommst du zurück, bekommt sie ihr Licht und ihre Farbe zurück."
"0.4.1":
  one: "HouseMind 0.4.1 ist mit Home Assistant 2026.11 getestet."
  list:
    - "Auf Home Assistant 2026.11 ist HouseMind nicht mehr besonders vorsichtig: Es tut wieder selbst, was es darf, ohne vorher zu fragen."
    - "Die Tests mit einem echten Home Assistant laufen jetzt bei jeder Version auf GitHub: mit 2026.4, mit der Version dieses Monats und mit der Beta des nächsten Monats."
    - "Die Anleitung nennt die getesteten Versionen: 2026.4, 2026.10 und 2026.11."
"0.4.0":
  one: "HouseMind 0.4.0 ist bereit, die erste öffentliche Beta zu werden."
  list:
    - "Bald kann jeder HouseMind von GitHub installieren, mit fertigen, signierten Paketen für normale Computer und für ARM, etwa einen Raspberry Pi."
    - "Solange es eine Beta ist, steht die App in Home Assistant als experimentell."
    - "Eine neue Startseite und eine kurze, ehrliche Zusammenfassung, wie HouseMind getestet wird."
    - "Eine neue Installation legt ihre Datenbank in einem Schritt an; eine Installation ab 0.2.0 wächst einfach mit."
"0.3.33":
  one: "Eine Regel für Wörter, Zahlen und Namen, in jeder Sprache."
  list:
    - "Ein Akzent im Namen macht nichts mehr aus: ein Relais 'Garáge deur' ist so geschützt wie 'Garagedeur'."
    - "Ein kurzes Wort zählt nur als ganzes Wort – 'car' ist nie 'carbon' – und 'Tor2' ist einfach ein Tor."
    - "Zahlen und Größen schreibt HouseMind mit dem Dezimalzeichen deiner Sprache, auch in einer eigenen Sprachdatei."
    - "Der Bildschirm Energie liest die Zahlen von heute und die Ersparnis einmal pro Viertelstunde, nicht bei jeder Aktualisierung."
"0.3.32":
  one: "Die Morgenkarte und das Wandtablet folgen dem Rhythmus eures Hauses."
  list:
    - "Die Morgenkarte bleibt, solange es in eurem Haus Morgen ist, auch an einem späten Sonntag."
    - "Ein Wandtablet wird in der Nacht eures Hauses dunkel, nicht erst um elf."
    - "Ein Haus ohne Rhythmus behält die Uhr: die Karte von 5 bis 11 Uhr, das Tablet dunkel von 23 bis 6 Uhr."
    - "So folgen jetzt alle Bildschirme dem Haus, wie das Licht und Vestas Gruß."
"0.3.31":
  one: "Einstellungen stehen an einem Ort, und im Speicher."
  list:
    - "Jede Hauseinstellung steht in einer Tabelle: ihr Standardwert, ob ein Bildschirm sie ändern darf und ob sie in die Einstellungsdatei kommt."
    - "Was die Hauseinstellungen speichern, wird für jede Einstellung wirklich gespeichert; ein Test sorgt dafür."
    - "Einen Bildschirm zu aktualisieren fragt die Datenbank nicht mehr ständig nach den Einstellungen: Sie stehen im Speicher."
    - "Ändert sich eine Einstellung auf anderem Weg, etwa bei einem zurückgesetzten Tag, wird sie neu gelesen."
"0.3.30":
  one: "Eine Runde geht in einem großen Haus schneller."
  list:
    - "HouseMind weiß pro Raum und pro Gerät auf einmal, was dazugehört, statt dass jede Regel das ganze Haus durchsucht."
    - "Lüften, ein offenes Fenster bei der Heizung, das Licht in einem Raum und die Sensoren eines Geräts nutzen diese eine Liste."
    - "In einem Haus mit etwa 1.750 Entitäten geht eine Runde von etwa 15 auf etwa 6 Millisekunden, und ein größeres Haus wird nicht mehr quadratisch langsamer."
    - "Kommt ein Gerät hinzu oder zieht es in einen anderen Raum, zählt es sofort mit."
"0.3.29":
  one: "Bildschirme zu aktualisieren kostet weniger Arbeit, vor allem in einem großen Haus."
  list:
    - "Bereit für Autonomie? wird nur neu berechnet, wenn HouseMind etwas entschieden, gelernt oder eine Antwort bekommen hat oder etwas eingestellt wurde; sonst einmal pro Runde."
    - "Sind mehrere Bildschirme mit derselben Sprache und Stufe offen, teilen sie sich diese Arbeit."
    - "Ein volles Haus gibt einem Bildschirm höchstens fünfmal pro Sekunde ein neues Bild, und das neueste kommt immer an."
    - "In einem großen Haus mit drei offenen Bildschirmen kostet ein Sensor jetzt etwa 40 statt 150 Millisekunden."
"0.3.28":
  one: "Weniger auf den Bildschirmen: nur, was etwas von dir will."
  list:
    - "Geräte ohne Codes, und die Spalte Status ist aus, bis du sie wählst. Nur nicht verfügbar oder nicht erkannt steht dabei, und oben steht, wie viele nicht verfügbar sind."
    - "In Home Assistant öffnen bringt dich zum Gerät; dort wählst du auch ein anderes Symbol. Eine Stufe ausprobieren für den ganzen Raum steht jetzt im Fenster Stufen."
    - "Im Raumfenster siehst du die Momente. Starten tust du sie mit deiner Stimme oder auf dem Wandtablet."
    - "Check-up › System ist ein Satz, wenn alles in Ordnung ist; nur was nicht stimmt, bekommt eine Kachel."
    - "Unter dem Netzwerk keine Zeile Zuletzt um mehr, unter mehreren Fragen die Erklärung nur einmal, und Bereit für Autonomie? sagt, wie oft es gut ging, ohne Punktzahl."
"0.3.27":
  one: "Das Logbuch ist ruhiger: eine Zeile pro Entscheidung, weniger Knöpfe."
  list:
    - "Eine Frage, deine Antwort und was daraus wurde, stehen in einer Zeile: Du hast um 09:14 Ja gesagt."
    - "Keine Übersicht mit Prozenten und keine kleinen Bezeichnungen pro Zeile mehr, sondern eine graue Zeile: 18:29 · Wohnzimmer · getan. Gruppieren nach Art ist weg; Filter › Art macht das schon."
    - "Warum? gibt es nur noch bei Informiert; ab Beteiligt sagt die Zeile es selbst. Heute anders? ist ein kleiner Knopf."
    - "Spalten und Exportieren nur bei Experte, als CSV oder Markdown. Filter und Gruppieren erscheinen erst ab einer Liste von 20 Zeilen."
    - "Was an eine KI ging, steht an einer Stelle: im Logbuch bei Experte. Eine Benachrichtigung zur Information hat kein Später mehr."
"0.3.26":
  one: "Das Gehirn ist ruhiger: Was nur für Entwickler war, ist weg."
  list:
    - "Keine Messwerte, kein Entscheidungsverlauf und kein Gedankenstrom mehr im Gehirn, und darum auch kein Menü Mehr. Jede Entscheidung steht im Logbuch; bei Experte klappt sie zu ihren Prüfungen auf, in Worten."
    - "Bei Experte stehen unter einem Vorschlag oder einer Logbuch-Zeile keine Codes mehr, sondern Sätze wie: Ich bin mir zu 80 % sicher."
    - "Bereit für Autonomie?: keine doppelte Überschrift, kein Ring mit einer Zahl und keine Prozente mehr; ein Satz mit Mehr lesen zum Handbuch. Die Schwellen stehen nur noch in der Einstellungsdatei."
    - "Energie ohne die Tabelle pro Viertelstunde und ohne Hausbatterie und Auto: HouseMind steuert sie nicht, und Home Assistant zeigt sie schon."
    - "Die Reaktionszeit steht bei Experte in Über HouseMind. Meine Einstellungen haben keine Gruppe Hilfe mehr."
"0.3.25":
  one: "HouseMind ist schneller und macht weniger doppelte Arbeit."
  list:
    - "Ein Bildschirm startet schneller: Er bekommt die Texte in seiner Sprache einmal, ohne eine englische Liste daneben."
    - "Kommt jemand nach Hause, fragt HouseMind Home Assistant nicht mehr jedes Mal nach der ganzen Liste der Aktionen."
    - "Ein Raum schickt seine Geräte nur noch einmal an den Bildschirm."
    - "Sieht eine Kamera jemanden, zählt HouseMind diese Person sofort mit."
"0.3.24":
  one: "HouseMind ist sicherer: Ein ethischer Hack fand ein paar Lücken, und die sind zu."
  list:
    - "Ein Garagentor, Tor oder eine Tür hinter einem Schalter, Taster oder Relais öffnet HouseMind nie. Auch nicht, wenn jemand es einmal als Lampe markiert hat."
    - "Länger als eine Stunde pausieren kann nur ein Administrator. Wer pausiert hat, steht im Logbuch."
    - "Wer kein Administrator ist, geht standardmäßig bis Beteiligt und legt Hausregeln für ein einzelnes Gerät an. Eine Regel für einen Raum oder das ganze Haus legt ein Administrator fest."
    - "Eine Notfallmeldung kann niemand mehr mit Später wegschieben. Später gilt jetzt nur für dich."
    - "Auf einem gemeinsamen Lautsprecher zählt ein Ja zu einem Vorschlag nicht mehr; ein Nein schon. Vestas Name darf nur gewöhnliche Buchstaben enthalten."
"0.3.23":
  one: "Was du unter Sicherheit wählst, wird jetzt wirklich gespeichert."
  list:
    - "Welche Alarmanlage, die Geräusche, die Vorhänge beim Alarm, die Alarmanlage selbst einschalten, die Signallampen und die Vorhänge bei Feuer: Der Bildschirm sagte Gespeichert, aber HouseMind bekam die Wahl nie. Jetzt schon."
    - "Auch das Häkchen Auch aus der Historie lernen bleibt jetzt, wenn du es ausschaltest."
    - "Klappt das Speichern nicht, sagt der Bildschirm das, und nie mehr Gespeichert."
"0.3.22":
  one: "Wenn die Alarmanlage auslöst oder es brennt, tut das Haus mehr."
  list:
    - "Musik und Fernseher werden still, und die Warnung ertönt jede halbe Minute erneut, bis es vorbei ist."
    - "Lampen, die du unter Sicherheit wählst, blinken bei einem Einbruch rot. Das Wandtablet wird rot, mit dem Kamerabild und einem Knopf zur Alarmanlage."
    - "Auf deinem Telefon Knöpfe zur Kamera, zur Alarmanlage und 112. Wer die Meldung nach zwei Minuten nicht gesehen hat, bekommt sie noch einmal."
    - "Bei einem Brand gehen die gewählten Rollläden hoch, eine Klimaanlage geht aus, und die Meldung sagt, welche Tür abgeschlossen ist. HouseMind öffnet nie ein Schloss."
"0.3.21":
  one: "Die Alarmanlage kann sich selbst einschalten, und du kannst sie testen."
  list:
    - "Hast du die letzten fünf Male Ja zu ‚Alarmanlage einschalten?‘ gesagt, fragt HouseMind einen Administrator einmal, ob es das künftig selbst tun darf. Es geht auch unter Hauseinstellungen › Sicherheit."
    - "HouseMind schaltet die Alarmanlage dann selbst ein, wenn alle weg sind oder das Haus schläft, und sagt es sofort. Nur wenn es sicher ist: kein Sensor, der noch jemanden sieht, kein Fenster offen. Ausschalten tut es nie."
    - "Schaltet jemand sie zweimal schnell wieder aus, fragt HouseMind wieder."
    - "In Haus testen wählst du ‚Die Alarmanlage löst aus‘: Du siehst, was passiert, und mit Echt ausführen gehen die Lampen dieses Raums an und nur du bekommst die Meldung, als Test."
"0.3.20":
  one: "Vesta zeigt, dass die Alarmanlage an ist, und dass sie ausgelöst hat."
  list:
    - "Ist die Alarmanlage an, ist Vesta blau mit einem Schild: Gesichert. Nachts bleibt sie auf Gute Nacht, mit ‚gesichert‘ dazu."
    - "Hat die Alarmanlage ausgelöst und wurde wieder ausgeschaltet, steht Vesta auf Achtung, mit dem Zeitpunkt, bis jemand es gesehen hat."
    - "Alle bekommen dann auch eine Nachricht, damit es weiß, wer später heimkommt. Geht die Alarmanlage wieder an, verschwindet sie."
"0.3.19":
  one: "Hinweise bei Wasser, das nachts wegläuft, bei Regen mit etwas Offenem und bei einer Störung, und Automatisierungen an einem Gerät gehen zusammen aus und an."
  list:
    - "Zählt die Wasseruhr nachts jede Stunde ein wenig weiter, während niemand Wasser braucht, bekommst du morgens einen Hinweis: Vielleicht tropft ein Hahn oder die Toilette läuft nach."
    - "Regnet es in der nächsten Stunde, während ein Fenster oder eine Außentür offen ist, bekommen alle einen Hinweis mit dem, was offen ist."
    - "Meldet ein Gerät selbst eine Störung, etwa eine Wärmepumpe oder ein Schalter, der zu heiß wird, erfährst du es. Überhitzung und Überlastung sind wichtig."
    - "Steuern mehrere Automatisierungen dieselbe Lampe, schaltet HouseMind sie zusammen aus und zusammen wieder ein. Kann es eine nicht übernehmen, bleiben alle an."
"0.3.18":
  one: "Die Alarmanlage steht im Logbuch, und nach dem Ausschalten stellt HouseMind das Haus zurück."
  list:
    - "Einschalten, Auslösen und Ausschalten der Alarmanlage stehen jetzt im Logbuch, jeweils in einer Zeile. Beim Auslösen steht dabei, was HouseMind tat, statt einer Zeile pro Lampe."
    - "Eine Minute nach dem Ausschalten gehen die Lampen und Vorhänge zurück, wie sie kurz vor dem Auslösen waren. Was du in dieser Minute selbst geändert hast, und das Licht in einem Raum, in dem jemand ist, bleibt so."
    - "Bei jeder Handlung nennt Warum? jetzt den echten Grund, etwa ‚weil der Alarm ausgelöst hat‘, auch nach einem Neustart."
"0.3.17":
  one: "Jeder Raum bekommt sein eigenes Licht, und HouseMind erkennt eine Dusche und stickige Luft."
  list:
    - "Küche und Essbereich mit einem Sensor sind jetzt eigene Räume. Gehst du im Dunkeln in die Küche, geht dort das Licht an, auch wenn der Essbereich schon hell ist. Schaltet ihr das Küchenlicht immer wieder aus, lernt HouseMind, dass das Licht des Essbereichs dort reicht."
    - "Steigt die Feuchtigkeit im Bad schnell, während gerade jemand da war, duscht jemand. Das Licht bleibt dann an, auch wenn der Sensor dich hinter dem Duschvorhang nicht sieht, und der Lüfter geht sofort an."
    - "Bleibt das CO₂ dort, wo jemand ist, eine Viertelstunde hoch, bekommst du einen Hinweis zum Lüften. Nachts kommt keiner: Dann sagt es der Morgenüberblick."
    - "In Haus testen zählt die Zone eines Raums jetzt als Sensor dieses Raums. Auch der Essbereich hat dann Jemand kommt herein und Niemand mehr da."
"0.3.16":
  one: "Ein Haustier schaltet nachts kein Licht mehr ein und weckt das Haus nicht."
  list:
    - "In Räumen mit Haustieren zählt, was nur ein Sensor sieht, nicht als Person, während das Haus schläft oder niemand zu Hause ist. Das gilt jetzt auch für einen Präsenzsensor, denn der sieht einen Hund genauso gut."
    - "Ein Mensch zählt schon: eine Kamera, die dort eine Person sieht, jemand, der dort einen Schalter benutzt, jemand, der gerade aus einem Raum ohne Haustiere kommt (die Treppe hinunter, aus dem Bad), oder ein Bewohner, der gerade nach Hause kommt."
    - "Der Hund weckt das Haus nicht mehr früh. Ab einer halben Stunde vor eurer üblichen Aufstehzeit weckt Bewegung das Haus wieder. Vor der Schlafenszeit bleibt alles, wie es war."
"0.3.15":
  one: "Die Info-Seite von HouseMind in Home Assistant zeigt jetzt kurz, was HouseMind für dich tut."
  list:
    - "Unter Einstellungen › Apps › HouseMind erzählt die Info-Seite, was HouseMind dir abnimmt, mit drei Bildschirmen der App und einem Tag mit HouseMind."
    - "Die Dokumentation hat neue Bilder und erklärt jetzt auch den Morgen und die Nacht, die Hinweise wie einen Boiler, der nicht aufheizt, den Check-up und die Stufen einer Lampe."
    - "Die Datenschutzerklärung in der Dokumentation ist jetzt dieselbe wie in der App."
"0.3.14":
  one: "Heizt der Boiler seit über einem Tag nicht auf, bekommst du einen Hinweis."
  list:
    - "Ist das Wasser im Boiler mindestens 10 Grad kälter, als er eingestellt ist, und hat er seit über einem Tag nicht aufgeheizt? Dann bekommen alle eine wichtige Nachricht, mit der Temperatur des Wassers."
    - "Schau dann am Gerät oder in seiner eigenen App nach, ob es eine Störung gibt oder der Strom weg ist. HouseMind selbst ändert nichts am Boiler."
    - "Ist der Boiler aus oder auf Abwesend, oder ist das Haus im Urlaub, bekommst du das nicht. Heizt er wieder auf, verschwindet die Nachricht von selbst."
"0.3.13":
  one: "Der Morgenüberblick ist wieder nur einmal zu hören, auch wenn das Vorlesen etwas dauert."
  list:
    - "Ein langer Morgenüberblick wurde manchmal ein paar Mal hintereinander gesagt. HouseMind hielt das Vorlesen für fehlgeschlagen, weil es so lange dauerte."
    - "Jetzt zählt ein Satz, der noch vorgelesen wird, als gesagt. Klappt es wirklich nicht, etwa weil der Lautsprecher aus ist, merkt HouseMind das sofort und versucht es später noch einmal."
    - "Das gilt für alles, was Vesta von sich aus sagt, etwa den Check vor dem Schlafen. Und HouseMind wartet nicht mehr eine halbe Minute auf den Lautsprecher: Der Rest des Hauses läuft währenddessen einfach weiter."
"0.3.12":
  one: "Haus testen: Bei ‚Das Haus schläft‘ steht jede Lampe nur noch einmal."
  list:
    - "Wählst du in Haus testen ‚Das Haus schläft‘, siehst du pro Lampe eine Zeile: was Gute Nacht tut, wenn alle gerade ins Bett gegangen sind."
    - "Vorher stand eine Lampe manchmal zweimal da: aus, ‚weil schon eine Weile niemand da ist‘, und aus, ‚weil das Haus schlafen geht‘. Das Erste gehört zu ‚Niemand mehr da‘."
    - "Was HouseMind wirklich tut, bleibt gleich: In der ersten halben Stunde der Nacht gehen die Lampen in leeren Räumen aus und offene Vorhänge zu."
"0.3.11":
  one: "Lernen und Stufen ist kurz; was HouseMind über dein Zuhause weiß, steht jetzt im Gehirn, und du kannst es jederzeit wieder ändern."
  list:
    - "Hauseinstellungen › Lernen und Stufen hat nur noch Lernen, die Historie und die Bereiche. Zwei Knöpfe bringen dich ins Gehirn."
    - "Im Gehirn gibt es für Administratoren einen neuen Tab: Was ich weiß. Mit Kacheln für Zu bestätigen, Bestätigt, Stimmt nicht und Szenen und Skripte, nach Raum, und was zu einem Gerät gehört, eingeklappt."
    - "Alles lässt sich zurücknehmen, auch nach Stimmt oder Stimmt nicht: wähle etwas anderes, sag Stimmt doch nicht, oder stell es zurück zu Zu bestätigen. HouseMind merkt sich, was es selbst dachte."
    - "Die Automatisierungen stehen jetzt an einer Stelle: Gehirn › Bereit für Autonomie? › Automatisierungen, mit dem, was sie tun, und Ausschalten oder Wieder einschalten. Die Schwellen stehen in der Karte eines Bereichs; einen früheren Tag zurückholen bei Neu beginnen."
    - "Was von der KI kommt, steht überall in Lila dabei: von der KI."
"0.3.10":
  one: "Gute Nacht: Geht das Haus schlafen, schaltet HouseMind aus, was noch an ist, und schließt, was noch offen ist."
  list:
    - "Die Lampen in Räumen, in denen niemand ist, gehen aus, auch in einem Raum ohne Bewegungsmelder. Schlafzimmer und draußen bleiben, wie sie sind."
    - "Vorhänge und Rollläden, die noch offen sind, gehen zu, auch im Sommer, wenn es erst nach der Schlafenszeit dunkel wird."
    - "Einmal pro Nacht, in der ersten halben Stunde: Schaltest du danach selbst etwas ein, bleibt es so."
    - "Wie jede Regel beginnt es mit Zusehen und Fragen. Unter Haus testen siehst du es mit ‚Das Haus schläft‘."
"0.3.9":
  one: "Haus testen macht es jetzt wirklich: Wähle, was passiert, und mit Echt ausführen geht die Lampe an und der Vorhang zu."
  list:
    - "So tun, als ob und Jetzt ausprobieren sind zusammen Nachspielen. Du wählst, was passiert, und siehst sofort, was HouseMind tun würde; es wird noch nichts geschaltet."
    - "Mit Echt ausführen tut HouseMind alles aus dieser Liste wirklich in deinem Haus, und im Netzwerk siehst du es fließen. Nach einer Minute geht alles von selbst zurück, oder früher mit Zurücksetzen. Solange der Test läuft, lassen die üblichen Regeln diese Geräte in Ruhe."
    - "Bei jeder Zeile steht ehrlich, wie es echt ginge: mache ich auch echt, frage ich erst, schaue ich nur zu, oder nicht und warum. Eine Hausregel oder eine Automatisierung hält auch den Test auf."
    - "Abend bringt das Licht dieses Abends mit: im November ist es dann dunkel, und im Test gehen die Vorhänge zu. Entscheidungen, die sich widersprechen, wie Aufgestanden und Alle weg, gehen nicht mehr zusammen."
    - "Die Testviertelstunde heißt jetzt Selbst herumgehen: ein Bereich steht eine Weile auf Selbstständig, und du gehst selbst durch den Raum."
"0.3.8":
  one: "Auf einem Computer ist Haus testen jetzt ein kleiner Knopf oben rechts."
  list:
    - "Auf einem Computer, in einem Browser, steht Haus testen nicht mehr im Menü links. Du öffnest es mit dem Kolben oben rechts, neben der Hilfe und der Tour."
    - "Das Feld steht wie immer rechts neben deinem Haus. Solange es offen ist, leuchtet der Kolben. Noch einmal tippen oder Schließen schließt es."
    - "Auf einem Telefon ändert sich nichts: Haus testen bleibt der Tab Testen unten. In einem schmaleren Fenster und in der App von Home Assistant bleibt es im Menü."
"0.3.7":
  one: "Während du die Stufen einer Lampe einstellst, lässt HouseMind diese Lampe in Ruhe."
  list:
    - "Solange das Fenster Stufen offen ist, tut keine Regel, kein Vorschlag und keine Hausregel etwas mit dieser Lampe. Nur Sicherheit geht vor."

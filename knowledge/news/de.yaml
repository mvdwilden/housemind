    - "Administratoren hören jetzt sofort, wenn in Home Assistant etwas Wichtiges nicht stimmt, zum Beispiel ein altes Backup, mit Ansehen. Vesta weiß es auch: ‘Ist etwas kaputt in Home Assistant?’"
    - "Home Assistant aufgeräumt zeigt jetzt auch Automatisierungen, die lange nicht liefen, das Backup, die Datenbank und den Speicher, und was nach einem Update nicht mehr funktioniert."
    - "In Home Assistant aufgeräumt kannst du jetzt nach einem Ja etwas ausschalten, zum Beispiel eine doppelte Entität. HouseMind löscht nichts, und Wieder einschalten geht immer. Mit Absichtlich aus, So lassen und Kein Doppel bleibt, was du entschieden hast."
    - "Home Assistant aufgeräumt sieht jetzt auch Zähler aus den Energieeinstellungen, die stillstehen, eine Integration, die seit einem Tag nichts misst, und einen fehlenden Netzzähler in den Energieeinstellungen."
    - "Administratoren sehen unter Hauseinstellungen › Home Assistant aufgeräumt, was in Home Assistant kaputt ist: eine Integration, die nicht startet, ein Gerät, das nicht antwortet, eine doppelte Entität oder eine Automatisierung, die auf etwas verweist, das es nicht mehr gibt. Jede Karte öffnet die richtige Stelle in Home Assistant."
    - "Notfallmeldungen sagen genau, was passiert ist, zum Beispiel wie viele Lampen angingen."
    - "Frag ‚Warum ist die Heizung nicht an?‘: Vesta sagt warum und wann, oder dass sie es nicht weiß."
    - "Bei ‚Bereit für Selbstständigkeit?‘ siehst du pro Bereich, wie oft jemand eingegriffen hat, über vier Wochen."
    - "Fenster funktionieren gut mit der Tastatur, und Groß macht nur die Schrift größer."
    - "Eine Hausregel oder einen Moment entfernen fragt zuerst Ja oder Nein."
    - "HouseMind startet zuverlässiger und erholt sich nach einer Störung von selbst."
    - "HouseMind reagiert viel schneller, auch in einem großen Haus: Nach einer Änderung rechnet es nur den Raum durch, um den es geht."
    - "Bildschirme werden leichter aktualisiert: Nach dem ersten Mal geht nur mit, was sich geändert hat – Handys und das Wandtablet sind schneller."
    - "Die Anleitung in der App sieht jetzt aus wie online, mit nummerierten Kapiteln, und kann den ganzen Bildschirm füllen oder in einem eigenen Fenster öffnen."
    - "Lange Listen zeigen, wie viele es sind, und haben Seiten, wählbare Spalten, kompakte Zeilen, eine Übersicht pro Art und, auf einem Computer, Exportieren als CSV, Markdown oder JSON."
    - "Was HouseMind selbst an Warmwasser, Wärmepumpe oder Einspeisung eingestellt hat, stellt es zurück, wenn es nicht mehr nötig ist, in der Pause und wenn es stoppt. Reagiert HouseMind nicht, macht das die Verknüpfung in Home Assistant."
    - "Unter Energie siehst du jetzt und heute: die Sonne, das Netz, das Haus, jeden Hausspeicher und das Auto, was Strom heute und diesen Monat kostet, Tipps und die größten Verbraucher. Den Hausspeicher und das Auto steuert HouseMind nicht; Vesta sagt dir aber, wann Laden am günstigsten ist."
    - "HouseMind lernt auch aus den Labels und Kategorien in Home Assistant, als Hinweis: Es fragt zuerst, bevor es deshalb etwas bedient, und du kannst in den Listen danach filtern. Ein Label wie Home Assistant oder Netzwerk lässt nur in Ruhe, was HouseMind selbst nicht kennt."
    - "Unter Energie stehen die nächsten 24 Stunden als Uhr und der Plan in einer Grafik: der Preis (blau, wenn er negativ ist), was hereinkommt und wohin es geht, vor jetzt, was gemessen wurde, und was HouseMind pro Gerät tut. Energie steht jetzt auch auf ‚Bereit für Selbstständigkeit?‘."
    - "Auf Experte wählst du in Meine Einstellungen, ob Vesta ihr Fenster mit einer Frage von selbst öffnet. ‚Bis morgen‘ pausiert bis zum nächsten 06:00, auch nach Mitternacht."
    - "Vesta hört zu: Eine Antwort gehört zu ihrer Frage, getippt oder gesprochen. Ohne KI gibt sie Möglichkeiten als Knöpfe, auch Warum?, und sagt ehrlich, was sie nicht weiß, statt zu raten. Mit einer KI sprichst du frei mit ihr, mit dem Gespräch dazu; etwas tun geschieht erst nach deinem Ja."
    - "Ist Vesta rot, orange oder bernsteinfarben, steht in der Zeile unter ihrem Wort, warum, auf jedem Reiter, mit ‚+2‘, wenn mehr wartet. Tippst du darauf, öffnet sich das Logbuch bei dieser Meldung."
    - "Auf Supervised funktioniert HouseMind einfach weiter. Home Assistant unterstützt diese Art der Installation seit 2025.12 nicht mehr; ist Home Assistant Supervised, oder nennt der Supervisor die Installation nicht unterstützt oder fehlerhaft, bekommen die Administratoren eine ruhige Meldung."
    - "Unter Gehirn, bei ‚Bereit für Selbstständigkeit?‘, sagt jede Fähigkeit in einem Raum in einem Satz, wann HouseMind es tut, mit dem, was es gelernt hat, etwa ‚Ich schalte die Lampe im Flur ein, sobald jemand hereinkommt und es dunkel ist‘. Auf Experte steht darunter genau, warum."

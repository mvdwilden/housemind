    - "Een kort woord telt alleen als heel woord – 'car' is nooit 'carbon' – en 'poort2' is gewoon een poort."
    - "Getallen en grootten schrijft HouseMind met het decimaalteken van jouw taal, ook in een eigen taalbestand."
    - "Het scherm Energie leest de cijfers van vandaag en de besparing één keer per kwartier, niet bij elke update."

# Wat is nieuw, per versie (E-150): één zin voor Geïnformeerd, een korte lijst voor Betrokken
# en Expert. In eenvoudige taal, zonder merknamen.
"0.4.7":
  one: "Temperaturen per ruimte, en een vraag maar één keer."
  list:
    - "Bij een thermostaat kies je nu zelf de temperatuur voor Thuis, Slapen en Weg, in halve graden: in Brein › Apparaten › Temperaturen. Met ‘Pas na’ kies je hoe lang iedereen weg moet zijn voordat het Weg wordt."
    - "Bedien je een lamp zelf, met een schakelaar of in de app, dan blijft dat hooguit een half uur staan. Daarna neemt HouseMind het weer over, ook de kleur en helderheid."
    - "Een vraag beantwoord je één keer: zodra iemand antwoordt, is hij overal weg, ook op de telefoons van anderen. Een oude knop doet daarna niets meer."
    - "Een nee op de vraag of het alarm voortaan zelf aan mag, en een nee op zorg, blijven bewaard: die vraag komt niet terug."
    - "Het venster Temperaturen heeft echte knoppen, schrijft temperaturen zoals jij (18,5°) en opent op Koelen als de thermostaat koelt."
"0.4.4":
  one: "HouseMind heeft je lampen voor zichzelf."
  list:
    - "Staat in een ruimte een lichtregel op Autonoom, dan doet HouseMind ook het dagritme van die lampen zelf, met hun standen. Adaptive Lighting stuurt ze dan niet meer."
    - "Zolang je de standen van een lamp instelt, rust Adaptive Lighting voor die lamp. Alleen jij stuurt hem dan; na Klaar stuurt de groep weer."
    - "In Wat ik weet kies je wat een schakelaar schakelt: een lamp, een apparaat of een ander apparaat. Ook schakelaars die door een label een lamp werden, staan daar nu."
    - "Het venster Standen zegt bovenaan kort waar de waarden en de kleur vandaan komen, en één keer Bewaren bewaart alles: de standen en de wachttijd."
    - "Geen bèta meer: HouseMind is gratis te installeren en te gebruiken. De code is open om te lezen, maar niet om aan te passen of door te geven. De wijzigingslijst begint bij 0.4.0."
"0.4.3":
  one: "Bijwerken houdt alles wat HouseMind weet."
  list:
    - "Een update via Home Assistant houdt alles: wat HouseMind leerde, je instellingen, standen en wachttijden. De inrichting en de kennismaking komen niet terug; je ziet alleen dit bericht."
    - "De handleiding zegt hoe je bijwerkt, en dat je HouseMind daarvoor nooit verwijdert: verwijderen gooit alles weg."
    - "Een nieuwe test controleert bij elke versie dat een update niets vergeet."
"0.4.2":
  one: "Per lamp kies je na hoeveel minuten hij uitgaat, en standen gaan voor."
  list:
    - "Bij elke lamp kies je met een schuif na hoeveel minuten hij uitgaat als er niemand meer is: van meteen tot 30 minuten. Kies je niets, dan leert HouseMind het zoals altijd."
    - "Heeft een lamp standen, dan krijgt hij altijd een van zijn vier standen, met de helderheid en de kleur die je bewaarde. Is Gedimd paars, dan is het nachtlicht paars."
    - "Ook het dagritme kiest bij zo'n lamp alleen een stand, dus hij gaat in stappen."
    - "Vlak voor uit dimt zo'n lamp even in de kleur van Gedimd. Kom je terug, dan krijgt hij zijn licht en kleur terug."
"0.4.1":
  one: "HouseMind 0.4.1 is getest met Home Assistant 2026.11."
  list:
    - "Op Home Assistant 2026.11 is HouseMind niet meer extra voorzichtig: het doet weer zelf wat het mag, zonder eerst te vragen."
    - "De tests tegen een echte Home Assistant draaien nu bij elke versie op GitHub: met 2026.4, met de versie van deze maand en met de bèta van volgende maand."
    - "De handleiding noemt de geteste versies: 2026.4, 2026.10 en 2026.11."
"0.4.0":
  one: "HouseMind 0.4.0 is klaar om de eerste openbare bèta te worden."
  list:
    - "Straks kan iedereen HouseMind installeren vanaf GitHub, met kant-en-klare, ondertekende pakketten voor gewone computers en voor ARM, zoals een Raspberry Pi."
    - "Zolang het een bèta is, staat de App in Home Assistant als experimenteel."
    - "Een nieuwe voorpagina en een korte, eerlijke samenvatting van hoe HouseMind getest wordt."
    - "Een nieuwe installatie maakt haar database in één stap; een installatie vanaf 0.2.0 groeit gewoon door."
"0.3.33":
  one: "Eén regel voor woorden, getallen en namen, in elke taal."
  list:

    - "In een huis met ongeveer 1.750 entiteiten gaat een ronde van ongeveer 15 naar ongeveer 6 milliseconden, en een groter huis wordt niet meer kwadratisch trager."
    - "Komt er een apparaat bij of verhuist het naar een andere ruimte, dan telt het meteen mee."
"0.3.29":

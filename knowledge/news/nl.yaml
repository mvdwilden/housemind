    - "Een huis dat nog geen ritme heeft, houdt de klok: de kaart van 5 tot 11 uur, de tablet donker van 23 tot 6 uur."
    - "Zo volgen nu alle schermen het huis, net als het licht en de groet van Vesta."
"0.3.31":
  one: "Instellingen staan op één plek, en in het geheugen."

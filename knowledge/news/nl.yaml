    - "HouseMind reageert veel sneller, ook in een groot huis: het rekent na een verandering alleen de ruimte uit waar het om gaat."
    - "Schermen worden lichter bijgewerkt: na de eerste keer gaat alleen mee wat veranderde, zodat telefoons en de wandtablet sneller zijn."
    - "De handleiding in de app ziet er nu uit zoals online, met genummerde hoofdstukken, en kan op het hele scherm of in een eigen venster."
    - "Lange lijsten tonen hoeveel er is en hebben pagina's, kolommen naar keuze, compacte rijen, een overzicht per soort en, op een computer, Exporteren als CSV, Markdown of JSON."
    - "Wat HouseMind zelf instelde aan boiler, warmtepomp of teruglevering, zet het terug als het niet meer nodig is, bij pauze en als het stopt. Reageert HouseMind niet, dan doet de koppeling in Home Assistant dat."
    - "Bij Energie zie je nu en vandaag: de zon, het net, het huis, elke thuisbatterij en de auto, wat stroom vandaag en deze maand kost, tips en de grootste verbruikers. De thuisbatterij en de auto stuurt HouseMind niet; Vesta zegt wel wanneer laden het goedkoopst is."
    - "HouseMind leert ook van de labels en categorieën in Home Assistant, als hint: het vraagt eerst voordat het iets daardoor bedient, en je filtert er in de lijsten op. Een label als Home Assistant of Netwerk laat alleen met rust wat HouseMind zelf niet kent."
    - "Bij Energie staat de komende 24 uur als klok, en het plan in één grafiek: de prijs (blauw als hij negatief is), wat er binnenkomt en waar het heen gaat, vóór nu wat er gemeten is en per apparaat wat HouseMind doet. Energie staat nu ook op ‘Klaar voor autonomie?’."
    - "Op Expert kies je bij Mijn voorkeuren of Vesta zelf haar venster opent met een vraag. ‘Tot morgen’ pauzeert tot de eerstvolgende 06:00, ook na middernacht."
    - "Vesta luistert: een antwoord hoort bij haar vraag, getypt of gezegd. Zonder AI geeft ze keuzes als knoppen, ook Waarom?, en zegt ze eerlijk wat ze niet weet in plaats van te raden. Met een AI praat je vrij met haar, met het gesprek erbij; iets laten doen gebeurt pas na jouw ja."
    - "Is Vesta rood, oranje of amber, dan staat in de regel onder haar woord waarom, op elk tabblad, met ‘+2’ als er meer wacht. Tik erop en Logboek opent bij die melding."
    - "Op Supervised werkt HouseMind gewoon. Home Assistant ondersteunt die manier van installeren sinds 2025.12 niet meer; is Home Assistant Supervised, of noemt de Supervisor de installatie niet ondersteund of niet gezond, dan krijgen de beheerders één rustige melding."
    - "In Brein, bij ‘Klaar voor autonomie?’, zegt elke vaardigheid in een ruimte in één zin wanneer HouseMind het doet, met wat het leerde, zoals ‘Ik doe de lamp in de hal aan zodra iemand binnenkomt en het donker is’. Op Expert staat eronder precies waarom."

# Energy rules for Germany (E-69). Amounts are defaults with a source and a date; an
# administrator can override them.
schema: 1
country: DE
currency: EUR
energy:
  vat: 0.19
  energy_tax_per_kwh: {value: 0.0205, valid_from: "2026-01-01", source: "Stromsteuer for households 2026"}
  net_metering: null
  # New installations get no feed-in payment in hours with a negative market price (2025).
  export_paid_at_negative_price: false
  quarter_hour_prices: true
  capacity_tariff: null
  # Controllable devices (heat pump, charger) may be limited by the grid operator to a minimum
  # power while the grid is busy.
  controllable_load: {minimum_kw: 4.2}

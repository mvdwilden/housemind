# Energy rules for Belgium (Flanders as default; E-69). Amounts are defaults with a source and a
# date; an administrator can override them.
schema: 1
country: BE
currency: EUR
energy:
  vat: 0.06
  energy_tax_per_kwh: null
  net_metering: null
  export_paid_at_negative_price: false
  quarter_hour_prices: true
  # Capacity tariff: the highest quarter-hour power of each month, at least 2.5 kW, is billed
  # per kW per year (about 50–60 € depending on the grid area).
  capacity_tariff: {basis: month_peak_quarter_hour, minimum_kw: 2.5, per_kw_year: 55.0, valid_from: "2026-01-01", source: "Fluvius tariff cards 2026"}
  controllable_load: null

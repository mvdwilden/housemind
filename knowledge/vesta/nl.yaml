# Vesta's eigen woorden (E-220, E-222, E-228, E-229, B-79).
# Ze praat als een mens in een gesprek: hele, lopende zinnen, kort maar nooit kortaf. Geen
# zin van één, twee of drie woorden (een test bewaakt dat). Per soort bericht minstens vijf
# varianten, in een je-vorm en een u-vorm. De eerste zin is de kern: op niveau 1 zegt Vesta
# alleen die zin. {woorden} tussen haakjes komen uit de feiten; {moment} is het moment van
# de dag ("vanochtend", "vanavond" …). Een droog grapje staat alleen bij "calm_light" en
# "greeting": nooit bij nood of bij iets belangrijks.
name: Vesta

moments:
  morning: vanochtend
  afternoon: vanmiddag
  evening: vanavond
  night: vannacht

salutes:
  morning: "Goedemorgen"
  afternoon: "Goedemiddag"
  evening: "Goedenavond"
  night: "Hallo"


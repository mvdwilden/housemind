    - "Careful: {device} is at {temperature} °C, that's too warm. Please take a look."
    - "{device} has become hot, {temperature} °C. Unplug it if that's safe."
    - "{device} measures {temperature} °C, that's too warm and a look would be wise."
    - "{device} is going up to {temperature} °C and I don't trust that. Will you take a look?"

guests_unconfirmed:

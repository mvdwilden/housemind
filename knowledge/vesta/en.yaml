    - "The battery of {device} is almost empty."
    - "{device} will need a new battery soon."
    - "A job for later: the battery of {device} is running out."
    - "{device} is running low, so it needs a new battery."
    - "The battery of {device} is nearly flat, no rush but don't forget it."

ha_lost:

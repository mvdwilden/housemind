    - "{device} is not responding any more. It's a safety sensor, so please check it as soon as you can."
    - "I don't hear from {device} any more, and it's a safety sensor. Please check it as soon as you can."
    - "{device} has gone quiet. Because it's a safety sensor: will you check it as soon as you can?"
    - "Heads up: {device} no longer answers. It's a safety sensor, so please check it as soon as you can."
    - "I'm missing {device}, and it's a safety sensor. Will you see what's wrong as soon as you can?"

filter:

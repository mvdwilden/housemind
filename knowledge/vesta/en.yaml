    - "Careful: {device} is still on, and everyone is out."
    - "{device} is on and the house is empty, do you want to switch it off?"
    - "Nobody is home, but {device} is still on. Can you take a look?"
    - "{device} is still on while nobody is home, you'll want to know that."

fridge_open:

    - "The connection with Home Assistant is gone; I keep trying again."
    - "I cannot reach Home Assistant at the moment. As soon as I can, I will check that everything works."
    - "Home Assistant does not answer; until it is back, I switch nothing myself."
    - "I am missing Home Assistant right now, but I will connect again by myself."

offline:

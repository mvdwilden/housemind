    - "The water has been running for {minutes} minutes without anyone using it, maybe there's a leak."
    - "Water has been running for {minutes} minutes, but I see nobody using it."
    - "Water has been flowing for {minutes} minutes and nobody seems to use it. Will you take a look?"
    - "Water that nobody uses has been running for {minutes} minutes. Can you check it?"

water_valve_closed:
  je:
    - "I closed {device}, because water had been running for {minutes} minutes without anyone using it."
    - "{device} is closed: water ran too long, {minutes} minutes. Please check for a leak."
    - "To be safe I closed {device}, water was running for {minutes} minutes."
    - "The water is off through {device}, because it ran for {minutes} minutes while nobody used it."
    - "I shut off the water with {device}. Will you check whether there's a leak somewhere?"

waste:
  je:
    - "{what} is collected tomorrow, will you put the bin out?"
    - "Will you remember the bin? {what} is collected tomorrow."
    - "Tomorrow it's time for the waste: {what}."
    - "{what} goes tomorrow, so the bin can go out on the street."
    - "Tomorrow is collection day for {what}, don't forget the bin."

battery:

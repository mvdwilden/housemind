# About herself, when someone asks her name or who she is (E-242).
about_me:
  je:
    - "I'm {name}, the voice of this home. I keep an eye on what happens here and help wherever I can."
    - "My name is {name}, and I look after the house for you and tell you when something matters."
    - "I'm {name}, nice to meet you. Feel free to ask me anything about the house."
    - "{name}, the voice of your home. I make sure the house does what it should, so you don't have to think about it."
    - "I'm {name}, I live here with you and look after the house, even when you're away."

# Another question after her answer (E-252): she asks them one by one.
next_question:
  je:
    - "I have one more question for you, if you have a moment."
    - "There's something else I'd like to ask you."
    - "One more thing, and then I'll leave you be."
    - "I'd like to ask you something else, if that's all right."
    - "Then I have another question for you."

# After 'Later' on her question (E-252): it stays under Notifications.
ask_later:
  je:
    - "Fine, I'll ask you again a little later."
    - "No problem, I'll come back to it later."
    - "All right, it stays under Notifications until you have time."
    - "That's fine, I'll ask again in a while."
    - "Later is fine too, I'll remember it for you."

# After 'I'll look into it' on a notice she mentioned (E-381): she lets it rest while it stays so.
ask_seen:
  je:
    - "Fine, I'll let it rest for now."
    - "Good, then I won't bring it up again while it stays like this."
    - "Thanks for looking into it. I'll only say something when it changes."
    - "Right, I'll keep quiet about it for now."
    - "Thank you, then I'll leave it be for the time being."
# After 'Don't show again' or 'ignore it' (E-382): never again, undone in the Log.
ask_muted:
  je:
    - "Fine, I won't tell anyone at home about that again. You can switch it back in Logbook."
    - "All right, nobody at home will hear about it from me any more. Logbook puts it back."
    - "Agreed, I'll leave it out for everyone from now on. You can switch it back in Logbook."
    - "Clear, I'll skip that message for the whole house from now on. Logbook puts it back."
    - "Fine, nobody at home will hear about it from me again. You can switch it back in Logbook."
# After 'Done' on a message with a task (E-252).
ask_done:
  je:
    - "Good, then I'll cross it off."
    - "Lovely, that's sorted out then."
    - "Thank you, I'll take it off the list."
    - "Great, then I won't remind you about it again."
    - "Fine, that one is off the list."

# Na 👍 of 👎 op ‘Was dat goed?’ in haar venster (E-298).
answer_thumbs:
  je:
    - "Thank you, that helps me do it better."
    - "Good that you tell me, I will remember it."
    - "Good to know, I learn from that."
    - "Thanks a lot, I will take it into account."
    - "Clear, that is how I learn what suits this house."


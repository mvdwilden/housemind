    - "I don't hear from {device} any more, is it still plugged in?"
    - "{device} no longer answers, maybe the connection is gone."
    - "{device} has gone quiet, will you check that it's still on?"
    - "I'm missing {device}, because it doesn't respond any more. Can you take a look?"

offline_safety:

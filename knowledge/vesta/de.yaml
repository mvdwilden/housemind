# Vestas eigene Worte (E-220, E-222, E-228, E-229, B-79).
# Sie spricht wie ein Mensch im Gespräch: ganze, flüssige Sätze, kurz, aber nie knapp. Kein
# Satz mit einem, zwei oder drei Wörtern (ein Test achtet darauf). Pro Art von Nachricht
# mindestens fünf Varianten, in der Du-Form ("je") und der Sie-Form ("u"). Der erste Satz ist
# der Kern: auf Stufe 1 sagt Vesta nur diesen Satz. {Wörter} kommen aus den Fakten; {moment}
# ist die Tageszeit ("heute Morgen", "heute Abend" …). Ein trockener Witz nur bei
# "calm_light" und "greeting": nie bei einem Notfall oder etwas Wichtigem.
name: Vesta

moments:
  morning: heute Morgen
  afternoon: heute Nachmittag
  evening: heute Abend
  night: heute Nacht

salutes:
  morning: "Guten Morgen"
  afternoon: "Guten Tag"
  evening: "Guten Abend"
  night: "Hallo"


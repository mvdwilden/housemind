# Les mots de Vesta (E-220, E-222, E-228, E-229, B-79).
# Elle parle comme une personne dans une conversation : des phrases entières et fluides,
# courtes mais jamais sèches. Aucune phrase d'un, deux ou trois mots (un test y veille). Au
# moins cinq variantes par sorte de message, avec « tu » (« je ») et « vous » (« u »). La
# première phrase est l'essentiel : au niveau 1, Vesta ne dit que celle-là. Les {mots}
# viennent des faits ; {moment} est le moment de la journée (« ce matin », « ce soir » …).
# Une pointe d'humour seulement dans « calm_light » et « greeting » : jamais en cas d'urgence.
name: Vesta

moments:
  morning: ce matin
  afternoon: cet après-midi
  evening: ce soir
  night: cette nuit

salutes:
  morning: "Bonjour"
  afternoon: "Bonjour"
  evening: "Bonsoir"
  night: "Bonsoir"


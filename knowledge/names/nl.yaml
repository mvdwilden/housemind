# Ruimtes die zonder lidwoord staan: "de camera buiten".
alone: [buiten, binnen, boven, beneden]
# Woorden die zo achter het naamwoord mogen: "de lamp links".
sides: [links, rechts, midden, voor, achter, boven, onder, groot, klein]
# How a state is said (E-243). French agrees: masculine, feminine, and both plurals.
states:
  "on": ["aan"]
  "off": ["uit"]
  open: ["open"]
  closed: ["dicht"]
  locked: ["op slot"]
  unlocked: ["niet op slot"]

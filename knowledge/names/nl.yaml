  rolluik: [n, rolluiken]
  zonwering: [f, zonweringen]
  screen: [n, screens]
  jaloezie: [f, jaloezieën]
  markies: [f, markiezen]
  thermostaat: [m, thermostaten]
  radiator: [m, radiatoren]
  verwarming: [f, verwarmingen]
  airco: [f, airco's]
  ventilator: [m, ventilatoren]
  afzuigkap: [f, afzuigkappen]

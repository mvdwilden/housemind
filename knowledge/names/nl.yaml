# Gewone namen voor apparaten (E-248, B-93): hoe Vesta een apparaat noemt, zoals een mens.
# Geen namen uit één huis: alleen gewone woorden. Een nieuwe taal is een nieuw bestand.
grammar: nl
and: "en"
one_of: "een van {np}"
# Telwoorden en woorden die nooit een onderscheid zijn.
of: "van"  # a person in a room's name, only when two rooms would sound the same
numbers: [een, één, twee, drie, vier, vijf, zes, zeven, acht, negen, tien, eerste, tweede, derde, vierde]
fillers: [van, de, het, een, met, en, voor, bij, op, in, aan, groep, nieuw, oud, hoofd]
# woord: [geslacht, meervoud] – m, f of n (het-woord). Ook samenstellingen: "bureaulamp" → lamp.
nouns:
  lamp: [m, lampen]
  licht: [n, lichten]
  verlichting: [f, verlichting]
  spot: [m, spots]
  ledstrip: [m, ledstrips]
  lichtstrip: [m, lichtstrips]
  raam: [n, ramen]
  venster: [n, vensters]
  deur: [f, deuren]

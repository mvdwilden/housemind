  magnetron: [m, magnetrons]
  boiler: [m, boilers]
  warmtepomp: [f, warmtepompen]
  tv: [m, tv's]
  televisie: [f, televisies]
  speaker: [m, speakers]
  luidspreker: [m, luidsprekers]
  versterker: [m, versterkers]
  stofzuiger: [m, stofzuigers]
  stofzuigrobot: [m, stofzuigrobots]
  robot: [m, robots]
  grasmaaier: [m, grasmaaiers]
  maaier: [m, maaiers]
  kraan: [f, kranen]
  klep: [f, kleppen]
  laadpaal: [m, laadpalen]
  lader: [m, laders]
  batterij: [f, batterijen]
  pomp: [f, pompen]
  bevochtiger: [m, bevochtigers]
  ontvochtiger: [m, ontvochtigers]
  thermometer: [m, thermometers]

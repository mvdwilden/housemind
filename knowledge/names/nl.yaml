  sirene: [f, sirenes]
  rookmelder: [m, rookmelders]
  melder: [m, melders]
  sensor: [m, sensoren]
  stopcontact: [n, stopcontacten]
  schakelaar: [m, schakelaars]
  stekker: [m, stekkers]
  wasmachine: [f, wasmachines]
  machine: [f, machines]
  droger: [m, drogers]
  vaatwasser: [m, vaatwassers]

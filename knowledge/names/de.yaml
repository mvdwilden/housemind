# Einfache Namen für Geräte (E-248, B-93): wie Vesta ein Gerät nennt, wie ein Mensch.
# Keine Namen aus einem Haus: nur gewöhnliche Wörter. Eine neue Sprache ist eine neue Datei.
grammar: de
and: "und"
one_of: ""  # "eine der Lampen" hängt vom Geschlecht ab: dann einfach der Name
of: "von"  # a person in a room's name, only when two rooms would sound the same
numbers: [eins, ein, eine, zwei, drei, vier, fünf, sechs, sieben, acht, neun, zehn, erste, zweite, dritte]
fillers: [von, der, die, das, den, dem, ein, eine, mit, und, für, bei, auf, im, in, am, an, gruppe, neu, alt, haupt]

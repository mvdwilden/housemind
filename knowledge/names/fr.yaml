# Noms simples pour les appareils (E-248, B-93) : comment Vesta nomme un appareil, comme une
# personne. Aucun nom d'une maison : seulement des mots ordinaires. Une nouvelle langue est un
# nouveau fichier.
grammar: fr
and: "et"
one_of: ""  # "l'un"/"l'une" dépend du genre : alors simplement le nom
of: "de"  # a person in a room's name, only when two rooms would sound the same
numbers: [un, une, deux, trois, quatre, cinq, six, sept, huit, neuf, dix, premier, première, deuxième, troisième]
fillers: [de, du, des, le, la, les, l, un, une, et, avec, pour, au, à, groupe, nouveau, nouvelle, ancien, principal]
# mot : [genre, pluriel] – m ou f. Un nom suivi de "de …" le garde : "détecteur de fumée".

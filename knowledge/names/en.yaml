# Plain names for devices (E-248, B-93): how Vesta names a device, the way a person does.
# No names from one house: only ordinary words. A new language is a new file.
grammar: en
and: "and"
one_of: "one of {np}"
of: "of"  # a person in a room's name, only when two rooms would sound the same
numbers: [one, two, three, four, five, six, seven, eight, nine, ten, first, second, third, fourth]
fillers: [of, the, a, an, and, with, for, at, on, in, group, new, old, main]
# word: [gender, plural] – English has no gender; "n" keeps the form simple.
